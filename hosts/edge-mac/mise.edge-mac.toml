# The edge Mac itself, applied by `mise run //hosts/edge-mac:apply`.

[vars]
vm_name = "Talos"
usb_device = "303A:831A" # the ZBT-2 Zigbee dongle, as VID:PID
# A release tag of h-wb/pipelines; the same pin as the laptops' in dotfiles.
collector_version = "collector-v0.3.0"
# The main cluster's gateways, reached through the WireGuard tunnel: Miroir is
# on the internal one, its media bucket on the external one.
miroir_address = "192.168.1.202"
bucket_address = "192.168.1.201"
# The tunnel's name in the WireGuard app: the imported file's name.
tunnel = "wg-main"
# The App Store's command line, as the Intel .pkg of a GitHub release; sha256
# is the asset's `digest` in the release API.
mas_version = "7.0.0"
mas_sha256 = "9bca1de1fb6ea19c9e0b9d7b7c85249020c9ed65a9d434c2ef40896a2f3395f9"
wireguard_app = "1451685025" # WireGuard's id in the App Store
# Where the `secrets` task leaves the domain, which is not in git.
collector_zone = "cat ~/.config/miroir-collector/zone 2>/dev/null || true"

# Only used during apply, to install the collector; nothing at run time needs
# mise or uv.
[tools]
uv = "0.13.9"

# Pinned GitHub releases; sha256 is the asset's `digest` in the release API.
# An app already in /Applications is adopted only when identical to the pin,
# otherwise apply stops before changing anything (README, "First apply").
[bootstrap.packages."macos-app:utm"]
version = "4.7.5"
url = "https://github.com/utmapp/UTM/releases/download/v{{version}}/UTM.dmg"
sha256 = "a8435c93cfb5f8bbfeea4b134cfad1ac66b67632b75e438c63b1a8ae043bef0e"
artifact = "UTM.app"
adopt = true

# The asset without `-arm64` is the Intel build.
[bootstrap.packages."macos-app:bluebubbles"]
version = "1.9.12"
url = "https://github.com/BlueBubblesApp/bluebubbles-server/releases/download/v{{version}}/BlueBubbles-{{version}}.dmg"
sha256 = "6858a914e3d2e7fd40b1ecf5d24ea4789ea0e33af6b3ad2bf1a940e090abff57"
artifact = "BlueBubbles.app"
adopt = true

[bootstrap.directories."/usr/local/libexec"]
[bootstrap.directories."/usr/local/libexec/edge-mac"]

# What files/vm.sh sources.
[bootstrap.files."/usr/local/libexec/edge-mac/config.env"]
template = true
content = """
VM_NAME={{ vars.vm_name }}
USB_DEVICE={{ vars.usb_device }}
"""
owner = "root"
group = "wheel"

[bootstrap.files."/usr/local/libexec/edge-mac/vm.sh"]
source = "files/vm.sh"
owner = "root"
group = "wheel"

# Key-only ssh: with FileVault off and auto-login, the account password would
# otherwise be all that guards it. macOS starts sshd per connection, so this
# holds from the next one. `apply` checks a key login works before it runs.
[bootstrap.directories."/etc/ssh/sshd_config.d"]

[bootstrap.files."/etc/ssh/sshd_config.d/200-key-only.conf"]
content = """
PasswordAuthentication no
KbdInteractiveAuthentication no
"""
owner = "root"
group = "wheel"

# UTM's own preferences. The quit policy only exists from UTM 5: there, a
# macOS restart or logout powers Talos down instead of saving VM state. Never
# set NoQuitConfirmation: it makes UTM kill running VMs on quit.
[bootstrap.settings.macos.defaults."com.utmapp.UTM"]
KeepRunningAfterLastWindowClosed = true
PreventIdleSleep = true
NoUsbPrompt = true
QuitRunningVirtualMachinesPolicy = 1 # request power down

# Lock the auto-logged-in session after a minute (with "require password
# immediately", which only System Settings can set).
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.screensaver"
key = "idleTime"
value = 60
host = "current"

# ── WireGuard to the main site ──────────────────────────────────────────────
# Miroir is only served on the main site's LAN. This Mac reaches it the way
# the MacBook does when away: a split WireGuard tunnel to that site, with this
# Mac's own peer. The tunnel's configuration comes from Proton Pass through
# the `secrets` task, the app from the App Store through the hook below, and
# the agent keeps the tunnel up. Only the one-time import is by hand (README).
[bootstrap.directories."~/.config/wireguard"]
mode = "0700"

# WireGuard for macOS only exists in the App Store. mise's own `mas:` packages
# need `mas` on PATH, which an ssh session's does not include, and its `brew:`
# packages skip Intel Macs, so this installs both: the pinned mas, then the
# app. It needs this Mac signed in to the App Store; without that it says so
# and apply carries on. Nothing runs once the app is there.
[bootstrap.hooks.post-packages]
description = "Install WireGuard from the App Store"
run = '''
[ -d /Applications/WireGuard.app ] && exit 0
PATH="/usr/local/bin:$PATH"
if [ "$(mas version 2>/dev/null)" != "{{ vars.mas_version }}" ]; then
	dir=$(mktemp -d)
	curl -fsSL -o "$dir/mas.pkg" \
		"https://github.com/mas-cli/mas/releases/download/v{{ vars.mas_version }}/mas-{{ vars.mas_version }}-x86_64.pkg"
	echo "{{ vars.mas_sha256 }}  $dir/mas.pkg" | shasum -a 256 -c - >/dev/null
	sudo installer -pkg "$dir/mas.pkg" -target / >/dev/null
	rm -rf "$dir"
fi
# `install` for an app this account already has, `get` for one it never had.
mas install {{ vars.wireguard_app }} || mas get {{ vars.wireguard_app }} ||
	echo "WireGuard not installed: sign in to the App Store on the Mac's screen, then apply again" >&2
'''

# Every minute, and at login: a no-op while the tunnel is connected. scutil
# drives the tunnel's network extension, so the app need not be open.
[bootstrap.macos.launchd.agents.wireguard]
program = "/usr/sbin/scutil"
args = ["--nc", "start", "{{ vars.tunnel }}"]
run_at_load = true
start_interval = 60
process_type = "Background"
stdout_path = "~/Library/Logs/edge-mac.log"
stderr_path = "~/Library/Logs/edge-mac.log"

# ── Miroir collector ────────────────────────────────────────────────────────
# Reads this Mac's Messages database and delivers what is new to Miroir, every
# minute (README, "Miroir collector"). The domain and the delivery token are
# not in git: `mise run //hosts/edge-mac:secrets` writes them to
# ~/.config/miroir-collector/{zone,token}, and the templates below read the
# first. Run it before apply.
[bootstrap.directories."~/.config/miroir-collector"]
mode = "0700"

[bootstrap.files."~/.config/miroir-collector/config.json"]
template = true
mode = "0600"
content = """
{
  "state_dir": "~/Library/Application Support/miroir-collector",
  "sources": [
    {
      "id": "messages",
      "source": "apple_messages",
      "receive_url": "https://miroir.{{ exec(command=vars.collector_zone) | trim }}/api/connections/messages/receive",
      "token_env": "MIROIR_TOKEN_MESSAGES",
      "options": { "media": true }
    }
  ]
}
"""

# Miroir and its bucket are not in this site's DNS, and pointing the whole
# zone at the main site's resolver would make every lookup in it depend on the
# tunnel. Two names are enough.
[bootstrap.files."/etc/hosts"]
id = "miroir"
template = true
owner = "root"
group = "wheel"
block = """
{{ vars.miroir_address }} miroir.{{ exec(command=vars.collector_zone) | trim }}
{{ vars.bucket_address }} s3.{{ exec(command=vars.collector_zone) | trim }}
"""

# uv brings its own Python 3.12 (macOS 13 ships 3.9) and leaves the program at
# ~/.local/bin/miroir-collector. Reinstalls only when the pin changes.
[bootstrap.hooks.post-tools]
description = "Install the pinned Miroir collector"
run = '''
want="{{ vars.collector_version }}"
have="collector-v$("$HOME/.local/bin/miroir-collector" --version 2>/dev/null | awk '{ print $2 }')"
[ "$have" = "$want" ] || {{ mise_bin }} exec -- uv tool install --quiet --force --python 3.12 \
	"git+https://github.com/h-wb/pipelines@$want#subdirectory=collector"
'''

# One pass, then it exits; a pass with nothing new takes a fraction of a
# second. The shell only reads the token: it execs the collector, so the
# process that opens the Messages database is the collector's own Python (the
# one to give Full Disk Access).
[bootstrap.macos.launchd.agents.miroir-collector]
program = "/bin/sh"
args = [
  "-c",
  '''export MIROIR_TOKEN_MESSAGES="$(cat "$HOME/.config/miroir-collector/token")"; exec "$HOME/.local/bin/miroir-collector" run --config "$HOME/.config/miroir-collector/config.json"''',
]
run_at_load = true
start_interval = 60
process_type = "Background"
stdout_path = "~/Library/Logs/miroir-collector.log"
stderr_path = "~/Library/Logs/miroir-collector.log"

# utmctl refuses to work over ssh, so the three vm.sh agents run in the desktop
# session. Every minute: start the VM if it is not running.
[bootstrap.macos.launchd.agents.edge-vm]
program = "/bin/sh"
args = ["/usr/local/libexec/edge-mac/vm.sh", "up"]
run_at_load = true
start_interval = 60
stdout_path = "~/Library/Logs/edge-mac.log"
stderr_path = "~/Library/Logs/edge-mac.log"

# On demand only: `vm.sh request-stop` kickstarts it from ssh.
[bootstrap.macos.launchd.agents.edge-vm-stop]
program = "/bin/sh"
args = ["/usr/local/libexec/edge-mac/vm.sh", "stop"]
stdout_path = "~/Library/Logs/edge-mac.log"
stderr_path = "~/Library/Logs/edge-mac.log"

# On demand only: `mise run //hosts/edge-mac:reboot` kickstarts it. It restarts
# through the one sudoers rule the final hook installs.
[bootstrap.macos.launchd.agents.edge-reboot]
program = "/bin/sh"
args = ["/usr/local/libexec/edge-mac/vm.sh", "reboot"]
stdout_path = "~/Library/Logs/edge-mac.log"
stderr_path = "~/Library/Logs/edge-mac.log"

# `open -W` returns when the app exits, so launchd reopens it.
[bootstrap.macos.launchd.agents.bluebubbles]
program = "/usr/bin/open"
args = ["-W", "-g", "-j", "-a", "/Applications/BlueBubbles.app"]
keep_alive = true
throttle_interval = 60

# mise has no power or system-wide settings. One pmset key per call: a key this
# model lacks must not drop the others.
[bootstrap.hooks.final]
description = "Never sleep (lid closed included); no self-installing macOS updates; passwordless restart"
run = '''
for setting in "sleep 0" "disksleep 0" "displaysleep 5" "standby 0" "autopoweroff 0" \
	"powernap 0" "womp 1" "autorestart 1" "disablesleep 1"; do
	sudo pmset -a $setting || echo "pmset: '$setting' not applied" >&2
done
sudo defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticallyInstallMacOSUpdates -bool false
# Lets the edge-reboot agent restart the Mac with no password and no prompt.
# Through visudo, not [bootstrap.files]: a sudoers file that does not parse
# takes sudo down with it.
rule=$(mktemp)
printf '%s\n' '%admin ALL=(root) NOPASSWD: /sbin/shutdown -r now' >"$rule"
visudo -cf "$rule" >/dev/null && sudo install -o root -g wheel -m 0440 "$rule" /etc/sudoers.d/edge-mac-reboot ||
	echo "sudoers rule for reboot not installed" >&2
rm -f "$rule"
'''

# ── Checks ──────────────────────────────────────────────────────────────────
# `mise run //hosts/edge-mac:check` runs only this task on the Mac.
[tasks.bootstrap]
description = "Check what an unattended boot depends on"
run = "{{ mise_bin }} doctor project"

[doctor.checks.filevault]
description = "FileVault is off (auto-login needs it)"
run = "fdesetup status | grep -q 'FileVault is Off'"
hint = "System Settings → Privacy & Security → FileVault"

[doctor.checks.autologin]
description = "Auto-login is set to this user"
run = '[ "$(defaults read /Library/Preferences/com.apple.loginwindow autoLoginUser)" = "$(id -un)" ]'
hint = "System Settings → Users & Groups → Automatically log in as"

# A login with no method at all is refused with the list sshd still accepts.
[doctor.checks.ssh-key-only]
description = "sshd accepts keys only"
run = '''
ssh -o BatchMode=yes -o PreferredAuthentications=none -o StrictHostKeyChecking=no \
	-o UserKnownHostsFile=/dev/null 127.0.0.1 2>&1 | grep -q 'Permission denied (publickey)\.'
'''
hint = "apply installs /etc/ssh/sshd_config.d/200-key-only.conf (read by sshd from macOS 13)"

[doctor.checks.no-sleep]
description = "System sleep is off, lid closed included"
run = '''
[ "$(pmset -g | awk '$1 == "sleep" { print $2 }')" = 0 ] &&
	[ "$(pmset -g | awk '$1 == "SleepDisabled" { print $2 }')" = 1 ]
'''
hint = "apply sets it in the final hook; look for 'pmset: ... not applied' in its output"

[doctor.checks.os-updates]
description = "macOS updates do not install themselves"
run = '[ "$(defaults read /Library/Preferences/com.apple.SoftwareUpdate AutomaticallyInstallMacOSUpdates)" = 0 ]'
hint = "apply sets it in the final hook"

[doctor.checks.reboot-rule]
description = "The reboot agent may restart the Mac without a password"
run = "sudo -n -l /sbin/shutdown -r now"
hint = "apply installs /etc/sudoers.d/edge-mac-reboot in the final hook"

[doctor.checks.vm]
description = "The VM is running"
run = "pgrep -qf QEMULauncher"
hint = "the edge-vm agent retries every minute and logs to ~/Library/Logs/edge-mac.log"

[doctor.checks.usb]
description = "The Zigbee dongle is plugged in"
run = "ioreg -p IOUSB -w0 | grep -q ZBT-2"

# The agent is `open -W`, which lives exactly as long as the app.
[doctor.checks.bluebubbles]
description = "BlueBubbles is running under its agent"
run = '''launchctl print "gui/$(id -u)/dev.mise.bluebubbles" | grep -q "state = running"'''

[doctor.checks.collector]
description = "The Miroir collector is installed"
run = '"$HOME/.local/bin/miroir-collector" --version'
hint = "apply installs it in the post-tools hook"

[doctor.checks.secrets]
description = "The domain, the delivery token and the tunnel's configuration are on this Mac"
run = '''
[ -s "$HOME/.config/miroir-collector/zone" ] && [ -s "$HOME/.config/miroir-collector/token" ] &&
	[ -s "$HOME/.config/wireguard/wg-main.conf" ]
'''
hint = "mise run //hosts/edge-mac:secrets from a workstation, then apply"

[doctor.checks.wireguard-app]
description = "WireGuard is installed"
run = "[ -d /Applications/WireGuard.app ]"
hint = "sign in to the App Store on the Mac's screen, then apply: the post-packages hook installs it"

[doctor.checks.wireguard-tunnel]
description = "The WireGuard tunnel is imported"
run = '''scutil --nc list | grep -q '"wg-main"' '''
hint = "in WireGuard, Import tunnel(s) from file: ~/.config/wireguard/wg-main.conf (README)"

[doctor.checks.wireguard-up]
description = "The main site's gateway answers through the tunnel"
run = "nc -z -G 5 192.168.1.202 443"
hint = "scutil --nc status wg-main; the wireguard agent retries every minute and logs to ~/Library/Logs/edge-mac.log"

# Without a token Miroir answers 401; anything else means the tunnel or
# /etc/hosts is in the way.
[doctor.checks.collector-route]
description = "Miroir answers by name"
run = '''
[ "$(curl -s -o /dev/null -m 10 -w '%{http_code}' -X POST \
	"https://miroir.$(cat "$HOME/.config/miroir-collector/zone")/api/connections/messages/report")" = 401 ]
'''
hint = "the tunnel (check above), then the miroir block in /etc/hosts"

# The collector exits 0 after a pass that delivered or found nothing new.
[doctor.checks.collector-run]
description = "The collector's last pass succeeded"
run = '''launchctl print "gui/$(id -u)/dev.mise.miroir-collector" | grep -q "last exit code = 0"'''
hint = "~/Library/Logs/miroir-collector.log; a first run needs Full Disk Access for the collector's Python (README)"

