# Workstation side: every task is remote.sh, which takes the Mac's address and
# ssh key from Proton Pass. What lands on the Mac is mise.edge-mac.toml, which
# only loads under MISE_ENV=edge-mac: a plain `mise bootstrap` here changes
# nothing.

[tasks."ssh:setup"]
description = "Install the Proton Pass ssh key on the edge Mac (asks for its password once)"
depends = ["//:pass:login"]
raw = true
run = "sh remote.sh ssh-setup"

[tasks.apply]
description = "Apply this directory to the edge Mac over ssh (asks for sudo there)"
depends = ["//:pass:login"]
raw = true # sudo prompts on the Mac
run = "sh remote.sh apply"

[tasks.diff]
description = "Show what apply would change on the edge Mac"
depends = ["//:pass:login"]
run = "sh remote.sh diff"

[tasks.check]
description = "Report what would stop the edge Mac coming back up unattended"
depends = ["//:pass:login"]
run = "sh remote.sh check"

[tasks.reboot]
description = "Shut the Talos VM down cleanly, then restart the edge Mac"
depends = ["//:pass:login"]
run = "sh remote.sh reboot"

[tasks.ssh]
description = "Run a command on the edge Mac, or open a shell"
depends = ["//:pass:login"]
raw = true
usage = 'arg "[command]" var=#true'
# usage hands the words over shell-quoted: eval reads them back.
run = 'eval "sh remote.sh ssh ${usage_command:-}"'
