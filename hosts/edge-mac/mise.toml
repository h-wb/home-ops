# Workstation side. What lands on the Mac is mise.edge-mac.toml, which only
# loads under MISE_ENV=edge-mac: a plain `mise bootstrap` here changes nothing.

[bootstrap.remote]
mise_env = ["edge-mac"]

[bootstrap.remote.hosts.edge-mac]
host = "edge-mac" # ssh alias

# The Mac's sshd is key-only once applied, so nothing is applied before a key
# login works: ssh:setup first, and apply refuses without it.
[tasks."ssh:setup"]
description = "Install this workstation's ssh keys on the edge Mac (asks for its password once)"
raw = true
run = ["ssh-copy-id edge-mac", { task = ":ssh:verify" }]

[tasks."ssh:verify"]
description = "Fail unless key login to the edge Mac works"
hide = true
run = """
ssh -o BatchMode=yes -o PreferredAuthentications=publickey edge-mac true ||
	{ echo 'no key login to edge-mac: run `mise run //hosts/edge-mac:ssh:setup`' >&2; exit 1; }
"""

[tasks.apply]
depends = [":ssh:verify"]
description = "Apply this directory to the edge Mac over ssh (asks for sudo there)"
dir = "{{config_root}}"
raw = true # sudo prompts on the Mac
run = "mise bootstrap remote edge-mac --skip task"

[tasks.diff]
description = "Show what apply would change on the edge Mac"
dir = "{{config_root}}"
run = "mise bootstrap remote edge-mac --skip task --dry-run"

[tasks.check]
description = "Report what would stop the edge Mac coming back up unattended"
dir = "{{config_root}}"
run = "mise bootstrap remote edge-mac --only task"

# From a tailnet client the route to the Mac is the subnet router inside the
# VM, so the ssh session dies when the VM stops: sudo is unlocked first, and the
# rest runs detached on the Mac. A failure is in /tmp/edge-mac-reboot.log there.
[tasks.reboot]
description = "Shut the Talos VM down cleanly, then restart the edge Mac (asks for sudo)"
raw = true # sudo prompts on the Mac
run = """
ssh -t edge-mac 'sudo -v && { sudo nohup sh /usr/local/libexec/edge-mac/vm.sh reboot </dev/null >/tmp/edge-mac-reboot.log 2>&1 & }'
"""
