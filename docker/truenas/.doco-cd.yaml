---
# Root deploy config for the TrueNAS host. Every subdirectory holding a
# docker-compose.yaml is its own stack; removing the directory removes the stack.
working_dir: ./docker/truenas
auto_discovery:
  enabled: true
  depth: 1
  delete: true
reconciliation:
  enabled: true
  interval: 3600
---
# doco-cd deploys itself (SELF_UPDATE_ENABLED); name must match its compose project.
name: doco-cd
working_dir: ./docker/truenas/.doco-cd
compose_files:
  - compose.main.yaml
timeout: 120
