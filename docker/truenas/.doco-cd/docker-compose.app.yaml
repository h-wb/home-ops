---
# doco-cd itself — it can't manage itself, so this is installed once as a
# TrueNAS "Custom App" (Apps → Discover → Custom App, paste this file).
# Bump the image here and in the Custom App together.
#
# Host prerequisites (not in Git):
#   /mnt/ssd-storage/docker/doco-cd/data               (dataset, root-owned)
#   /mnt/ssd-storage/docker/doco-cd/secrets/api_secret
#   /mnt/ssd-storage/docker/doco-cd/secrets/webhook_secret
name: doco-cd

secrets:
  api_secret:
    file: /mnt/ssd-storage/docker/doco-cd/secrets/api_secret
  webhook_secret:
    file: /mnt/ssd-storage/docker/doco-cd/secrets/webhook_secret

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.121.0
    container_name: doco-cd
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      HTTP_PORT: 8880
      DEPLOY_CONFIG_BASE_DIR: ./docker/truenas/
      TZ: America/Los_Angeles
      POLL_CONFIG: |-
        - url: https://github.com/h-wb/home-ops.git
          reference: main
          interval: 300
      API_SECRET_FILE: /run/secrets/api_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    secrets:
      - api_secret
      - webhook_secret
    ports:
      - "8880:8880"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/ssd-storage/docker/doco-cd/data:/data
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
