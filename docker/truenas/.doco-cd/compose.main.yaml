---
# Main doco-cd instance: deploys every stack in ./docker/truenas and the updater
# (compose.updater.yaml). It is itself deployed by the updater through
# ../.doco-cd.updater.yaml, so both instances are updated from Git.
#
# Host prerequisites (not in Git):
#   /mnt/ssd-storage/docker/doco-cd/data
#   /mnt/ssd-storage/docker/doco-cd/secrets/api_secret
#   /mnt/ssd-storage/docker/doco-cd/secrets/webhook_secret
#   /mnt/ssd-storage/docker/doco-cd/secrets/bws_token  (external-secrets machine account)
name: doco-cd

secrets:
  api_secret:
    file: /mnt/ssd-storage/docker/doco-cd/secrets/api_secret
  webhook_secret:
    file: /mnt/ssd-storage/docker/doco-cd/secrets/webhook_secret
  bws_token:
    file: /mnt/ssd-storage/docker/doco-cd/secrets/bws_token

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.121.0
    container_name: doco-cd
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      HTTP_PORT: 8880
      DEPLOY_CONFIG_BASE_DIR: ./docker/truenas/
      TZ: America/Los_Angeles
      POLL_CONFIG: |-
        - url: https://github.com/h-wb/home-ops.git
          reference: main
          interval: 300
      API_SECRET_FILE: /run/secrets/api_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      SECRET_PROVIDER: bitwarden_sm
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/bws_token
    secrets:
      - api_secret
      - webhook_secret
      - bws_token
    ports:
      - "8880:8880"
      - "9120:9120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/ssd-storage/docker/doco-cd/data:/data
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
