---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Diff Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster: ["main"]
      fail-fast: false
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: origin/${{ github.event.repository.default_branch }}

      - name: Diff Images
        id: diff
        run: |
          flate diff images --path ./kubernetes/clusters/${{ matrix.cluster }} --output json > images.json

          echo "images=$(jq --compact-output '.' images.json)" >> $GITHUB_OUTPUT

          echo '## New images to Pull' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq '.' images.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-${{ matrix.cluster }}
          path: images.json

  # pull:
  #   if: ${{ needs.diff.outputs.images != '[]' }}
  #   needs: diff
  #   name: Image Pull - Pull Images
  #   runs-on: ${{ format('home-ops-runner-{0}', matrix.cluster) }}
  #   strategy:
  #     matrix:
  #       cluster: ["main"]
  #     fail-fast: false
  #   steps:
  #     - name: Download Diff
  #       uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
  #       with:
  #         name: diff-${{ matrix.cluster }}
  #         path: .

  #     - name: Install talosctl
  #       run: curl -fsSL https://talos.dev/install | sh

  #     - name: Pull Images
  #       run: |
  #         images=$(jq -r '.[]' images.json)
  #         for image in $images; do
  #           echo "Pulling $image"
  #           talosctl --nodes $NODE image pull "$image"
  #         done

  success:
    if: ${{ !cancelled() }}
    needs: diff
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
