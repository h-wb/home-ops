[tasks."node:apply"]
description = "Apply Talos config to a node"
usage = '''
arg "<node>" env="NODE" help="Node IP/hostname to apply config to"
flag "--insecure" help="Apply over a maintenance-mode (insecure) connection"
complete "node" run="talosctl config info -o yaml | yq '.nodes[]'"
'''
run = '''
mise run //talos:render-config "${usage_node}" | talosctl -n "${usage_node}" apply-config -f /dev/stdin ${usage_insecure:+--insecure}
'''

[tasks.download-image]
description = "Download Talos machine image"
usage = '''
arg "<version>" help="Talos version to download (e.g. v1.13.3)"
'''
quiet = true
run = '''
schematic="$(mise run //talos:gen-schematic-id)"
gum spin --title "Downloading Talos ${usage_version} ..." -- \
curl -sfL --remove-on-error --retry 5 --retry-delay 5 --retry-all-errors \
    -o "${TALOS_DIR}/talos-${usage_version}-${schematic:0:8}.iso" \
    "https://factory.talos.dev/image/${schematic}/${usage_version}/metal-amd64.iso"
mise //:log info "Downloaded Talos" version "${usage_version}" schematic "${schematic}"
'''

[tasks.gen-schematic-id]
description = "Generate schematic ID from Talos schematic"
quiet = true
run = '''
curl -sX POST --data-binary "$(mise run //:template ${TALOS_DIR}/schematic.yaml.j2)" \
    "https://factory.talos.dev/schematics" | jq -r '.id'
'''

[tasks."node:reboot"]
description = "Reboot a node"
usage = '''
arg "<node>" env="NODE" help="Node IP/hostname to reboot"
complete "node" run="talosctl config info -o yaml | yq '.nodes[]'"
'''
run = '''
gum confirm "Reboot node ${usage_node}?" --default="No" && \
    talosctl -n "${usage_node}" reboot -m powercycle || exit 0
'''

[tasks.gen-talosconfig]
description = "Generate/regenerate the talosconfig client file from PKI secrets"
run = '''
#!/usr/bin/env bash
set -euo pipefail
endpoint=$(mise run //:template "${TALOS_DIR}/machineconfig.yaml.j2" | yq -e 'select(.cluster) | .cluster.controlPlane.endpoint')
talosctl gen config "${CLUSTER}" "${endpoint}" \
    --with-secrets <(mise run //:template "$(dirname "${TALOS_DIR}")/secrets.yaml.j2") \
    -o "${TALOS_DIR}/talosconfig" -t talosconfig -f
nodes=()
for f in "${TALOS_DIR}"/nodes/*.yaml.j2; do
    nodes+=("$(basename "${f%.yaml.j2}")")
done
talosctl --talosconfig "${TALOS_DIR}/talosconfig" config endpoint "${nodes[@]}"
talosctl --talosconfig "${TALOS_DIR}/talosconfig" config node "${nodes[@]}"
mise //:log info "Generated talosconfig" cluster "${CLUSTER}"
'''

[tasks.renew-certs]
description = "Renew the admin client certificates of $CLUSTER: talosconfig, kubeconfig and its Proton Pass copy"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run //talos:gen-talosconfig
mise run //bootstrap:kubeconfig
# dotfiles renders ~/.kube/<cluster>.yaml on every workstation from this field.
if gum confirm "Write the new kubeconfig to Proton Pass (Machines/kubeconfig, field ${CLUSTER})?" --default="Yes"; then
    if pass-cli item update --vault-name Machines --item-title kubeconfig --field "${CLUSTER}=$(cat "${KUBECONFIG}")" >/dev/null; then
        mise //:log info "Updated Proton Pass" item "Machines/kubeconfig" field "${CLUSTER}"
    else
        mise //:log warn "Proton Pass not updated: paste the file into the field by hand" file "${KUBECONFIG}" item "Machines/kubeconfig" field "${CLUSTER}"
    fi
fi
expiry() { printf '%s' "$1" | base64 -d | openssl x509 -noout -enddate | cut -d= -f2; }
mise //:log info "New certificates" cluster "${CLUSTER}" \
    talosconfig "$(expiry "$(yq -r '.contexts[].crt' "${TALOSCONFIG}" | head -1)")" \
    kubeconfig "$(expiry "$(yq -r '.users[0].user."client-certificate-data"' "${KUBECONFIG}")")"
mise //:log info "Next: mise run apply in dotfiles on each workstation" machines "MacBook, code-server, neko, CachyOS"
'''

[tasks.render-config]
description = "Render Talos config for a node"
usage = '''
arg "<node>" env="NODE" help="Node IP/hostname to render config for"
complete "node" run="talosctl config info -o yaml | yq '.nodes[]'"
'''
run = '''
#!/usr/bin/env bash
export IS_CONTROLLER=$(mise run "//talos:_machine:controller" "${usage_node}")
talosctl machineconfig patch <(mise run //:template "${TALOS_DIR}/machineconfig.yaml.j2") \
    -p @<(mise run //:template "${TALOS_DIR}/nodes/${usage_node}.yaml.j2")
'''

[tasks."node:reset"]
description = "Reset a node"
usage = '''
arg "<node>" env="NODE" help="Node IP/hostname to reset"
complete "node" run="talosctl config info -o yaml | yq '.nodes[]'"
'''
run = '''
gum confirm "Reset node ${usage_node}?" --default="No" && \
    talosctl -n "${usage_node}" reset --graceful=false "$@" || exit 0
'''

[tasks."node:shutdown"]
description = "Shutdown a node"
usage = '''
arg "<node>" env="NODE" help="Node IP/hostname to shut down"
complete "node" run="talosctl config info -o yaml | yq '.nodes[]'"
'''
run = '''
gum confirm "Shutdown node ${usage_node}?" --default="No" && \
    talosctl -n "${usage_node}" shutdown --force "$@" || exit 0
'''

[tasks.upgrade-k8s]
description = "Upgrade Kubernetes version on the cluster"
usage = '''
arg "<version>" help="Kubernetes version to upgrade to (e.g. 1.33.1)"
'''
run = '''
controller=$(talosctl config info -o yaml | yq -e '.endpoints[0]')
talosctl -n "${controller}" upgrade-k8s --to "${usage_version}"
'''

[tasks."node:upgrade"]
description = "Upgrade Talos version on a node"
usage = '''
arg "<node>" env="NODE" help="Node IP/hostname to upgrade"
complete "node" run="talosctl config info -o yaml | yq '.nodes[]'"
'''
run = '''
image=$(mise run "//talos:_machine:image")
talosctl -n "${usage_node}" upgrade -i "${image}" -m powercycle --timeout=10m "$@"
'''

[tasks."_machine:controller"]
description = "Check if node is a controller (private)"
hide = true
usage = '''
arg "<node>" env="NODE" help="Node IP/hostname to check"
'''
run = '''
mise run //:template "${TALOS_DIR}/nodes/${usage_node}.yaml.j2" | \
    yq -e 'select(.machine) | (.machine.type == "controlplane") // ""'
'''

[tasks.etcd-defrag]
description = "Defragment etcd on all control plane nodes"
run = '''
#!/usr/bin/env bash
endpoints=$(talosctl config info -o yaml | yq -e '.endpoints | join(" ")')
for n in ${endpoints}; do
    mise //:log info "Defragmenting etcd..." stage "$0" node "$n"
    talosctl -n "$n" etcd defrag
done
'''

[tasks."_machine:image"]
description = "Get machine image from config (private)"
hide = true
run = '''
mise run //:template "${TALOS_DIR}/machineconfig.yaml.j2" | \
    yq -e 'select(.machine) | .machine.install.image'
'''
