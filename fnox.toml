[providers.protonpass]
type = "proton-pass"
vault = "Infrastructure"

[secrets]
BITWARDEN_KUBERNETES_TOKEN = { provider = "protonpass", value = "pass://Infrastructure/homeops-bootstrap/bitwarden-kubernetes-token" }
