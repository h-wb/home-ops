[providers.protonpass]
type = "proton-pass"
vault = "Machines"

[secrets]
BITWARDEN_KUBERNETES_TOKEN = { provider = "protonpass", value = "pass://Machines/homeops-bootstrap/bitwarden-kubernetes-token" }
# Same machine account, separate token for hand-run bws (revocable without touching the cluster).
BWS_ACCESS_TOKEN = { provider = "protonpass", value = "pass://Machines/bws-cli/access-token" }
CLUSTER_SECRETS = { provider = "protonpass", value = "pass://Machines/homeops-bootstrap/cluster-secrets" }
AGE_KEY = { provider = "protonpass", value = "pass://Machines/homeops-bootstrap/age-key" }
SECRET_DOMAIN = { provider = "protonpass", value = "pass://Machines/homeops-bootstrap/secret-domain" }
LETS_ENCRYPT_TLS = { provider = "protonpass", value = "pass://Machines/homeops-bootstrap/lets-encrypt-tls" }

MACHINE_CA_CRT = { provider = "protonpass", value = "pass://Machines/talos-machine/ca-crt" }
MACHINE_CA_KEY = { provider = "protonpass", value = "pass://Machines/talos-machine/ca-key" }
MACHINE_TOKEN = { provider = "protonpass", value = "pass://Machines/talos-machine/token" }

CLUSTER_CA_CRT = { provider = "protonpass", value = "pass://Machines/talos-cluster/ca-crt" }
CLUSTER_CA_KEY = { provider = "protonpass", value = "pass://Machines/talos-cluster/ca-key" }
CLUSTER_ID = { provider = "protonpass", value = "pass://Machines/talos-cluster/id" }
CLUSTER_SECRET = { provider = "protonpass", value = "pass://Machines/talos-cluster/secret" }
CLUSTER_TOKEN = { provider = "protonpass", value = "pass://Machines/talos-cluster/token" }
CLUSTER_AGGREGATORCA_CRT = { provider = "protonpass", value = "pass://Machines/talos-cluster/aggregatorca-crt" }
CLUSTER_AGGREGATORCA_KEY = { provider = "protonpass", value = "pass://Machines/talos-cluster/aggregatorca-key" }
CLUSTER_ETCD_CA_CRT = { provider = "protonpass", value = "pass://Machines/talos-cluster/etcd-ca-crt" }
CLUSTER_ETCD_CA_KEY = { provider = "protonpass", value = "pass://Machines/talos-cluster/etcd-ca-key" }
CLUSTER_SECRETBOXENCRYPTIONSECRET = { provider = "protonpass", value = "pass://Machines/talos-cluster/secretboxencryptionsecret" }
CLUSTER_SERVICEACCOUNT_KEY = { provider = "protonpass", value = "pass://Machines/talos-cluster/serviceaccount-key" }
