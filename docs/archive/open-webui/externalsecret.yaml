---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Session-signing key, generated once. Without it the image writes a fresh one into
# the container filesystem on every start, logging everyone out on each restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name open-webui-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        WEBUI_SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: open-webui-secret-key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: open-webui-secret-key
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
