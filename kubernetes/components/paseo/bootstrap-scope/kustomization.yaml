apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Transitional inputs for dotfiles PR 6 on the existing, unscoped host.
# The general/private rollout replaces this with each scope's own fragments.
configMapGenerator:
  - name: paseo-scope
    files:
      - scope.json
      - claude.json
      - codex.toml
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
patches:
  - path: mounts.yaml
    target:
      kind: HelmRelease
      name: paseo
