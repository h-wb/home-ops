apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - externalsecret.yaml
configMapGenerator:
  - name: ${APP}-provision
    files:
      - provision.sh=./config/provision.sh
    options:
      disableNameSuffixHash: true
  - name: ${APP}-sshd
    files:
      - authorized_keys=./config/authorized_keys
    options:
      disableNameSuffixHash: true
