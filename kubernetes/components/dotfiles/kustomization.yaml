---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# No name hash: the app mounts it by name; Reloader rolls the pod on a new pin.
configMapGenerator:
  - name: ${APP}-dotfiles
    files:
      - dotfiles-bootstrap
      - dotfiles-bootstrap.desktop
    options:
      disableNameSuffixHash: true
