---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The hook that bootstraps a workstation pod from the owner's dotfiles. The app
# decides when it runs (code-server: an init container) by mounting
# ${APP}-dotfiles and calling `sh <mount>/dotfiles-bootstrap [pod-bootstrap
# options]`; the dotfiles' scripts/pod-bootstrap decides what it does.
configMapGenerator:
  - name: ${APP}-dotfiles
    files:
      - dotfiles-bootstrap
    options:
      disableNameSuffixHash: true
