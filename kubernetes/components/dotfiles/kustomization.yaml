---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# See README.md. No name hash: the app mounts ${APP}-dotfiles by name, and
# Reloader rolls the pod when a new pin changes it.
configMapGenerator:
  - name: ${APP}-dotfiles
    files:
      - dotfiles-bootstrap
      - dotfiles-bootstrap.desktop
    options:
      disableNameSuffixHash: true
