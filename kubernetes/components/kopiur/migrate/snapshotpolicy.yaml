---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  # Pin to volsync's own identity convention (<app>@<namespace>:/data, as
  # seen in volsync's mover logs: "Setting policy for nextcloud@default:/data")
  # so pre-migration and post-migration snapshots read as one continuous
  # series under the same identity, instead of a fresh ClusterRepository
  # default identity starting a disconnected series.
  identity:
    hostname: ${NAMESPACE}
    username: ${APP}
  mover:
    podSecurityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
      fsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepHourly: 24
    keepDaily: 7
  sources:
    # References the PVC volsync already provisioned - left untouched here,
    # since spec.dataSourceRef on an existing PVC is immutable.
    - pvc:
        name: ${APP}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
