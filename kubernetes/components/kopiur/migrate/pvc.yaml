---
# Intentionally identical to components/volsync/pvc.yaml, not a kopiur-owned
# shape. This component targets an app whose PVC already exists and is
# already bound - dataSourceRef only matters at creation time and is
# immutable afterwards, so this must byte-for-byte match what's already live
# (down to reusing the VOLSYNC_* var names each app's ks.yaml already sets).
# Dropping this resource from the manifest set entirely (the original
# mistake) makes Flux's prune (this Kustomization runs with prune: true)
# read "no longer desired" and delete the live PVC - happened to airtrail
# 2026-08-16, see git history. Keep this resource declared, unchanged,
# for every app this component is applied to.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
spec:
  accessModes:
    - ${VOLSYNC_ACCESSMODES:=ReadWriteOnce}
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: ${APP}-dst
  resources:
    requests:
      storage: ${VOLSYNC_CAPACITY:=5Gi}
  storageClassName: ${VOLSYNC_STORAGECLASS:=ceph-block}
