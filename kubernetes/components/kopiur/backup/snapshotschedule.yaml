---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  schedule:
    # Explicit per-app minute (set via KOPIUR_SCHEDULE in each app's ks.yaml)
    # rather than relying solely on H's hash - with ~35 apps sharing this
    # component, hash collisions still cluster enough mover pods on one node
    # at once to overwhelm its RBD kernel client (see 2026-08-19 incident:
    # OSDs blocklisted tal0s, remounted nextcloud's volume read-only).
    cron: ${KOPIUR_SCHEDULE:=H * * * *}
