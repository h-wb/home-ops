---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Preauth key for the injected sidecar, from the `tailscale` Bitwarden item
# (shared with the edge cluster's network/tailscale subnet router). Use a
# reusable key: it is only needed while the node is logged out, and the state
# PVC keeps the login across restarts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ${APP}-tailscale
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
  dataFrom:
    - extract:
        key: tailscale
