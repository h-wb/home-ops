---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 92.21.2
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  dependsOn: []
  values:
    defaultRules:
      disabled:
        # Prom++ estimates shards from WAL read speed, not delivery backlog.
        # Its receive-timestamp metric is also absent. Use freshness below.
        PrometheusRemoteWriteDesiredShards: true
        PrometheusRemoteWriteBehind: true
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    alertmanager:
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
          global:
            resolveTimeout: 5m
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-hostpath
              resources:
                requests:
                  storage: 1Gi
    grafana:
      enabled: false
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels:
                - "__meta_kubernetes_pod_node_name"
              targetLabel: kubernetes_node
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels:
                - "__meta_kubernetes_pod_node_name"
              targetLabel: kubernetes_node
    additionalPrometheusRulesMap:
      prompp-remote-write-rules:
        groups:
          - name: prompp.remote-write
            rules:
              - alert: PrometheusRemoteWriteBehind
                expr: |-
                  time() - max_over_time(prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job="kube-prometheus-stack-prometheus",namespace="observability"}[5m]) > 120
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: Prometheus remote write is behind.
                  description: >-
                    Prometheus {{ $labels.namespace }}/{{ $labels.pod }} has not
                    sent fresh samples to {{ $labels.url }} for
                    {{ $value | humanizeDuration }}.
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/prometheus/prometheusremotewritebehind
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
    prometheus:
      prometheusSpec:
        externalLabels:
          cluster: edge
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
        image:
          registry: docker.io
          repository: prompp/prompp
          # v0.7.10 fixes the remote-write timestamp units that inflated the
          # shard calculation (deckhouse/prompp release v0.7.10).
          tag: 0.7.10
        # The operator needs the upstream API version, not Prom++'s tag.
        version: v2.55.1
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        # Soft dependency on main: remote write queues buffer on disk and
        # retry, so edge telemetry keeps flowing after a tailnet outage.
        # Local rules + this cluster's own Alertmanager stay the safety net.
        # NB: --accept-routes also installs the edge LAN route, so local-LAN
        # scrape targets (node exporter, kubelet) hairpin through the edge
        # subnet router pod — one extra hop on the same node, not a loop.
        remoteWrite:
          - url: http://192.168.1.205:9090/api/v1/write
            # Main evaluates its own recording and alerting rules over these
            # samples. Sending edge's derived series too double-counts them
            # (e.g. namespace memory requests) in main's cluster-wide alerts.
            writeRelabelConfigs:
              - sourceLabels: [__name__]
                regex: ".*:.*|ALERTS.*"
                action: drop
        # Tailscale client for the remoteWrite leg. Not the reusable
        # components/tailscale/client Component (that injects into app-template
        # HelmReleases) — the Prometheus CR takes raw containers/volumes, with
        # the same env as the Component's ConfigMap.
        initContainers:
          # tailscaled accepts routes into table 52 with an `ip rule` at
          # priority 5270, so replies to the edge LAN (kubelet probes!) would
          # be pulled into the tunnel and never return. A rule one step above
          # keeps LAN-destined packets on the eth0 path.
          - name: lan-bypass
            image: mirror.gcr.io/library/busybox:musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
            command: ["/bin/ip"]
            args:
              - rule
              - add
              - priority
              - "5269"
              - to
              - 192.168.18.0/24
              - lookup
              - main
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL], add: [NET_ADMIN] }
        containers:
          - name: tailscale
            image: mirror.gcr.io/tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
            env:
              - name: TS_HOSTNAME
                value: edge-prometheus
              - name: TS_USERSPACE
                value: "false"
              - name: TS_STATE_DIR
                value: /var/lib/tailscale
              - name: TS_ACCEPT_DNS
                value: "false"
              - name: TS_EXTRA_ARGS
                value: --accept-routes
              - name: TS_AUTH_ONCE
                value: "true"
              # State lives on the PVC; containerboot must not try to store it
              # in a `tailscale` Secret this SA can't touch.
              - name: TS_KUBE_SECRET
                value: ""
            envFrom:
              - secretRef:
                  name: kube-prometheus-stack-tailscale
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
                add: [NET_ADMIN, NET_RAW]
            volumeMounts:
              - name: tailscale-state
                mountPath: /var/lib/tailscale
              - name: tun
                mountPath: /dev/net/tun
        volumes:
          - name: tailscale-state
            persistentVolumeClaim:
              claimName: kube-prometheus-stack-tailscale
          - name: tun
            hostPath:
              path: /dev/net/tun
        walCompression: true
        enableFeatures:
          - memory-snapshot-on-shutdown
        retention: 3d
        retentionSize: 2GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-hostpath
              resources:
                requests:
                  storage: 5Gi
    cleanPrometheusOperatorObjectNames: true
