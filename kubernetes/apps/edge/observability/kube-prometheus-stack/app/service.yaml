---
# LAN LoadBalancer for the Alertmanager web port: karma on main reads edge
# alerts here (http://192.168.18.79:9093) over the tailnet, as a soft,
# read-only dependency. This cluster still pages from its own Alertmanager
# regardless of the link. LAN + tailnet only; never behind envoy/Cloudflare.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-lb
  annotations:
    lbipam.cilium.io/ips: 192.168.18.79
spec:
  type: LoadBalancer
  selector:
    alertmanager: kube-prometheus-stack
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
