---
# Tailscale node identity for the Prometheus sidecar (helmrelease
# `containers`). Survives pod restarts, so the auth key is only needed while
# the node is logged out.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-prometheus-stack-tailscale
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
  storageClassName: local-hostpath
