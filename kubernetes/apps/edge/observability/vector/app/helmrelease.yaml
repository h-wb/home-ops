---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Mirror of the main cluster's vector app (kubernetes/apps/main/observability/
# vector), with the sink aimed at main's victoria-logs LoadBalancer
# (192.168.1.206, victoria-logs app service.yaml) over the tailnet instead of
# the in-cluster service. The tailscale sidecar is injected by the Component.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    configMaps:
      config:
        data:
          vector.yaml: |
            data_dir: /vector-data-dir
            api:
              enabled: false
            sources:
              talos:
                type: socket
                mode: tcp
                address: 0.0.0.0:6050
                framing:
                  method: newline_delimited
                decoding:
                  codec: json
            sinks:
              victorialogs:
                type: http
                inputs:
                  - talos
                uri: http://192.168.1.206:9428/insert/jsonline?_msg_field=msg&_time_field=talos-time&_stream_fields=talos-service,host
                encoding:
                  codec: json
                framing:
                  method: newline_delimited
                compression: gzip
    controllers:
      vector:
        initContainers:
          # Same as the edge kube-prometheus-stack's: tailscaled's accepted
          # routes land in table 52 behind an `ip rule` at priority 5270, and
          # replies to the edge LAN (Talos kmsg delivery, kubelet probes) would
          # otherwise be pulled into the tunnel and never return. A rule one
          # step above keeps LAN-destined packets on the eth0 path.
          lan-bypass:
            image:
              repository: mirror.gcr.io/library/busybox
              tag: musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
            command: ["/bin/ip"]
            args:
              - rule
              - add
              - priority
              - "5269"
              - to
              - 192.168.18.0/24
              - lookup
              - main
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL], add: [NET_ADMIN] }
        containers:
          app:
            image:
              repository: docker.io/timberio/vector
              tag: 0.61.0-alpine
            args:
              - --config
              - /etc/vector/vector.yaml
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      config:
        type: configMap
        identifier: config
        advancedMounts:
          vector:
            app:
              - path: /etc/vector/vector.yaml
                subPath: vector.yaml
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.18.80
        ports:
          talos-log:
            port: 6050
            protocol: TCP
