---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Preauth key for the `tailscale` Bitwarden item (TS_AUTHKEY). Use a reusable
# key: it is only needed while the node is logged out, and the state PVC keeps
# the login across restarts. The main-cluster paseo sidecar extracts the same
# item (kubernetes/apps/main/agents/paseo/app/externalsecret.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: tailscale-secret
  dataFrom:
    - extract:
        key: tailscale
