---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# The edge site's door to Miroir, for the collector on the edge Mac
# (hosts/edge-mac). Miroir and its media bucket live on the main cluster and
# are not reachable from this LAN, so this pod forwards two TCP ports over the
# tailnet to main's miroir-lb (192.168.1.207) and garage-lb (192.168.1.208),
# and this cluster's internal gateway serves them under their usual names
# with its own certificate. The Mac resolves both names to that gateway
# through /etc/hosts.
#
# The routes pass only what a collector uses: the four device endpoints of a
# connection, each of which needs that connection's delivery token, and
# uploads to links Miroir signed. The interface and the rest of the API are
# not reachable from here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir-relay
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      miroir-relay:
        initContainers:
          # Same as vector's: tailscaled's accepted routes land in table 52
          # behind an `ip rule` at priority 5270, and replies to the edge LAN
          # would otherwise be pulled into the tunnel and never return. A rule
          # one step above keeps LAN-destined packets on the eth0 path.
          lan-bypass:
            image:
              repository: mirror.gcr.io/library/busybox
              tag: musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
            command: ["/bin/ip"]
            args:
              - rule
              - add
              - priority
              - "5269"
              - to
              - 192.168.18.0/24
              - lookup
              - main
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL], add: [NET_ADMIN] }
        containers:
          # One plain TCP forwarder per port. A probe would open a connection
          # to main every few seconds, so there is none: socat exits on a
          # failure to listen, and the kubelet restarts it.
          miroir:
            image: &image
              repository: mirror.gcr.io/alpine/socat
              tag: 1.8.1.1@sha256:7f9a06753033f2b7de18edc2353f2c15153413d95a039163c6db270fc7a6c3b0
            args:
              - TCP-LISTEN:8765,fork,reuseaddr
              - TCP:192.168.1.207:8765,connect-timeout=10
            probes: &probes
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext: &securityContext
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources: &resources
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 128Mi
          s3:
            image: *image
            args:
              - TCP-LISTEN:3900,fork,reuseaddr
              - TCP:192.168.1.208:3900,connect-timeout=10
            probes: *probes
            securityContext: *securityContext
            resources: *resources
    service:
      app:
        controller: miroir-relay
        ports:
          miroir:
            port: 8765
          s3:
            port: 3900
    route:
      miroir:
        hostnames:
          - "miroir.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - method: POST
                path:
                  type: RegularExpression
                  value: /api/connections/[^/]+/(receive|report|media/uploads|media/confirm)
            backendRefs:
              - name: "{{ .Release.Name }}"
                port: 8765
      s3:
        hostnames:
          - "s3.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - method: PUT
                path:
                  type: PathPrefix
                  value: /miroir-media/
            backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3900
