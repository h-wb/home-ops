---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app miroir-relay
  namespace: &namespace network
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # Tailscale client sidecar: the relay's only way to main's miroir-lb and
    # garage-lb. A soft dependency: while the link is down the collector on
    # the edge Mac keeps its batch and retries a minute later.
    - ../../../../../components/tailscale/client
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/edge/network/miroir-relay/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      CLUSTER: ${CLUSTER}
      SECRET_DOMAIN: ${SECRET_DOMAIN}
