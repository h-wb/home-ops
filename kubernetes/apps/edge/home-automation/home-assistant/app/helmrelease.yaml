---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/home-assistant
              tag: 2026.10.1@sha256:f8114c284e86444244a5f2e34b2c1ca08d013be535b86be43d1cba12d2fd5937
            env:
              TZ: America/Toronto
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["NET_RAW"]
            resources:
              requests:
                cpu: 10m
                memory: 250Mi
              limits:
                memory: 2Gi
          codeserver:
            image: &codeserverImage
              repository: ghcr.io/coder/code-server
              tag: 4.141.0@sha256:72ab24b5680ee597dd647b30d82625752f40109b5f61bef90ffbf1ea1f02dbb8
            env: &gitEnv
              TZ: America/Toronto
              # /config is root-owned (PVC root); git refuses it without this.
              GIT_CONFIG_COUNT: "1"
              GIT_CONFIG_KEY_0: safe.directory
              GIT_CONFIG_VALUE_0: /config
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/config/.vscode",
                "--extensions-dir",
                "/config/.vscode",
                "--port",
                "12321",
                "/config",
              ]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
      # Nightly commit + push of /config to github.com/h-wb/home-assistant-config
      # (repo remote, deploy key and .gitignore allowlist live in /config itself).
      # Uses the code-server image because the HA image has no passwd entry for
      # uid 1000, which ssh refuses to run without. PVC is RWO but edge is one node.
      git-sync:
        type: cronjob
        cronjob:
          schedule: "0 4 * * *"
          timeZone: America/Toronto
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image: *codeserverImage
            env: *gitEnv
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                cd /config
                git add -A
                if git diff --cached --quiet; then
                  echo "no changes"
                else
                  git commit -q -m "Auto-commit $(date +%F)"
                  git --no-pager show --stat --format=%s HEAD
                fi
                git push -q origin HEAD:main
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv
      tmp:
        type: emptyDir
    route:
      app:
        hostnames:
          - ${SUBDOMAIN}.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: &port 8123
      codeserver:
        hostnames:
          - hass-code-${CLUSTER}.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: &codeserverPort 12321
    service:
      app:
        controller: home-assistant
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.18.77
        ports:
          http:
            port: *port
          codeserver:
            port: *codeserverPort
