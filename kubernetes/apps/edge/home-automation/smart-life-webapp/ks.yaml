---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app smart-life-webapp
  namespace: &namespace home-automation
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn: []
  interval: 30m
  path: ./kubernetes/apps/main/default/smart-life-webapp/app
  postBuild:
    substitute:
      APP: *app
      SUBDOMAIN: smartlife-${CLUSTER}
      SECRET_DOMAIN: ${SECRET_DOMAIN}
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
