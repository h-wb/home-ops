---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
components:
  - ../../../components/common
resources:
  - ./paseo-general/ks.yaml
  - ./paseo-private/ks.yaml
patches:
  # Shared spec for the two pod Kustomizations (paseo, paseo-private); each
  # child keeps only its identity: APP, PASEO_DATA_SCOPE, hostnames, SSH IP,
  # backup size and its path. paseo-scratch is intentionally untouched.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: paseo
    patch: &pod-spec |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: not-used
      spec:
        targetNamespace: agents
        interval: 30m
        prune: true
        retryInterval: 1m
        timeout: 10m
        wait: false
        sourceRef:
          kind: GitRepository
          name: flux-system
          namespace: flux-system
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: paseo-private
    patch: *pod-spec
