---
# Transitional: general still runs in `agents` while private proves the move to
# `llm` (llm/paseo/ks.yaml). This file and the namespace go with general's move.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paseo
  namespace: agents
spec:
  targetNamespace: agents
  commonMetadata:
    labels:
      app.kubernetes.io/name: paseo
  components:
    - ../../../../../components/kopiur/backup
    - ../../../../../components/tailscale/client
  interval: 30m
  path: ./kubernetes/apps/main/llm/paseo/general
  postBuild:
    substitute:
      APP: paseo
      CLUSTER: ${CLUSTER}
      KOPIUR_CAPACITY: 50Gi
      KOPIUR_SCHEDULE: 38 4 * * *
      PASEO_DATA_SCOPE: general
      PASEO_CREDENTIAL_ITEM: paseo-general
      PASEO_HOSTNAMES: paseo-general.${SECRET_DOMAIN},paseo.${SECRET_DOMAIN}
      PASEO_SERVICE_DOMAIN: svc
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: false
