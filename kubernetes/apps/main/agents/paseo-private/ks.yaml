apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paseo-private
  namespace: agents
spec:
  targetNamespace: agents
  commonMetadata:
    labels:
      app.kubernetes.io/name: paseo-private
  components:
    - ../../../../../components/kopiur/backup
    - ../../../../../components/agent-data-policy
  dependsOn: []
  interval: 30m
  path: ./kubernetes/apps/main/agents/paseo-private/app
  postBuild:
    substitute:
      APP: paseo-private
      CLUSTER: ${CLUSTER}
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_SCHEDULE: 48 4 * * *
      PASEO_DATA_SCOPE: private
      PASEO_CREDENTIAL_ITEM: paseo-private
      PASEO_HOSTNAMES: paseo-private.${SECRET_DOMAIN}
      PASEO_SERVICE_DOMAIN: svc-private
      PASEO_SSH_IP: 192.168.1.212
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: false
