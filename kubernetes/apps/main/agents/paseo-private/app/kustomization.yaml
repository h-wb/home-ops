apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../components/paseo/base
# Per-scope agent config fragments, owned by components/agent-data-policy;
# the base mounts this at /etc/paseo/scope and dotfiles' bootstrap merges it
# into the agent homes. tests/test_data_scopes.py keeps them in sync with
# policy.json.
configMapGenerator:
  - name: ${APP}-scope
    files:
      - scope.json=../../../../../components/agent-data-policy/scopes/private/scope.json
      - claude.json=../../../../../components/agent-data-policy/scopes/private/claude.json
      - codex.toml=../../../../../components/agent-data-policy/scopes/private/codex.toml
    options:
      disableNameSuffixHash: true
patches:
  - target:
      kind: HelmRelease
    patch:
      '[{"op": "replace", "path": "/spec/values/defaultPodOptions/automountServiceAccountToken",
      "value": false}]'
  # No automatic token (above), but one projected token where kubectl looks: the Hermes (private)
  # provider runs `kubectl exec` into proto's hermes-private-0, and that Role
  # (apps/main/proto/app/assistant/rbac.yaml) is all this ServiceAccount is granted.
  - target:
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          persistence:
            kube-api-token:
              type: custom
              volumeSpec:
                projected:
                  sources:
                    - serviceAccountToken:
                        path: token
                        expirationSeconds: 3600
                    - configMap:
                        name: kube-root-ca.crt
                        items:
                          - key: ca.crt
                            path: ca.crt
                    - downwardAPI:
                        items:
                          - path: namespace
                            fieldRef:
                              fieldPath: metadata.namespace
              advancedMounts:
                ${APP}:
                  app:
                    - path: /var/run/secrets/kubernetes.io/serviceaccount
                      readOnly: true
  - target:
      kind: PersistentVolumeClaim
    patch:
      "- op: add\n  path: /metadata/annotations\n  value:\n    kustomize.toolkit.fluxcd.io/prune:\
      \ disabled\n"
