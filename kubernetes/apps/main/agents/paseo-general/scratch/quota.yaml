---
# Caps what agents can schedule, so a runaway experiment cannot overcommit the nodes.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agents-scratch
  namespace: agents-scratch
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 8Gi
    persistentvolumeclaims: "4"
    requests.storage: 20Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
# Defaults so pods without resources are still admitted under the quota.
apiVersion: v1
kind: LimitRange
metadata:
  name: agents-scratch
  namespace: agents-scratch
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        memory: 512Mi
