---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paseo
  namespace: agents
spec:
  targetNamespace: agents
  commonMetadata:
    labels:
      app.kubernetes.io/name: paseo
  components:
    - ../../../../../components/kopiur/backup
    - ../../../../../components/tailscale/client
    - ../../../../../components/agent-data-policy
  interval: 30m
  path: ./kubernetes/apps/main/agents/paseo-general/app
  postBuild:
    substitute:
      APP: paseo
      CLUSTER: ${CLUSTER}
      KOPIUR_CAPACITY: 40Gi
      KOPIUR_SCHEDULE: 38 4 * * *
      PASEO_DATA_SCOPE: general
      PASEO_CREDENTIAL_ITEM: paseo-general
      PASEO_HOSTNAMES: paseo-general.${SECRET_DOMAIN},paseo.${SECRET_DOMAIN}
      PASEO_SERVICE_DOMAIN: svc
      PASEO_SSH_IP: 192.168.1.204
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paseo-scratch
  namespace: agents
spec:
  interval: 30m
  path: ./kubernetes/apps/main/agents/paseo-general/scratch
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
