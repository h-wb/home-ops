---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Daemon API/WebSocket password, from the `paseo` Bitwarden item. Do NOT rotate —
# it logs out every client. Read it with:
#   kubectl -n agents get secret paseo-password -o jsonpath='{.data.PASEO_PASSWORD}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-password
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: paseo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Seed sshd-lite derives its ed25519 host key from, from the `paseo` Bitwarden
# item. Do NOT rotate — a new seed is a new host key, and every client's
# known_hosts would refuse it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-ssh
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: paseo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Bitwarden item `paseo`: GH_TOKEN (fine-grained PAT, contents + PRs on repos agents
# may push to), GIT_EMAIL (dotfiles' git config), PASEO_PASSWORD (daemon API/WebSocket
# password), KEYSEED (sshd-lite host key seed), MISTRAL_API_KEY (for the
# mistral-vibe CLI), and PROTON_PASS_TOKEN (the `paseo` Proton Pass access token,
# reads the Homelab, env-home-ops, env-dlt and env-dotfiles vaults; logged in by
# the dotfiles paseo:pass-login task and the repos' pass:login tasks). The
# password and keyseed are also extracted by the paseo-password
# and paseo-ssh ExternalSecrets below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-secret
    template:
      engineVersion: v2
      data:
        GH_TOKEN: "{{ .GH_TOKEN }}"
        GIT_EMAIL: "{{ .GIT_EMAIL }}"
        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
        PROTON_PASS_TOKEN: "{{ .PROTON_PASS_TOKEN }}"
  dataFrom:
    - extract:
        key: paseo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The LiteLLM key, pushed to Bitwarden by llm/litellm/app/virtualkeys/paseo.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-litellm
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-litellm
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm-key-paseo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The paseo-agents x-api-key for https://mcp.${SECRET_DOMAIN} (llm/toolhive's
# mcp-gateway route). Generated by ToolHive config and pushed to Bitwarden as
# mcp-gateway-paseo. Env for Vibe home-mcp — see dotfiles paseo-bootstrap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-mcp-gateway
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Retain
  data:
    - secretKey: MCP_GATEWAY_API_KEY
      remoteRef:
        key: mcp-gateway-paseo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Tailscale preauth key (same `tailscale` Bitwarden item the edge subnet router
# uses) for the sidecar below: it joins the paseo pod to the tailnet so agents
# can reach the edge cluster LAN (192.168.18.0/24) through the edge cluster's
# network/tailscale subnet router.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-tailscale
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
  dataFrom:
    - extract:
        key: tailscale
