---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Daemon API/WebSocket password, generated once in-cluster. CreatedOnce is load-bearing:
# any re-run of the generator rotates it and logs out every client. Read it with:
#   kubectl -n agents get secret paseo-password -o jsonpath='{.data.PASEO_PASSWORD}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PASEO_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: paseo-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: paseo-password
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Bitwarden item `paseo`: GH_TOKEN, a fine-grained PAT (contents + pull requests on the
# repos agents may push to), and GIT_EMAIL, which the dotfiles' git config reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-secret
    template:
      engineVersion: v2
      data:
        GH_TOKEN: "{{ .GH_TOKEN }}"
        GIT_EMAIL: "{{ .GIT_EMAIL }}"
  dataFrom:
    - extract:
        key: paseo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The LiteLLM key, pushed to Bitwarden by llm/litellm/app/virtualkeys/paseo.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-litellm
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-litellm
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm-key-paseo
