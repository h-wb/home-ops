---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Daemon API/WebSocket password. Migrated to Bitwarden (item `paseo-password`);
# the value was generated in-cluster once and copied. Do NOT rotate — it logs out
# every client. Read it with:
#   kubectl -n agents get secret paseo-password -o jsonpath='{.data.PASEO_PASSWORD}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-password
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Retain
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: paseo-password
        property: PASEO_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Seed sshd-lite derives its ed25519 host key from. Migrated to Bitwarden (item
# `paseo-ssh-keyseed`). Do NOT rotate — a new seed is a new host key, and every
# client's known_hosts would refuse it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-ssh
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Retain
  data:
    - secretKey: KEYSEED
      remoteRef:
        key: paseo-ssh-keyseed
        property: KEYSEED
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Bitwarden item `paseo`: GH_TOKEN, a fine-grained PAT (contents + pull requests on the
# repos agents may push to), and GIT_EMAIL, which the dotfiles' git config reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-secret
    template:
      engineVersion: v2
      data:
        GH_TOKEN: "{{ .GH_TOKEN }}"
        GIT_EMAIL: "{{ .GIT_EMAIL }}"
  dataFrom:
    - extract:
        key: paseo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The LiteLLM key, pushed to Bitwarden by llm/litellm/app/virtualkeys/paseo.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-litellm
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-litellm
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm-key-paseo
