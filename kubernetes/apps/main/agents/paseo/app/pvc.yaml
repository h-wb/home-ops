---
# Tailscale node identity for the paseo sidecar (helmrelease `tailscale`
# container). Survives pod restarts, so the auth key is only needed while the
# node is logged out.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-tailscale
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
  storageClassName: local-hostpath
