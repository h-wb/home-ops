---
# The paseo pods' client keys (LiteLLM virtual key, ToolHive VMCP key, memini's
# key) are generated inside the llm namespace and distributed the jory way:
# read straight out of Kubernetes with ESO's KUBERNETES provider instead of the
# old PushSecret-to-Bitwarden round trip. Nothing mechanical touches Bitwarden
# anymore; its paseo items carry human credentials only, and rotation of the
# generated keys propagates with this store's refresh.
#
# The service account below is this store's identity; llm/paseo-reader.yaml
# grants it exactly the five secrets it may read, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paseo-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: paseo-llm
spec:
  provider:
    kubernetes:
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: Cluster
      remoteNamespace: llm
      auth:
        serviceAccount:
          name: paseo-secret-reader
