---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-password
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-password
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        PASEO_PASSWORD: "{{ .PASEO_PASSWORD }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-ssh
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-ssh
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        KEYSEED: "{{ .KEYSEED }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
# One credential item per scope, extracted into the pod's platform-credential
# secret; the client keys and derived header live in their own properly-named
# Secrets (jory-shape) so the containers reference each var explicitly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-secret
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GIT_EMAIL: "{{ .GIT_EMAIL }}"
        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
        PROTON_PASS_TOKEN: "{{ .PROTON_PASS_TOKEN }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
# x-api-key for https://mcp-${PASEO_DATA_SCOPE}.${SECRET_DOMAIN} — ToolHive's
# CreatedOnce VMCP key (gateway-side in llm), pasted here once for the pod; the
# liteLLM key needs no Secret at all: the operator writes it into this
# namespace from the virtualkey CR (see virtualkey.yaml in each overlay) and
# the helmrelease references it directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-mcp
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-mcp
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        MCP_API_KEY: "{{ .MCP_API_KEY }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
