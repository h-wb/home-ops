---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-password
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-password
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        PASEO_PASSWORD: "{{ .PASEO_PASSWORD }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-ssh
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-ssh
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        KEYSEED: "{{ .KEYSEED }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-secret
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GIT_EMAIL: "{{ .GIT_EMAIL }}"
        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
        PROTON_PASS_TOKEN: "{{ .PROTON_PASS_TOKEN }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
# The pod's LiteLLM virtual key, generated and registered by the litellm-operator
# from the LiteLLMVirtualKey CRs and read straight out of the llm namespace
# (common/llm-secretstore.yaml). When the CR's key rotates, this pulls the new
# value within one refresh interval — nothing to copy anywhere.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-litellm
spec:
  secretStoreRef:
    kind: SecretStore
    name: paseo-llm
  refreshInterval: 15m
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm-paseo-${PASEO_DATA_SCOPE}
        property: api-key
---
# x-api-key for https://mcp-${PASEO_DATA_SCOPE}.${SECRET_DOMAIN}. ToolHive's
# CreatedOnce generator makes the key in the llm namespace, where the VMCP
# gateway validates it; the same value reaches the pod through the same
# Kubernetes store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-mcp
spec:
  secretStoreRef:
    kind: SecretStore
    name: paseo-llm
  refreshInterval: 15m
  data:
    - secretKey: MCP_API_KEY
      remoteRef:
        key: mcp-paseo-${PASEO_DATA_SCOPE}
        property: paseo-${PASEO_DATA_SCOPE}
