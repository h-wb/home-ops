---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-password
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-password
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        PASEO_PASSWORD: "{{ .PASEO_PASSWORD }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-ssh
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-ssh
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        KEYSEED: "{{ .KEYSEED }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
# One item per scope holds everything its pod consumes (jory-shape), extracted
# into one Secret. LITELLM_API_KEY and MCP_API_KEY carry the client keys the
# cluster generated elsewhere — the litellm-operator's virtual key for this
# scope and ToolHive's CreatedOnce VMCP key — pasted in once; they refresh here
# only if those keys are ever rotated by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-secret
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GIT_EMAIL: "{{ .GIT_EMAIL }}"
        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
        PROTON_PASS_TOKEN: "{{ .PROTON_PASS_TOKEN }}"
        LITELLM_API_KEY: "{{ .LITELLM_API_KEY }}"
        MCP_API_KEY: "{{ .MCP_API_KEY }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
