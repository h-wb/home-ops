---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      ${APP}: {}
    controllers:
      ${APP}:
        strategy: Recreate
        serviceAccount:
          identifier: ${APP}
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          tools:
            image:
              repository: ghcr.io/jdx/mise
              tag: 2026.11.2-debian
            # Shims symlink to the mise that made them: run it from the PVC.
            command:
              - sh
              - -c
              - install -D /usr/local/bin/mise "$HOME/.local/bin/mise" && PATH="$HOME/.local/bin:$PATH" exec mise "$@"
              - mise
            args:
              - bootstrap
              - --from
              - https://github.com/h-wb/dotfiles.git
              - --from-dir
              - /home/paseo/.dotfiles
              - --config-dir
              - .
              - --update
              - --yes
              - --force-dotfiles
              - --skip-dirty
              - --locked
            # MISE_*: back to mise's defaults; the image moves them to /mise.
            env: &env
              MISE_DATA_DIR: /home/paseo/.local/share/mise
              MISE_CONFIG_DIR: /home/paseo/.config/mise
              MISE_CACHE_DIR: /home/paseo/.cache/mise
              PASEO_DATA_SCOPE: ${PASEO_DATA_SCOPE}
              HOME: /home/paseo
              OPENCODE_CONFIG: /etc/paseo/config/opencode.json
              TZ: Europe/Paris
              SHELL: /bin/bash
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-paseo-${PASEO_DATA_SCOPE}
                    key: api-key
              # System dirs first: the daemon needs the image's node.
              PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/paseo/.local/bin:/home/paseo/.local/share/mise/shims
            envFrom:
              - &secret
                secretRef:
                  name: ${APP}-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        containers:
          app:
            image: &image
              repository: ghcr.io/getpaseo/paseo
              tag: 0.15.3
            env: &appEnv
              <<: *env
              PASEO_HOSTNAMES: "${PASEO_HOSTNAMES}"
              # Must not be a parent of PASEO_HOSTNAMES, or the daemon itself 404s.
              PASEO_SERVICE_PROXY_PUBLIC_BASE_URL: "https://${PASEO_SERVICE_DOMAIN}.${SECRET_DOMAIN}"
              PASEO_TRUSTED_PROXIES: loopback,10.42.0.0/16
              PASEO_RELAY_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: ${APP}-password
              - *secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /api/health
                    port: &port 6767
                  periodSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 10
                  timeoutSeconds: 5
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 8Gi
          browser:
            image:
              repository: docker.io/chromedp/headless-shell
              tag: 157.0.8103.15
            command: ["/headless-shell/headless-shell"]
            args:
              - --no-sandbox
              - --disable-gpu
              - --no-first-run
              - --remote-debugging-address=127.0.0.1
              - --remote-debugging-port=9222
              - --user-data-dir=/tmp/chromium
            env:
              HOME: /tmp
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: *app
        ports:
          http:
            primary: true
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: paseo-${PASEO_DATA_SCOPE}
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Paseo (${PASEO_DATA_SCOPE})
          gethomepage.dev/icon: terminal.png
          gethomepage.dev/description: Coding agents
        hostnames:
          - "paseo-${PASEO_DATA_SCOPE}.${SECRET_DOMAIN}"
        # No OIDC: the native and CLI clients can't follow a login redirect.
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      services:
        hostnames:
          - "*.${PASEO_SERVICE_DOMAIN}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # Never in the browser sidecar: pages must not reach agent logins.
      home:
        existingClaim: *app
        advancedMounts:
          ${APP}:
            tools: &home
              - path: /home/paseo
            app: *home
      # dotfiles reads this path: /etc/paseo selects its class, paseo.json is merged.
      config:
        type: configMap
        name: ${APP}-config
        advancedMounts:
          ${APP}:
            tools: &config
              - path: /etc/paseo/config
                readOnly: true
            app: *config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          ${APP}:
            browser:
              - path: /dev/shm
