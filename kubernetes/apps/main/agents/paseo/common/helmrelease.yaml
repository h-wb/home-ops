---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Headless agent host, modelled on david-driscoll/home-operations (kubernetes/apps/agents/paseo).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    defaultPodOptions:
      # No ambient cluster credentials. Private explicitly projects its Hermes
      # exec token into the app container; general uses ToolHive exclusively.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The LiteLLM route is internal-only: no public record and CoreDNS forwards
      # straight upstream, so pods can't resolve it. Point it at envoy-internal
      # (same LAN IP the route's Gateway listens on), which has a valid public
      # cert. ToolHive needs no alias: the pods call its in-cluster services,
      # admitted per scope by llm/toolhive's NetworkPolicy, with no key.
      hostAliases:
        - hostnames:
            - litellm.${SECRET_DOMAIN}
          ip: 192.168.1.202
      # The image's entrypoint only needs root to chown volumes, then drops to `paseo`
      # (1000); starting as 1000 with fsGroup does the same and skips that step.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      ${APP}: {}
    controllers:
      ${APP}:
        # Agents run for hours and hold an RWO volume.
        # Since 0.14 the daemon releases an agent's provider runtime after an idle hour
        # and resumes the saved session on the next prompt; working agents are kept.
        # Accepted default. Opt out per scope with `agents.idleRuntimeCleanup: false`
        # in <scope>/config/paseo.json.
        strategy: Recreate
        serviceAccount:
          identifier: ${APP}
        annotations:
          # Named lists, not `auto`: every roll kills the running agents.
          configmap.reloader.stakater.com/reload: ${APP}-config
          secret.reloader.stakater.com/reload: ${APP}-password,${APP}-secret,${APP}-tailscale,litellm-paseo-${PASEO_DATA_SCOPE}
        initContainers:
          # Provisions the host from dotfiles (class `paseo`): clone or fast-forward
          # ~/.dotfiles, link ~/.config/mise to it, apply its bootstrap.
          tools:
            image:
              repository: ghcr.io/jdx/mise
              tag: 2026.11.2-debian
            # Copy mise onto the PVC and run that copy. Shims are symlinks to the
            # mise that created them, and only /home/paseo is shared with the app
            # container: shims pointing at this image's /usr/local/bin/mise would
            # be dangling there.
            command:
              - sh
              - -c
              - install -D /usr/local/bin/mise "$HOME/.local/bin/mise" && PATH="$HOME/.local/bin:$PATH" exec mise "$@"
              - mise
            args:
              - bootstrap
              - --from
              - https://github.com/h-wb/dotfiles.git
              - --from-dir
              - /home/paseo/.dotfiles
              - --config-dir
              - .
              - --update
              - --yes
              - --force-dotfiles
              - --skip-dirty
              - --locked
            # MISE_*: mise's defaults, which the jdx/mise image moves to /mise.
            env: &env
              MISE_DATA_DIR: /home/paseo/.local/share/mise
              MISE_CONFIG_DIR: /home/paseo/.config/mise
              MISE_CACHE_DIR: /home/paseo/.cache/mise
              PASEO_DATA_SCOPE: ${PASEO_DATA_SCOPE}
              HOME: /home/paseo
              OPENCODE_CONFIG: /etc/paseo/config/opencode.json
              TZ: Europe/Paris
              # Terminals (Paseo web UI, VS Code) use this to pick the shell;
              # without it they fall back to /bin/sh and skip ~/.bashrc.
              SHELL: /bin/bash
              # The LiteLLM virtual key, straight from the secret the
              # litellm-operator writes into this namespace (virtualkey.yaml in
              # each overlay) — no ExternalSecret in between.
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-paseo-${PASEO_DATA_SCOPE}
                    key: api-key
              # System dirs first: the daemon must keep the image's node, its native
              # modules are built against it. Everything else falls through to mise.
              PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/paseo/.local/bin:/home/paseo/.local/share/mise/shims
            # GIT_EMAIL renders the dotfiles' git config.
            envFrom:
              - &secret
                secretRef:
                  name: ${APP}-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        containers:
          app:
            image: &image
              repository: ghcr.io/getpaseo/paseo
              tag: 0.15.3
            env: &appEnv
              <<: *env
              PASEO_HOSTNAMES: "${PASEO_HOSTNAMES}"
              # Workspace services (paseo.json scripts) at <service>--<project>.svc.${SECRET_DOMAIN}.
              # Must not be a parent of PASEO_HOSTNAMES: every host under the base is treated
              # as a service, so a bare ${SECRET_DOMAIN} 404s the daemon itself.
              PASEO_SERVICE_PROXY_PUBLIC_BASE_URL: "https://${PASEO_SERVICE_DOMAIN}.${SECRET_DOMAIN}"
              # envoy-internal reaches the daemon from the pod network.
              PASEO_TRUSTED_PROXIES: loopback,10.42.0.0/16
              # Clients connect directly over LAN/WireGuard; no third-party relay.
              PASEO_RELAY_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: ${APP}-password
              - *secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /api/health
                    port: &port 6767
                  periodSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 10
                  timeoutSeconds: 5
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 8Gi
          # Headless Chromium for browser MCPs (chrome-devtools-mcp --browserUrl
          # http://127.0.0.1:9222). Pod-local, so CDP is never exposed.
          browser:
            image:
              repository: docker.io/chromedp/headless-shell
              tag: 157.0.8103.15
            command: ["/headless-shell/headless-shell"]
            args:
              - --no-sandbox
              - --disable-gpu
              - --no-first-run
              - --remote-debugging-address=127.0.0.1
              - --remote-debugging-port=9222
              - --user-data-dir=/tmp/chromium
            env:
              HOME: /tmp
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: *app
        ports:
          http:
            primary: true
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: paseo-${PASEO_DATA_SCOPE}
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Paseo (${PASEO_DATA_SCOPE})
          gethomepage.dev/icon: terminal.png
          gethomepage.dev/description: Coding agents
        hostnames:
          - "paseo-${PASEO_DATA_SCOPE}.${SECRET_DOMAIN}"
        # Internal only and no OIDC: the native and CLI clients authenticate to the
        # daemon with PASEO_PASSWORD and cannot follow a login redirect.
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      # Workspace services; the gateway cert carries *.svc.${SECRET_DOMAIN}. Unknown names
      # get Paseo's "service not running" page. Internal only, like the daemon.
      services:
        hostnames:
          - "*.${PASEO_SERVICE_DOMAIN}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # Not in the browser sidecar: a page it loads should never reach agent logins.
      home:
        existingClaim: *app
        advancedMounts:
          ${APP}:
            tools: &home
              - path: /home/paseo
            app: *home
      # This scope's agent config (<scope>/config). Its path is the contract with
      # dotfiles: /etc/paseo selects the `paseo` class, and paseo.json is merged
      # into ~/.paseo/config.json.
      config:
        type: configMap
        name: ${APP}-config
        advancedMounts:
          ${APP}:
            tools: &config
              - path: /etc/paseo/config
                readOnly: true
            app: *config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          ${APP}:
            browser:
              - path: /dev/shm
