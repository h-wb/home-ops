apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - networkpolicy.yaml
  - externalsecret.yaml
# Per-scope agent config fragments, owned by components/agent-data-policy;
# the base mounts this at /etc/paseo/scope and dotfiles' bootstrap merges it
# into the agent homes. tests/test_data_scopes.py keeps them in sync with
# policy.json.
configMapGenerator:
  - name: ${APP}-scope
    files:
      - scope.json=../../../../../components/agent-data-policy/scopes/general/scope.json
      - claude.json=../../../../../components/agent-data-policy/scopes/general/claude.json
      - codex.toml=../../../../../components/agent-data-policy/scopes/general/codex.toml
    options:
      disableNameSuffixHash: true
patches:
  - path: helmrelease.yaml
    target:
      kind: HelmRelease
  - patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: ${APP}-litellm
      spec:
        target:
          template:
            engineVersion: v2
            data:
              LITELLM_API_KEY: "{{ .LITELLM_API_KEY }}"
              ANTHROPIC_CUSTOM_HEADERS: "x-litellm-api-key: Bearer {{ .LITELLM_API_KEY }}"
