apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - networkpolicy.yaml
  - externalsecret.yaml
  - virtualkey.yaml
configMapGenerator:
  - name: ${APP}-config
    files:
      - config/paseo.json
      - config/opencode.json
    options:
      disableNameSuffixHash: true
patches:
  - path: helmrelease.yaml
    target:
      kind: HelmRelease
  # Keep general's home if this Flux Kustomization is removed.
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
