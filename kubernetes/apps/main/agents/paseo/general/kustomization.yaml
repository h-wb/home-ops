apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - networkpolicy.yaml
  - externalsecret.yaml
  - virtualkey.yaml
# Agent config for this scope, mounted at /etc/paseo/config (see common/config/provision.sh).
configMapGenerator:
  - name: ${APP}-config
    files:
      - config/paseo.json
      - config/claude.json
      - config/opencode.json
    options:
      disableNameSuffixHash: true
patches:
  - path: helmrelease.yaml
    target:
      kind: HelmRelease
