apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - networkpolicy.yaml
  - externalsecret.yaml
# Agent config for this scope, mounted at /etc/paseo/config (see common/config/provision.sh).
configMapGenerator:
  - name: ${APP}-config
    files:
      - config/paseo.json
      - config/claude.json
      - config/opencode.json
    options:
      disableNameSuffixHash: true
patches:
  - path: helmrelease.yaml
    target:
      kind: HelmRelease
  - patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: ${APP}-litellm
      spec:
        target:
          template:
            engineVersion: v2
            data:
              LITELLM_API_KEY: "{{ .LITELLM_API_KEY }}"
              ANTHROPIC_CUSTOM_HEADERS: "x-litellm-api-key: Bearer {{ .LITELLM_API_KEY }}"
