apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  values:
    controllers:
      ${APP}:
        labels:
          nfsMount: "true"
        initContainers:
          tools:
            env:
              ANTHROPIC_BASE_URL: https://litellm.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: ${APP}-secret
        containers:
          app:
            env:
              ANTHROPIC_BASE_URL: https://litellm.${SECRET_DOMAIN}
              # Every agent key binds by name to its proper secret (jory-shape)
              # instead of riding envFrom. The Claude header is composed by the
              # paseo-claude ExternalSecret from the operator's litellm secret.
              ANTHROPIC_CUSTOM_HEADERS:
                valueFrom:
                  secretKeyRef:
                    name: paseo-claude
                    key: ANTHROPIC_CUSTOM_HEADERS
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: GH_TOKEN
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: MEMINI_API_KEY
              OPENCODE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: OPENCODE_API_KEY
            envFrom:
              - secretRef:
                  name: ${APP}-secret
              - secretRef:
                  name: ${APP}-password
          sshd:
            env:
              ANTHROPIC_BASE_URL: https://litellm.${SECRET_DOMAIN}
              ANTHROPIC_CUSTOM_HEADERS:
                valueFrom:
                  secretKeyRef:
                    name: paseo-claude
                    key: ANTHROPIC_CUSTOM_HEADERS
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: GH_TOKEN
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: MEMINI_API_KEY
              OPENCODE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: OPENCODE_API_KEY
            envFrom:
              - secretRef:
                  name: ${APP}-secret
              - secretRef:
                  name: ${APP}-ssh
        annotations:
          secret.reloader.stakater.com/reload: paseo-password,paseo-secret,paseo-mcp,paseo-ssh,paseo-tailscale,litellm-paseo-general,paseo-agents,paseo-claude
    persistence:
      data:
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/shared
        advancedMounts:
          ${APP}:
            app: &id001
              - path: /data
                readOnly: true
            sshd: *id001
    route:
      app:
        hostnames:
          - paseo-general.${SECRET_DOMAIN}
          - paseo.${SECRET_DOMAIN}
