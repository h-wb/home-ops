apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  values:
    controllers:
      ${APP}:
        labels:
          nfsMount: "true"
        initContainers:
          tools:
            env:
              ANTHROPIC_BASE_URL: http://litellm.llm.svc.cluster.local:4000
            envFrom:
              - secretRef:
                  name: ${APP}-secret
        containers:
          app:
            env:
              ANTHROPIC_BASE_URL: http://litellm.llm.svc.cluster.local:4000
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: GH_TOKEN
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: MEMINI_API_KEY
              OPENCODE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: OPENCODE_API_KEY
            envFrom:
              - secretRef:
                  name: ${APP}-secret
              - secretRef:
                  name: ${APP}-password
    persistence:
      data:
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/shared
        advancedMounts:
          ${APP}:
            app:
              - path: /data
                readOnly: true
    route:
      app:
        hostnames:
          - paseo-general.${SECRET_DOMAIN}
          - paseo.${SECRET_DOMAIN}
