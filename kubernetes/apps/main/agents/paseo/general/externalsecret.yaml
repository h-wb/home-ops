---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-github
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-github
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GH_TOKEN: "{{ .GH_TOKEN }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
# OpenCode (Zen/Go) console key, consumed by the `opencode` provider entry in
# config/opencode.json. Kept in its own ExternalSecret, mirroring paseo-github:
# a missing key in the Bitwarden item leaves this one unsynced instead of
# breaking the paseo-secret template the pod's other credentials ride on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-opencode
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-opencode
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        OPENCODE_API_KEY: "{{ .OPENCODE_API_KEY }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
# Memini-general's client key, read from the `memini` item where it already
# lives (GENERAL_CODEX); no second copy of memini's key material anywhere.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-memory
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-memory
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        MEMINI_API_KEY: "{{ .GENERAL_CODEX }}"
  dataFrom:
    - extract:
        key: memini
---
# Claude Code's LiteLLM gateway header. Claude Code owns its subscription
# sign-in and the gateway owns no Anthropic key; the x-litellm-api-key header is
# what authenticates the running session's virtual key. Its raw value is the
# LITELLM_API_KEY field of the paseo credential item (pasted once); the pods
# themselves read the raw key straight from the operator's Secret in this
# namespace, so a rotation needs this field updated by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-claude
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-claude
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ANTHROPIC_CUSTOM_HEADERS: "x-litellm-api-key: Bearer {{ .LITELLM_API_KEY }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
