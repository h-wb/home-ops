---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-github
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-github
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GH_TOKEN: "{{ .GH_TOKEN }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
# OpenCode (Zen/Go) console key, consumed by the `opencode` provider entry in
# config/opencode.json. Kept in its own ExternalSecret, mirroring paseo-github:
# a missing key in the Bitwarden item leaves this one unsynced instead of
# breaking the paseo-secret template the pod's other credentials ride on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-opencode
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-opencode
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        OPENCODE_API_KEY: "{{ .OPENCODE_API_KEY }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-memory
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  data:
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini-paseo-general
