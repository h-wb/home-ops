---
# The general pod's agent keys, one Secret for all of them (jory-shape): the
# Bitwarden paseo-general and memini items are extracted together — dataFrom
# merges both — and this one template emits every var the helmrelease binds by
# name. Fault isolation still holds per missing field in either item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-agents
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-agents
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GH_TOKEN: "{{ .GH_TOKEN }}"
        OPENCODE_API_KEY: "{{ .OPENCODE_API_KEY }}"
        MEMINI_API_KEY: "{{ .GENERAL_PASEO }}"
        # Claude Code's LiteLLM gateway header: the raw virtual key is bound
        # straight from the operator's Secret, and the credential item's
        # LITELLM_API_KEY field exists only to compose this one string.
        ANTHROPIC_CUSTOM_HEADERS: "x-litellm-api-key: Bearer {{ .LITELLM_API_KEY }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
    - extract:
        key: memini
