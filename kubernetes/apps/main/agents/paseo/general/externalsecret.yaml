---
# The general pod's agent keys, one Secret for all of them (jory-shape): the
# Bitwarden paseo-general and memini items are extracted together — dataFrom
# merges both — and this one template emits every var the helmrelease binds by
# name. Fault isolation still holds per missing field in either item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-agents
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-agents
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GH_TOKEN: "{{ .GH_TOKEN }}"
        OPENCODE_API_KEY: "{{ .OPENCODE_API_KEY }}"
        MEMINI_API_KEY: "{{ .GENERAL_PASEO }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
    - extract:
        key: memini
---
# Claude Code's LiteLLM gateway header, composed from the operator-generated
# virtual key: the litellm-operator writes the litellm-paseo-<scope> Secret into
# the pods' namespace from the virtualkey.yaml CR, and this Kubernetes-provider
# SecretStore reads it back (Role/RoleBinding in rbac.yaml). The raw key never
# lives in Bitwarden, so operator rotation propagates on its own: operator
# writes the Secret → this ES refreshes (1m) → Reloader rolls the pod.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: litellm-virtual-key
spec:
  provider:
    kubernetes:
      remoteNamespace: agents
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-claude
spec:
  secretStoreRef:
    name: litellm-virtual-key
    kind: SecretStore
  refreshInterval: 1m
  target:
    name: paseo-claude
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # k8s env cannot compose a "name: value" header string, so the header is
        # composed here from the live virtual key. Authorization keeps carrying
        # the CLI's claude.ai OAuth token, which LiteLLM forwards upstream.
        ANTHROPIC_CUSTOM_HEADERS: "x-litellm-api-key: Bearer {{ .LITELLM_API_KEY }}"
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm-paseo-${PASEO_DATA_SCOPE}
        property: api-key
