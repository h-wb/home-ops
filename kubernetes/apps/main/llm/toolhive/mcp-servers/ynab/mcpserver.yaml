---
# Read-only by allow-list: the stdio server ignores YNAB_READ_ONLY (Worker only)
# and a personal access token cannot be scoped, so the proxy hides every write
# tool, including any a later version adds.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: ynab-readonly
spec:
  toolsFilter:
    - ynab_list_plans
    - ynab_plan_summary
    - ynab_list_accounts
    - ynab_list_categories
    - ynab_list_payees
    - ynab_list_months
    - ynab_list_scheduled_transactions
    - ynab_get_transactions
    - ynab_get_unapproved_transactions
    - ynab_spending_by_category
    - ynab_spending_by_payee
    - ynab_cash_flow
---
# calebl/ynab-mcp-server, which publishes no image: a stock Node image runs the
# pinned npm package. Personal finance data, so it stays off mcp-ops.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: ynab
spec:
  image: docker.io/library/node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  args:
    - npx
    - --yes
    - ynab-mcp-server@0.4.1
  env:
    # The root filesystem is read-only, so npm gets the /tmp emptyDir.
    - name: HOME
      value: /tmp
    - name: npm_config_cache
      value: /tmp/.npm
    - name: npm_config_update_notifier
      value: "false"
  toolConfigRef:
    name: ynab-readonly
  secrets:
    - name: toolhive-ynab
      key: token
      targetEnvName: YNAB_API_TOKEN
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
