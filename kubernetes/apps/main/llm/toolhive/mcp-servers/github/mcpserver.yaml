---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: github
spec:
  image: ghcr.io/github/github-mcp-server:v2.2.0@sha256:040c4e99810076035eb1d9beb4b4a96fcf589c43cefed6ff51a46a553eb4e174
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  # As the GitHub App bot-tintin: the server mints and renews its own installation
  # token (github-mcp-server docs/github-app-auth.md). The bot cannot merge without
  # the owner's approval. Only the general gateway lists its write tools.
  env:
    - name: GITHUB_APP_PRIVATE_KEY_PATH
      value: /var/run/secrets/github/private-key.pem
  secrets:
    - name: toolhive-github
      key: app-id
      targetEnvName: GITHUB_APP_ID
    - name: toolhive-github
      key: installation-id
      targetEnvName: GITHUB_APP_INSTALLATION_ID
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: app-key
              mountPath: /var/run/secrets/github
              readOnly: true
      volumes:
        - name: app-key
          secret:
            secretName: toolhive-github
            items:
              - key: private-key.pem
                path: private-key.pem
            # fsGroup 1000 is the server's group; 0400 would leave it unreadable.
            defaultMode: 0440
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  groupRef:
    name: mcp-tools
