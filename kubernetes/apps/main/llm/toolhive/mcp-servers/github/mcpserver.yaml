---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: github
spec:
  image: ghcr.io/github/github-mcp-server:v2.2.0@sha256:040c4e99810076035eb1d9beb4b4a96fcf589c43cefed6ff51a46a553eb4e174
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  # Read-only: the gateways only read here (the assistant reads pages). Agents write
  # through `gh` in their pod, as the bot-tintin app, never with this token.
  env:
    - name: GITHUB_READ_ONLY
      value: "1"
  secrets:
    - name: toolhive-github
      key: token
      targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  groupRef:
    name: mcp-tools
