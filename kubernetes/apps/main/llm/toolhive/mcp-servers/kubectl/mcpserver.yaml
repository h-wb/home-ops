---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubectl
spec:
  image: docker.io/rohitghumare64/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  serviceAccount: mcp-readonly
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --read-only
          # 2.0 is built for 10001 with WORKDIR /home/mcp; ToolHive's default 1000 can't
          # read it and the server dies on stat('.env')
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          env:
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            - name: PYTHONUNBUFFERED
              value: "1"
            # 2.0 refuses non-loopback binds without OAuth; only the ToolHive proxy reaches it
            - name: MCP_ALLOW_UNAUTHENTICATED
              value: "true"
            # 2.0 defaults to core+helm; mcp-ops does find_tool/call_tool, so expose everything
            - name: MCP_TOOLSETS
              value: all
  groupRef:
    name: mcp-tools
