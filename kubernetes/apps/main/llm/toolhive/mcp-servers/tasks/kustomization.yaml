---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# A synthetic personal task board (tasks-server.py), private. The build's tasks are
# on the board, Orbit (mcp-servers/orbit).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./mcpservers.yaml
configMapGenerator:
  # Referenced by literal name inside the MCPServer CRs (kustomize cannot rewrite
  # references in arbitrary CRs), so the hash suffix stays off.
  - name: tasks-server
    options:
      disableNameSuffixHash: true
    files:
      - server.py=./tasks-server.py
