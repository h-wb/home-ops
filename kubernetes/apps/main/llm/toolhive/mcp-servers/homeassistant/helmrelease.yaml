---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# ha-mcp for the edge cluster's Home Assistant (192.168.18.77, the edge LAN). A plain
# release instead of an MCPServer so the tailscale client component can add its
# sidecar, which routes the edge LAN into this pod. Registered as mcpserverentry.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mcp-homeassistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      mcp-homeassistant:
        annotations:
          secret.reloader.stakater.com/reload: mcp-homeassistant
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 9.1.2@sha256:381b1e01635d3c51f35a01882863610bc0b76a22bae93835a6a5a5c926d9ecb4
            command: ["ha-mcp-web"]
            env:
              HOMEASSISTANT_URL: http://192.168.18.77:8123
              MCP_PORT: &port 8086
              HA_MCP_DISABLE_SETTINGS_UI: "true"
            envFrom:
              - secretRef:
                  name: mcp-homeassistant
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      # ha-mcp keeps small state (settings, caches) in its home.
      home:
        type: emptyDir
        advancedMounts:
          mcp-homeassistant:
            app:
              - path: /home/mcpuser/.ha-mcp
