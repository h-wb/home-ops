---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# A Home Assistant long-lived access token (Profile → Security), in the Bitwarden `toolhive` secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-homeassistant
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        HOMEASSISTANT_TOKEN: "{{ .HOMEASSISTANT_TOKEN }}"
  dataFrom:
    - extract:
        key: toolhive
