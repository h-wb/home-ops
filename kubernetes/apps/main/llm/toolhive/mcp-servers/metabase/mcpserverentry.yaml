---
# Metabase's built-in MCP endpoint. Since 0.65 it takes only OAuth access tokens, so
# the gateway carries one minted once through the consent page (Metabase sets a 1y
# TTL for this); tools see what the consenting user can see. Re-mint before expiry.
#
# The gateway pod mounts this entry's header secret itself, so if the secret is
# missing the whole gateway fails to start, not just this backend.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServerEntry
metadata:
  name: metabase
spec:
  remoteUrl: http://metabase.automation.svc.cluster.local:3000/api/metabase-mcp
  transport: streamable-http
  allowPrivateEndpoint: true
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-metabase
          key: authorization
  groupRef:
    name: mcp-tools
