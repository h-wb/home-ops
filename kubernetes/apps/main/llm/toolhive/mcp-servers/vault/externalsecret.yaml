---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# BWS item obsidian-headless: OBSIDIAN_AUTH_TOKEN, OBSIDIAN_VAULT and, for an end-to-end
# encrypted vault, OBSIDIAN_VAULT_PASSWORD. Read only by the vault pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-headless
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: obsidian-headless
  dataFrom:
    - extract:
        key: obsidian-headless
