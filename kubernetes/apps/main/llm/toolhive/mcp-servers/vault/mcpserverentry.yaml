---
# The servers run in default/obsidian-vault; same names, so tool names don't change.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServerEntry
metadata:
  name: vault-ro
spec:
  remoteUrl: http://mcp-vault-ro-proxy.default.svc.cluster.local:8080/mcp
  transport: streamable-http
  allowPrivateEndpoint: true
  groupRef:
    name: mcp-tools
---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServerEntry
metadata:
  name: vault-inbox
spec:
  remoteUrl: http://mcp-vault-inbox-proxy.default.svc.cluster.local:8080/mcp
  transport: streamable-http
  allowPrivateEndpoint: true
  groupRef:
    name: mcp-tools
---
# TEMPORARY (2026-11), with the app's seekstone-review.yaml.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServerEntry
metadata:
  name: vault-review
spec:
  remoteUrl: http://mcp-vault-review-proxy.default.svc.cluster.local:8080/mcp
  transport: streamable-http
  allowPrivateEndpoint: true
  groupRef:
    name: mcp-tools
