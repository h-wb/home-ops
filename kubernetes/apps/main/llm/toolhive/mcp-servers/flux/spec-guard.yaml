---
# flux-mcp's write grant is for the reconcile tool, which only annotates. Any
# spec change by it is refused: through apply_kubernetes_manifest an agent
# could otherwise rewrite a HelmRelease, e.g. add a container to the owner's
# code-server pod and read his credentials. Costs the suspend/resume tools.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-mcp-no-spec-changes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - fluxcd.controlplane.io
          - helm.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
          - source.toolkit.fluxcd.io
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: ["*"]
  matchConditions:
    - name: flux-mcp-only
      expression: request.userInfo.username == 'system:serviceaccount:llm:flux-mcp'
  validations:
    - expression: request.operation == 'UPDATE'
      message: The Flux MCP cannot create Flux objects.
    - expression: "has(object.spec) == has(oldObject.spec) && (!has(object.spec) || object.spec == oldObject.spec)"
      message: The Flux MCP may request a reconcile but not change a spec.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-mcp-no-spec-changes
spec:
  policyName: flux-mcp-no-spec-changes
  validationActions: [Deny]
