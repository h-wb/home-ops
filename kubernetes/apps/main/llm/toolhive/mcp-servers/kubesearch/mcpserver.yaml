---
# Searches kubesearch.dev: how other home-ops repos configure a given chart or app.
# Public data only, no credentials.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  image: ghcr.io/rust84/kubesearch-mcp-server:latest@sha256:01979e56fbac8e0a5fefb4344d4f9dc0ce8e4b6222a64a1515b681df7cd11da3
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            readOnlyRootFilesystem: false
  groupRef:
    name: mcp-tools
