---
# Searches kubesearch.dev: how other home-ops repos configure a given chart or app.
# Public data only, no credentials.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  image: ghcr.io/rust84/kubesearch-mcp-server:latest@sha256:d3550eee6dd43a67394716106c05984c47c6aeac1ff7b6841380a8af2b314547
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            readOnlyRootFilesystem: false
  groupRef:
    name: mcp-tools
