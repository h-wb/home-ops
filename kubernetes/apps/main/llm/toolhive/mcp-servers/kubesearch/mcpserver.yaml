---
# Searches kubesearch.dev: how other home-ops repos configure a given chart or app.
# Public data only, no credentials.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  image: ghcr.io/rust84/kubesearch-mcp-server:latest@sha256:b5c70b87bc00cc8bf39984630a6528ef6ff598f04b15fb83a2b3517239e9151b
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            readOnlyRootFilesystem: false
  groupRef:
    name: mcp-tools
