---
# Searches kubesearch.dev: how other home-ops repos configure a given chart or app.
# Public data only, no credentials.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  image: ghcr.io/rust84/kubesearch-mcp-server:latest@sha256:7668e10b0532fa32ca3bd7e225224952d8a0fda6880771f2dabc000d974aa084
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            readOnlyRootFilesystem: false
  groupRef:
    name: mcp-tools
