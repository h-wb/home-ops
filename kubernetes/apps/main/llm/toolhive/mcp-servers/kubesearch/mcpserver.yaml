---
# Searches kubesearch.dev: how other home-ops repos configure a given chart or app.
# Public data only, no credentials.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  image: ghcr.io/rust84/kubesearch-mcp-server:latest@sha256:e4cb8bd130200990af761221d3644eeb4e3c1f2093ca6a05686d2bae7e3990be
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            readOnlyRootFilesystem: false
  groupRef:
    name: mcp-tools
