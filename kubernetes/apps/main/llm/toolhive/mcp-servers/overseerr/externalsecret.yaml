---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Overseerr's API key (Settings → General), in the Bitwarden `toolhive` secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-overseerr
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
