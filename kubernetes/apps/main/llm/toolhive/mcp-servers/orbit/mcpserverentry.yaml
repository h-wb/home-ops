---
# Orbit's own MCP endpoint (default/orbit), called with an API token. An Orbit
# token belongs to one workspace: this one is for the workspace shared with
# agents, which holds nothing private, so mcp-general lists it.
#
# The address is Orbit's public origin, through the internal gateway: Orbit
# refuses any other host name and any request that did not come through its
# trusted proxy over HTTPS. That name does not resolve inside the cluster, so
# the gateway pods carry a host alias for it (config/*-gateway.yaml).
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServerEntry
metadata:
  name: orbit
spec:
  remoteUrl: https://orbit.${SECRET_DOMAIN}/mcp
  transport: streamable-http
  allowPrivateEndpoint: true
  externalAuthConfigRef:
    name: orbit-write
  groupRef:
    name: mcp-tools
