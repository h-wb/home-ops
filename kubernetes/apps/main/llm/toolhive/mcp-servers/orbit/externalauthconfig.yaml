---
# The two Orbit tokens, as headers a gateway adds. orbit-write can write tasks and
# pages: the general gateway's. orbit-read can only read tasks: the private
# gateways', so Orbit itself refuses a write from the private side.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: orbit-write
spec:
  type: headerInjection
  headerInjection:
    headerName: Authorization
    valueSecretRef:
      name: toolhive-orbit
      key: authorization
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: orbit-read
spec:
  type: headerInjection
  headerInjection:
    headerName: Authorization
    valueSecretRef:
      name: toolhive-orbit
      key: read-authorization
