---
# Both gateways take callers anonymously, so who may reach each one's MCP port is
# the scope boundary in-cluster. Clients outside the cluster come through Envoy
# (envoy-internal), which checks their x-api-key against that gateway's own key
# list (securitypolicy.yaml, general-gateway.yaml). In-cluster clients have no
# key: these policies name them, one scope each. Prometheus may only reach the
# diagnostics port (9464), never the MCP port.
#
# mcp-private aggregates private data (the Obsidian vault, personal
# tasks): only Envoy and the private workshop. The assistant has its own below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-private
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: envoy-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paseo-private
      ports:
        - port: 4483
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9464
          protocol: TCP
---
# mcp-general: the curated, non-private tools. Envoy and the
# general-scope pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-general
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-general
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: envoy-gateway
        - podSelector:
            matchLabels:
              # The general Paseo keeps its historical `paseo` name.
              app.kubernetes.io/name: paseo
      ports:
        - port: 4483
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9464
          protocol: TCP
---
# mcp-assistant: the same private catalogue with real tool names, for the
# assistant alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-assistant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-private
              assistant.scope: private
      ports:
        - port: 4483
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9464
          protocol: TCP
---
# The tool servers (each one's proxy and backend pod) answer ToolHive's own pods
# only: the gateways and the proxies. Any other pod has to come through its
# scope's gateway, which is the one that is admitted by scope above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tool-servers
spec:
  podSelector:
    matchLabels:
      toolhive: "true"
    matchExpressions:
      # The gateways carry the label too; their own policies above decide for them.
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [virtualmcpserver]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              toolhive: "true"
