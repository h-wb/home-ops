---
# mcp-private's keys: clients outside the cluster only, one each (Bitwarden
# `toolhive`). Pods come in-cluster, admitted by networkpolicy.yaml. A missing
# field fails the template (missingkey=error), so the Secret keeps its last keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-api-keys
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: mcp-gateway-api-keys
    template:
      engineVersion: v2
      data:
        macbook: "{{ .TOOLHIVE_MACBOOK_PRIVATE_API_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
---
# The session Dragonfly's password, which both gateways and the Dragonfly read
# (ks.yaml patches it in). Bitwarden `toolhive`, like the client keys: nothing is
# generated in-cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-config-redis
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: toolhive-config-redis
    template:
      engineVersion: v2
      data:
        password: "{{ .TOOLHIVE_CONFIG_REDIS_PASSWORD }}"
  dataFrom:
    - extract:
        key: toolhive
