---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Client keys for the gateway route. Each key of the Secret is a client name and its
# value the key that client sends as `x-api-key`; add a client by adding a line.
# - macbook: Hugo's laptop. - paseo-agents: the Vibe agents on the paseo pod
#   (agents/paseo pulls the same field into their MCP_GATEWAY_API_KEY env).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-gateway-api-keys
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        macbook: "{{ .TOOLHIVE_GATEWAY_API_KEY }}"
        paseo-agents: "{{ .MCP_GATEWAY_API_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
