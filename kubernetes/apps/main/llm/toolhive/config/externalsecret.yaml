---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-api-keys
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: mcp-gateway-api-keys
    template:
      engineVersion: v2
      data:
        macbook: "{{ .TOOLHIVE_GATEWAY_API_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-paseo
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-gateway-paseo
    template:
      engineVersion: v2
      data:
        paseo-agents: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-gateway-paseo
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-gateway-paseo
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mcp-gateway-paseo
spec:
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: mcp-gateway-paseo
  data:
    - match:
        secretKey: paseo-agents
        remoteRef:
          remoteKey: mcp-gateway-paseo
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-paseo-general
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-paseo-general
    template:
      engineVersion: v2
      data:
        paseo-general: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-paseo-general
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-paseo-general
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-paseo-private
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-paseo-private
    template:
      engineVersion: v2
      data:
        paseo-private: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-paseo-private
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-paseo-private
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
