---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Client keys for the gateway route. Each key of the Secret is a client name and its
# value the key that client sends as `x-api-key`; add a client by adding a line.
# - macbook: Hugo's laptop. Open WebUI and Paseo use separately generated keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-gateway-api-keys
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        macbook: "{{ .TOOLHIVE_GATEWAY_API_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
---
# Open WebUI's private-path credential. Generated separately so adding this
# client does not rotate existing laptop or Paseo credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-gateway-open-webui
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        open-webui: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-gateway-open-webui
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-gateway-open-webui
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Generate the Paseo client key once and publish it to Bitwarden so the agents
# namespace can consume it. No manual JSON field or credential in Git is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-gateway-paseo
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        paseo-agents: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-gateway-paseo
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-gateway-paseo
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: &name mcp-gateway-paseo
spec:
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: *name
  data:
    - match:
        secretKey: paseo-agents
        remoteRef:
          remoteKey: *name
