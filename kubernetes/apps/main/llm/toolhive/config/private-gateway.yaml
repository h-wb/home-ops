---
# One MCP endpoint aggregating every server in the `mcp-tools` group. Tool-name
# clashes are resolved with a `{workload}_` prefix. Authentication happens at the
# Envoy route (securitypolicy.yaml), so in-cluster callers come in anonymously.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-private
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
      tools:
        # Its own description is 2494 tokens, over the embedder's 2048-token limit:
        # the indexing request failed whole and the gateway had no tool search.
        - workload: homeassistant
          overrides:
            ha_manage_backup:
              description: >-
                Create, list, restore or delete Home Assistant backups. Restoring
                replaces the current configuration, so ask before doing it.
    # Tool search over embeddings, so clients get the relevant tools instead of the
    # whole catalogue. Uses LiteLLM's in-cluster `embed`.
    optimizer:
      embeddingModel: embed
      embeddingProvider: openai
      embeddingService: http://litellm.llm.svc.cluster.local:4000/v1
      # The first session embeds every tool in one request: about a minute for
      # 690 tools on the CPU embedder. Stays under LiteLLM's own 300s.
      embeddingServiceTimeout: 280s
      # Every hit comes back with its full input schema (~3k chars each), so the
      # default 8 floods a small model's context; 4 is enough to pick from.
      maxToolsToReturn: 4
      # Lean on keywords: the small nomic embedder doesn't link "workout" to
      # Metabase, but a literal "metabase"/"sql" in the query should land.
      hybridSearchSemanticRatio: "0.3"
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  # Prometheus metrics on the diagnostics port (9464), off the MCP port: the MCP
  # port is anonymous, so metrics get their own port and NetworkPolicy rule.
  telemetryConfigRef:
    name: prometheus
  # Sessions in the toolhive-config Dragonfly (components/dragonfly), so they
  # survive a gateway restart. One instance for both gateways, a prefix each,
  # behind a password because every pod in llm may reach its port.
  sessionStorage:
    provider: redis
    address: toolhive-config-dragonfly.llm.svc.cluster.local:6379
    keyPrefix: "toolhive:mcp-private:"
    passwordRef:
      name: toolhive-config-redis
      key: password
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            # Scoped LiteLLM key (litellm virtualkeys/toolhive.yaml); the operator
            # writes it into this namespace, so no Bitwarden round-trip.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-toolhive
                  key: api-key
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi
