---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./assistant-gateway.yaml
  - ./dashboard
  - ./externalsecret.yaml
  - ./general-gateway.yaml
  - ./grafanadashboard.yaml
  - ./httproute.yaml
  - ./mcpgroup.yaml
  - ./networkpolicy.yaml
  - ./podmonitor.yaml
  - ./securitypolicy.yaml
  - ./telemetry.yaml
  - ./virtualmcpserver.yaml
# The dragonfly component (added by ks.yaml) has no password, and its client
# policy opens 6379 to every pod in the namespace, so this instance requires the
# gateways' password. Kind-only target: the name is still ${APP}-dragonfly here.
patches:
  - target:
      kind: Dragonfly
    patch: |
      - op: add
        path: /spec/authentication
        value:
          passwordFromSecret:
            name: toolhive-config-redis
            key: password
