---
# The assistant's gateway: the private catalogue with its real tool names.
# Hermes searches tools itself and asks before a write-capable call, which needs
# the names that the optimizer on mcp-private hides. In-cluster only, no route.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-assistant
spec:
  groupRef:
    name: mcp-tools
  config:
    # Same reason as on mcp-private.
    operational:
      failureHandling:
        healthCheckInterval: 5m
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
      tools:
        # The build board is general and this gateway is private: information may
        # flow from the board here, never back. Its token can also write tasks and
        # read and write every document of the workspace, so only these read-only
        # task tools are listed, by their names before the prefix. ToolHive refuses
        # a call to a tool its filter hides (core.CallTool, v0.68.0).
        - workload: orbit
          filter:
            - get_task
            - list_tasks
            - list_task_statuses
            - list_labels
            - get_me
        # Same short description as on mcp-private; the original is 8.6k characters.
        - workload: homeassistant
          overrides:
            ha_manage_backup:
              description: >-
                Create, list, restore or delete Home Assistant backups. Restoring
                replaces the current configuration, so ask before doing it.
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  telemetryConfigRef:
    name: prometheus
  sessionStorage:
    provider: redis
    address: toolhive-config-dragonfly.llm.svc.cluster.local:6379
    keyPrefix: "toolhive:mcp-assistant:"
    passwordRef:
      name: toolhive-config-redis
      key: password
  podTemplateSpec:
    spec:
      # Orbit answers only on its public origin, through the internal gateway
      # (mcp-servers/orbit); that name does not resolve inside the cluster.
      hostAliases:
        - ip: ${SVC_GATEWAY_INTERNAL}
          hostnames:
            - orbit.${SECRET_DOMAIN}
      containers:
        - name: vmcp
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi
