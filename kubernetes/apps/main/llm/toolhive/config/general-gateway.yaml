---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-general
spec:
  groupRef:
    name: mcp-tools
  config:
    # Same reason as on mcp-private.
    operational:
      failureHandling:
        healthCheckInterval: 5m
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
      defaultToolVisibility: deny
      tools:
        - workload: kubectl
        - workload: flux
        - workload: github
        - workload: n8n
        - workload: kubesearch
        - workload: grafana
        - workload: arr
        - workload: overseerr
        - workload: talos
        - workload: anki
        - workload: excel
        # Private tier data (vault, personal tasks) never appears in this list: general
        # gets the shared board, private gets the whole catalogue via mcp-private.
        - workload: homelab-tasks
    optimizer:
      embeddingModel: embed
      embeddingProvider: openai
      embeddingService: http://litellm.llm.svc.cluster.local:4000/v1
      # The first session embeds every tool in one request: about a minute for
      # 690 tools on the CPU embedder. Stays under LiteLLM's own 300s.
      embeddingServiceTimeout: 280s
      hybridSearchSemanticRatio: "0.3"
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  # Prometheus metrics on the diagnostics port (9464), off the MCP port: the MCP
  # port is anonymous, so metrics get their own port and NetworkPolicy rule.
  telemetryConfigRef:
    name: prometheus
  # Sessions in the toolhive-config Dragonfly (components/dragonfly), so they
  # survive a gateway restart. One instance for both gateways, a prefix each,
  # behind a password because every pod in llm may reach its port.
  sessionStorage:
    provider: redis
    address: toolhive-config-dragonfly.llm.svc.cluster.local:6379
    keyPrefix: "toolhive:mcp-general:"
    passwordRef:
      name: toolhive-config-redis
      key: password
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-toolhive
                  key: api-key
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-general
spec:
  hostnames:
    - mcp-general.${SECRET_DOMAIN}
    # The gateway's old name; kept until no client uses it.
    - mcp-ops.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: vmcp-mcp-general
          port: 4483
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp-general-api-key
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-general
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: mcp-general-api-keys
    extractFrom:
      - headers:
          - x-api-key
    sanitize: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-general-api-keys
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: mcp-general-api-keys
    template:
      engineVersion: v2
      # Clients outside the cluster only, <SCOPE>_<HOLDER> in Bitwarden `toolhive`; pods
      # come in-cluster, admitted by networkpolicy.yaml. A missing field fails the
      # template (missingkey=error), so the Secret keeps its last good keys.
      data:
        workstation: "{{ .GENERAL_WORKSTATION }}"
  dataFrom:
    - extract:
        key: toolhive
