---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# The memory of the cloud coding agents (Claude Code, Codex), kept in its own
# instance: a memini key is identity, not isolation, so any key can read every
# namespace of the instance it belongs to. The private one (memini) is only
# reachable through the ToolHive gateway.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini-code
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    fullnameOverride: memini-code
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              TZ: Europe/Paris
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              # One listener: the UI rides the API port, so one hostname serves
              # the plugins (/v1, /mcp) and the UI.
              MEMINI_UI_ADDR: ""
              MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-code-secret
                    key: MEMINI_API_KEY
              # Same local embedder as memini; see its HelmRelease for the limits.
              MEMINI_EMBED_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              MEMINI_EMBED_MODEL: embed
              MEMINI_EMBED_DIMS: "768"
              MEMINI_EMBED_MAX_ITEM_CHARS: "5000"
              MEMINI_EMBED_MAX_BATCH: "8"
              MEMINI_EMBED_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-memini
                    key: api-key
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    persistence:
      data:
        existingClaim: memini-code
      api-keys:
        enabled: true
        name: memini-code-secret
    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: memini-code
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Memini (code)
          gethomepage.dev/icon: mdi-brain
          gethomepage.dev/description: Coding Agent Memory
        hostnames:
          - memini-code.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    serviceMonitor:
      main:
        enabled: true
