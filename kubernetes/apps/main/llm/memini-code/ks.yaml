---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app memini-code
  namespace: &namespace llm
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/kopiur/backup
  dependsOn:
    - name: litellm
      namespace: llm
    - name: embed
      namespace: llm
  interval: 30m
  path: ./kubernetes/apps/main/llm/memini-code/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 2Gi
      # The image runs as uid 65532 (distroless nonroot).
      KOPIUR_PUID: "65532"
      KOPIUR_PGID: "65532"
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
