---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-operator
spec:
  chartRef:
    kind: OCIRepository
    name: litellm-operator
  interval: 1h
  values:
    controller:
      logLevel: info
      leaderElection:
        enabled: true
    # llmkube is jory-specific (llama.cpp models as CRs); nothing here registers with it.
    llmkube:
      autoRegister: false
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
