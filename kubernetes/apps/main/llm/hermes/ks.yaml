---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The assistant (../DESIGN.md): one hardened pod in the private scope, its tools
# through the private ToolHive gateway, its memories in the private Memini, its
# models through its own LiteLLM key.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: &namespace llm
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: litellm
      namespace: llm
    - name: memini
      namespace: llm
    - name: toolhive-config
      namespace: llm
  interval: 30m
  path: ./kubernetes/apps/main/llm/hermes/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
