---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Kept inside the app build so cluster-apps does not overwrite substituteFrom.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-bluebubbles-network
  namespace: llm
spec:
  targetNamespace: llm
  interval: 30m
  retryInterval: 1m
  timeout: 1m
  prune: true
  wait: false
  path: ./kubernetes/apps/main/llm/hermes/bluebubbles
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      # Evaluate the hostname default even before the optional Secret exists.
      var_substitution_enabled: "true"
    substituteFrom:
      - kind: Secret
        name: hermes-bluebubbles-network
        optional: true
