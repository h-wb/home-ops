---
# One key per tier; the model allowlist lives here, not in the agent sandboxes.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes-general
spec:
  proxyRef: litellm
  proxyNamespace: llm
  keyAlias: Hermes general
  secretName: litellm-hermes-general
  secretKey: api-key
  models:
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes-private
spec:
  proxyRef: litellm
  proxyNamespace: llm
  keyAlias: Hermes private
  secretName: litellm-hermes-private
  secretKey: api-key
  models:
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
    - mistral/mistral-large-latest
