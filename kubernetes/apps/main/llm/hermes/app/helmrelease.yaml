---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# The assistant (../../DESIGN.md): private scope only. The pod name stays
# hermes-private-0, which the Paseo provider execs into (rbac.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes-private
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    defaultPodOptions:
      # Ask for names as written. With the default search path the pod first asked
      # for api.telegram.org.llm.svc.cluster.local, CoreDNS answered it, and the
      # egress rule, which matches the name asked, never learned Telegram's address.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        # The image's s6 init starts as root and drops to its hermes user (10000).
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: statefulset
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        # On the pods, not the StatefulSet: the NetworkPolicies (hermes, toolhive)
        # select pods by it. `labels` here would only label the controller.
        pod:
          labels:
            assistant.scope: private
        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 2Gi
              storageClass: ceph-block
        # Lays out the routines' skills and creates their scheduled jobs before
        # the assistant starts (routines/sync.sh). As the image's own user, which s6 drops to below.
        initContainers:
          routines:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
            command: ["/bin/sh", "/opt/hermes-routines/src/sync.sh"]
            env:
              HERMES_HOME: &home /data/hermes
              HOME: *home
              TZ: &tz Europe/Paris
            securityContext:
              runAsNonRoot: true
              runAsUser: 10000
              runAsGroup: 10000
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
        containers:
          hermes:
            image: *image
            args: ["gateway", "run"]
            env:
              HERMES_HOME: *home
              HOME: *home
              TZ: *tz
              # Fail fast: the NetworkPolicy silently drops internet traffic, so Hermes's update
              # and model-catalog checks each waited out a TCP timeout (about 20 s per new
              # session). A closed local port refuses at once; in-cluster names bypass it.
              HTTPS_PROXY: http://127.0.0.1:9
              HTTP_PROXY: http://127.0.0.1:9
              https_proxy: http://127.0.0.1:9
              http_proxy: http://127.0.0.1:9
              NO_PROXY: &no-proxy .svc.cluster.local,.svc,localhost,127.0.0.1,api.telegram.org
              no_proxy: *no-proxy
              # Telegram, by long polling: nothing connects in. Its fallback transport
              # dials bare IPs and public DNS-over-HTTPS, which the egress rule
              # (networkpolicy.yaml) does not allow, so it stays off.
              HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
              TELEGRAM_BOT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-messaging
                    key: TELEGRAM_BOT_TOKEN
              # Anyone else who writes to the bot is ignored.
              TELEGRAM_ALLOWED_USERS:
                valueFrom:
                  secretKeyRef:
                    name: hermes-messaging
                    key: TELEGRAM_ALLOWED_USERS
              TELEGRAM_HOME_CHANNEL:
                valueFrom:
                  secretKeyRef:
                    name: hermes-messaging
                    key: TELEGRAM_HOME_CHANNEL
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-hermes-private
                    key: api-key
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: hermes
              MEMINI_BASE_URL: http://memini-private.llm.svc.cluster.local:8080
              # Read-only key on the general store (config.yaml, general_memory).
              MEMINI_GENERAL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-code-secret
                    key: hermes
              MEMINI_NAMESPACE: hugo
              # The workshop daemons (config.yaml, the four workshop servers).
              PASEO_GENERAL_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: hermes-workshops
                    key: PASEO_GENERAL_PASSWORD
              PASEO_PRIVATE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: hermes-workshops
                    key: PASEO_PRIVATE_PASSWORD
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1536Mi
    persistence:
      # The managed config, read-only: wins over anything the agent writes.
      config:
        type: configMap
        name: hermes-config-private
        globalMounts:
          - path: /etc/hermes
            readOnly: true
      # The Memini plugin (plugin-sync/).
      plugins:
        existingClaim: hermes-plugins
        globalMounts:
          - path: /data/hermes/plugins/memini
            subPath: memini
            readOnly: true
      # The shared dotfiles skills (skills-sync/): each skill as <name>/SKILL.md,
      # read-only, so the assistant can load one and cannot rewrite one.
      dotfiles-skills:
        existingClaim: hermes-skills
        globalMounts:
          - path: /opt/dotfiles-skills
            readOnly: true
      soul:
        type: configMap
        name: hermes-soul
        globalMounts:
          - path: /data/hermes/SOUL.md
            subPath: SOUL.md
            readOnly: true
      # The routines (routines/) as kustomize ships them: one flat file per skill.
      routines:
        type: configMap
        name: hermes-routines
        globalMounts:
          - path: /opt/hermes-routines/src
            readOnly: true
      # The same skills as <name>/SKILL.md, laid out by the init container. The
      # assistant can load one and cannot rewrite one.
      routine-skills:
        type: emptyDir
        advancedMounts:
          main:
            routines:
              - path: /opt/hermes-routines/skills
            hermes:
              - path: /opt/hermes-routines/skills
                readOnly: true
      # Paseo's entry point: `python /opt/hermes-acp/shim.py` (maps Paseo's cwd).
      acp-shim:
        type: configMap
        name: hermes-acp-shim
        globalMounts:
          - path: /opt/hermes-acp
            readOnly: true
      # Binds to the statefulset's claim template above.
      data:
        existingClaim: data
        globalMounts:
          - path: /data
