---
# Hermes may reach DNS, LiteLLM (its key picks the models), both Memini stores (the
# general one read-only) and its own ToolHive gateway; nothing else, and nothing may connect to it (Paseo
# uses the API server's exec, not the pod network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-private
      assistant.scope: private
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini
        # General memory too, with a read-only key.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini-code
      ports:
        - port: 8080
          protocol: TCP
    - to:
        # The gateway is also netpol-gated on its side (llm/toolhive/config).
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mcp-assistant
      ports:
        - port: 4483
          protocol: TCP
