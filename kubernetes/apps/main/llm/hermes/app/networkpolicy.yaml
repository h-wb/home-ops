---
# Hermes may reach DNS, LiteLLM (its key picks the models), both Memini stores (the
# general one read-only), its own ToolHive gateway, the two workshop daemons and
# the Matrix homeserver. Messaging is Matrix-only and in-cluster: of the internet,
# nothing. Only envoy-internal may connect to it, on the dashboard port (Paseo
# uses the API server's exec).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-private
      assistant.scope: private
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - port: 9119
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini
        # General memory too, with a read-only key.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini-code
      ports:
        - port: 8080
          protocol: TCP
    - to:
        # The gateway is also netpol-gated on its side (llm/toolhive/config).
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mcp-assistant
      ports:
        - port: 4483
          protocol: TCP
    # The two workshop daemons, to start agents there (config.yaml).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paseo
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paseo-private
      ports:
        - port: 6767
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: continuwuity
      ports:
        - port: 8080
          protocol: TCP
