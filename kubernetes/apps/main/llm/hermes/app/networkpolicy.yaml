---
# Hermes may reach DNS, LiteLLM (its key picks the models), both Memini stores (the
# general one read-only), its own ToolHive gateway and the two workshop daemons;
# of the internet, Telegram's API only (the second policy). Nothing may connect to
# it (Paseo uses the API server's exec, not the pod network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-private
      assistant.scope: private
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini
        # General memory too, with a read-only key.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini-code
      ports:
        - port: 8080
          protocol: TCP
    - to:
        # The gateway is also netpol-gated on its side (llm/toolhive/config).
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mcp-assistant
      ports:
        - port: 4483
          protocol: TCP
    # The two workshop daemons, to start agents there (config.yaml).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paseo
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paseo-private
      ports:
        - port: 6767
          protocol: TCP
---
# The messaging app: Telegram's Bot API, by name, on 443. A NetworkPolicy cannot
# name a host, so this one is Cilium's; Cilium allows what either policy allows,
# so it adds to the list above and widens nothing else. The DNS rule is what lets
# Cilium see the lookup and learn the name's addresses.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-private-telegram
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-private
      assistant.scope: private
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.telegram.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
