---
# The general Hermes may reach DNS, LiteLLM (its key picks the models), the general
# Memini and the general ToolHive VMCP; nothing else, and nothing may connect to it
# (Paseo uses the API server's exec, not the pod network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-general
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-general
      assistant.scope: general
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini-code
      ports:
        - port: 8080
          protocol: TCP
    - to:
        # The general VMCP only: private-tier servers live behind vmcp-mcp-gateway,
        # and this policy is what stops the general pod from reaching them.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mcp-ops
      ports:
        - port: 4483
          protocol: TCP
---
# The private Hermes may reach DNS, LiteLLM (its key picks the models), the private
# Memini and the private ToolHive VMCP; nothing else, and nothing may connect to it
# (Paseo uses the API server's exec, not the pod network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-private
      assistant.scope: private
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini
      ports:
        - port: 8080
          protocol: TCP
    - to:
        # The private VMCP only: this is the tier boundary for in-cluster calls; the
        # gateway itself is also netpol-gated (llm/toolhive/config) to Envoy and here.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mcp-gateway
      ports:
        - port: 4483
          protocol: TCP
