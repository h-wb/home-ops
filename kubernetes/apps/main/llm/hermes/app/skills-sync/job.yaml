---
# Reruns when sync.sh or the pins change (hashed ConfigMap name, Flux force).
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-skills-sync
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: docker.io/alpine/k8s:1.37.2
          command:
            - /bin/sh
            - /scripts/sync.sh
          env:
            # The cluster's dotfiles pin (kubernetes/clusters/main/ks.yaml): a
            # bump changes this spec, and Flux's force recreates the Job.
            - name: DOTFILES_REF
              value: ${DOTFILES_REF}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: skills
              mountPath: /skills
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: hermes-skills-sync
        - name: skills
          persistentVolumeClaim:
            claimName: hermes-skills
        - name: tmp
          emptyDir: {}
