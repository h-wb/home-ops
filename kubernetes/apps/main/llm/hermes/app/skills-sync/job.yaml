---
# Reruns when sync.sh or the pins change (hashed ConfigMap name, Flux force).
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-skills-sync
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: docker.io/alpine/k8s:1.37.2
          command:
            - /bin/sh
            - /scripts/sync.sh
          env:
            # The skill groups the assistant takes from h-wb/skills (groups/<group>/),
            # space-separated.
            - name: SKILL_GROUPS
              value: core
            # h-wb/skills main. SKILLS_TAR_SHA256 is the codeload tarball for that
            # ref; bump both together.
            - name: SKILLS_REF
              value: 85572b7015fdaf337cbfdb8d907a69e2ac74cecd
            - name: SKILLS_TAR_SHA256
              value: 893685ef8ae37dea347facd8b7fee8e48ed86f3a2bb11ab04e77a2240c74a02f
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: skills
              mountPath: /skills
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: hermes-skills-sync
        - name: skills
          persistentVolumeClaim:
            claimName: hermes-skills
        - name: tmp
          emptyDir: {}
