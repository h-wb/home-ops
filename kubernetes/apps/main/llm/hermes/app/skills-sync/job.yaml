---
# Reruns when sync.sh or the pins change (hashed ConfigMap name, Flux force).
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-skills-sync
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: docker.io/alpine/k8s:1.37.2
          command:
            - /bin/sh
            - /scripts/sync.sh
          env:
            # The skills the assistant takes from h-wb/skills, space-separated.
            - name: SKILLS
              value: handbook board tool-gateway
            # h-wb/skills main, "Merge pull request #1" (the first catalogue).
            # SKILLS_TAR_SHA256 is the codeload tarball for that ref; bump both together.
            - name: SKILLS_REF
              value: e3ba194b9e42e8108cdc8b7aa7816822f54ddc0e
            - name: SKILLS_TAR_SHA256
              value: c19e411f77e6c19696cc969cc733a53880af3fb5722302a24982d88688cab04c
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: skills
              mountPath: /skills
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: hermes-skills-sync
        - name: skills
          persistentVolumeClaim:
            claimName: hermes-skills
        - name: tmp
          emptyDir: {}
