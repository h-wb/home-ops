---
# Reruns when sync.sh or the pins change (hashed ConfigMap name, Flux force).
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-skills-sync
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: docker.io/alpine/k8s:1.37.2
          command:
            - /bin/sh
            - /scripts/sync.sh
          env:
            # The skill groups the assistant takes from h-wb/skills (groups/<group>/),
            # space-separated.
            - name: SKILL_GROUPS
              value: core
            # The head of h-wb/skills#2's branch, which adds the groups; moves to
            # main once it merges. SKILLS_TAR_SHA256 is the codeload tarball for
            # that ref; bump both together.
            - name: SKILLS_REF
              value: 3a27eb3978a476e6f057a55acbbe7275a0626665
            - name: SKILLS_TAR_SHA256
              value: a2fa294192775f9208ec12159029de121a94412a84d7b4a5fb276f397025b8a7
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: skills
              mountPath: /skills
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: hermes-skills-sync
        - name: skills
          persistentVolumeClaim:
            claimName: hermes-skills
        - name: tmp
          emptyDir: {}
