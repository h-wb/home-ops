---
# The skills the assistant takes from h-wb/skills; written by the sync Job, mounted
# read-only by Hermes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-skills
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ceph-filesystem
  resources:
    requests:
      storage: 100Mi
