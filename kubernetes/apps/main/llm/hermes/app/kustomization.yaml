---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# The release mounts the config, the instructions and the ACP shim by literal name (kustomize cannot
# rewrite references inside HelmRelease values); changes roll via Reloader.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - ./plugin-sync
  - ./skills-sync
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./rbac.yaml
  - ./virtualkey.yaml
configMapGenerator:
  - name: hermes-config-private
    options:
      disableNameSuffixHash: true
    files:
      - config.yaml=./config.yaml
  # Standing instructions, mounted over the one in the home volume.
  - name: hermes-soul
    options:
      disableNameSuffixHash: true
    files:
      - SOUL.md=./SOUL.md
  - name: hermes-acp-shim
    options:
      disableNameSuffixHash: true
    files:
      - shim.py=./acp-shim.py
  - name: hermes-routines
    options:
      disableNameSuffixHash: true
    files:
      - daily-briefing.md=./routines/daily-briefing/SKILL.md
      - midday-nudge.md=./routines/midday-nudge/SKILL.md
      - evening-checkin.md=./routines/evening-checkin/SKILL.md
      - task-reminders.md=./routines/task-reminders/SKILL.md
      - task-followup.md=./routines/task-followup/SKILL.md
      - system-docs.md=./routines/system-docs/SKILL.md
      - sync.sh=./routines/sync.sh
