---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Hermes, one pod per tier. The releases mount the tier configs and the ACP shim by
# literal name (configMapGenerator must keep stable names for references inside
# HelmRelease values, which kustomize cannot rewrite); changes roll via Reloader.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - ./plugin-sync
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./rbac.yaml
  - ./litellm-keys.yaml
configMapGenerator:
  - name: hermes-config-general
    options:
      disableNameSuffixHash: true
    files:
      - config.yaml=./config-general.yaml
  - name: hermes-config-private
    options:
      disableNameSuffixHash: true
    files:
      - config.yaml=./config-private.yaml
  - name: hermes-acp-shim
    options:
      disableNameSuffixHash: true
    files:
      - shim.py=./acp-shim.py
