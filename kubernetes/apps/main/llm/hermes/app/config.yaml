# Private tier: approved models only (its LiteLLM key), pinned per session; no outbound tools.
# Mounted read-only at /etc/hermes (Hermes managed scope), so it wins over anything the agent
# writes to $HERMES_HOME. The doubled dollar is Flux's escape; Hermes expands the reference from
# the pod env (the tier's LiteLLM virtual key).
model:
  default: mistral/mistral-small-latest
  provider: litellm
providers:
  litellm:
    base_url: http://litellm.llm.svc.cluster.local:4000/v1
    api_key: $${LITELLM_API_KEY}
auxiliary:
  compression:
    provider: litellm
    model: mistral/mistral-small-latest
  session_search:
    provider: litellm
    model: mistral/mistral-small-latest
  approval:
    provider: litellm
    model: mistral/mistral-small-latest
memory:
  provider: memini
  memory_enabled: false
  user_profile_enabled: false
approvals:
  mode: manual
security:
  redact_secrets: true
agent:
  disabled_toolsets:
    - cronjob # routines come from versioned definitions, not the agent
    - catalog
    - connections
    - kanban
    # Vault and budget data plus clipped web text: no outbound path (web, search) and no
    # shell, code, file, browser or delegation tools.
    - web
    - search
    - x_search
    - terminal
    - code_execution
    - file
    - browser
    - delegation
    - computer_use
    - skills
mcp_servers:
  # The assistant's own gateway (llm/toolhive/config/assistant-gateway.yaml): the
  # private catalogue with real tool names, which Hermes searches itself. This
  # pod's egress (networkpolicy.yaml) pins it there.
  tools:
    url: http://vmcp-mcp-assistant.llm.svc.cluster.local:4483/mcp
    # Reads are free, writes ask: any call to a tool not annotated read-only waits
    # for approval. A yes "for good" lands in command_allowlist as mcp:tools/<tool>.
    trust: untrusted
  # General memory, to read only: the key is read-only on the server, and only the
  # lookup tools are registered. A question asked here is logged by the general
  # store, so it should not carry private detail.
  general_memory:
    url: http://memini-general.llm.svc.cluster.local:8080/mcp
    headers:
      Authorization: Bearer $${MEMINI_GENERAL_API_KEY}
    tools:
      include: [memory_recall, memory_briefing, memory_get, memory_list, memory_history]
      resources: false
      prompts: false
