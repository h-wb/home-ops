# Private tier: approved models only (its LiteLLM key), pinned per session; no outbound tools.
# Mounted read-only at /etc/hermes (Hermes managed scope), so it wins over anything the agent
# writes to $HERMES_HOME. The doubled dollar is Flux's escape; Hermes expands the reference from
# the pod env (the tier's LiteLLM virtual key).
model:
  # Small could not work the tools from a plain request (it reported them missing);
  # Medium and Large 4 can. Small stays for the background jobs below.
  default: mistral/mistral-medium-latest
  provider: litellm
providers:
  litellm:
    base_url: http://litellm.llm.svc.cluster.local:4000/v1
    api_key: $${LITELLM_API_KEY}
# "openai" is the wire protocol only; the model and URL are Mistral behind LiteLLM. Empty language = auto-detect.
stt:
  enabled: true
  provider: openai
  language: ""
  echo_transcripts: true
  openai:
    model: mistral/voxtral-mini-latest
    base_url: http://litellm.llm.svc.cluster.local:4000/v1
    api_key: $${LITELLM_API_KEY}
    language: ""
auxiliary:
  compression:
    provider: litellm
    model: mistral/mistral-small-latest
  session_search:
    provider: litellm
    model: mistral/mistral-small-latest
  approval:
    provider: litellm
    model: mistral/mistral-small-latest
  # Images are analyzed to text by Large 4, so the chat model never gets raw image bytes.
  vision:
    provider: litellm
    model: mistral/mistral-large-4
    base_url: http://litellm.llm.svc.cluster.local:4000/v1
    api_key: $${LITELLM_API_KEY}
voice:
  auto_tts: false
memory:
  provider: memini
  memory_enabled: false
  user_profile_enabled: false
# The assistant's clock is yours, not the pod's.
timezone: America/Toronto
cron:
  # A routine's message joins the chat, so a reply to it ("1 done, 2 tomorrow")
  # is read with the message in view.
  mirror_delivery: true
  # No header and no "the agent cannot see this message" footer, which the line
  # above makes untrue.
  wrap_response: false
approvals:
  mode: manual
  # A scheduled run has nobody to ask, so a call that needs a yes is refused.
  cron_mode: deny
# "Always" answers from chat, per server/tool: mcp:<server>/<tool>. The tools
# gateway is untrusted (below), so these TickTick task writes run without asking;
# habits, calendars, projects and every other server still ask.
command_allowlist:
  - "mcp:tools/ticktick_create_task"
  - "mcp:tools/ticktick_batch_add_tasks"
  - "mcp:tools/ticktick_update_task"
  - "mcp:tools/ticktick_batch_update_tasks"
  - "mcp:tools/ticktick_complete_task"
  - "mcp:tools/ticktick_complete_tasks_in_project"
  - "mcp:tools/ticktick_delete_task"
  - "mcp:tools/ticktick_move_task"
  - "mcp:tools/ticktick_unassign_task"
  - "mcp:tools/ticktick_add_comment"
# Anyone not on a platform's allow list gets no answer, not even a pairing code.
unauthorized_dm_behavior: ignore
# Explicitly disable even if old credentials remain on the data volume.
platforms:
  telegram:
    enabled: false
# Adapters connect directly: Matrix applies the pod's closed HTTP(S)_PROXY without
# checking NO_PROXY. The egress policy still decides where they may go.
gateway:
  trust_env: false
# Reached through envoy-internal; forwarded headers are trusted from pod addresses only.
dashboard:
  public_url: https://hermes.${SECRET_DOMAIN}
  trusted_proxies:
    - 10.42.0.0/16
security:
  redact_secrets: true
agent:
  image_input_mode: text
  disabled_toolsets:
    - cronjob # routines come from versioned definitions, not the agent
    - catalog
    - connections
    - kanban
    # Vault and budget data plus clipped web text: no outbound path (web, search) and no
    # shell, code, file or browser tools.
    - web
    - search
    - x_search
    - terminal
    - code_execution
    - file
    - browser
    - computer_use
# Routines (./routines) and the shared dotfiles skills (skills-sync/), both
# mounted read-only. A skill the assistant writes itself waits for a yes in
# chat (/skills pending).
skills:
  external_dirs:
    - /opt/hermes-routines/skills
    - /opt/dotfiles-skills
  write_approval: true
# Sub-agents get the parent's toolsets, so no shell there either.
delegation:
  max_spawn_depth: 1
  max_concurrent_children: 3
  orchestrator_enabled: false
mcp_servers:
  # The assistant's own gateway (llm/toolhive/config/assistant-gateway.yaml): the
  # private catalogue with real tool names, which Hermes searches itself. This
  # pod's egress (networkpolicy.yaml) pins it there.
  tools:
    url: http://vmcp-mcp-assistant.llm.svc.cluster.local:4483/mcp
    # Reads are free, writes ask: any call to a tool not annotated read-only waits
    # for approval. A yes "for good" lands in command_allowlist as mcp:tools/<tool>.
    trust: untrusted
  # General memory, to read only: the key is read-only on the server, and only the
  # lookup tools are registered. A question asked here is logged by the general
  # store, so it should not carry private detail.
  general_memory:
    url: http://memini-general.llm.svc.cluster.local:8080/mcp
    headers:
      Authorization: Bearer $${MEMINI_GENERAL_API_KEY}
    tools:
      include: [memory_recall, memory_briefing, memory_get, memory_list, memory_history]
      resources: false
      prompts: false
  # The workshops (llm/paseo): where coding work goes. Each daemon appears twice,
  # because its tools carry no read-only mark and trust is set per server: the
  # `_status` entry has the lookups and runs freely, the other has the two tools
  # that start work and asks. The daemon serves many more tools (terminals, a
  # browser, schedules); only the ones listed are registered, so still no shell.
  #
  # Starting work asks every time, with no "always": each call costs more than
  # the chat's limit, and an answer to an over-limit call covers that call only.
  # The prompt is on the approval card (its first 1200 characters).
  general_workshop_status:
    url: http://paseo.llm.svc.cluster.local:6767/mcp/agents
    headers:
      Authorization: Bearer $${PASEO_GENERAL_PASSWORD}
    tools:
      include: [list_profiles, list_workspaces, list_agents, get_agent_status, get_agent_activity]
      resources: false
      prompts: false
  general_workshop:
    url: http://paseo.llm.svc.cluster.local:6767/mcp/agents
    headers:
      Authorization: Bearer $${PASEO_GENERAL_PASSWORD}
    trust: untrusted
    tool_costs:
      create_agent: &general-handoff
        credits: 2
        note: the prompt leaves the private side, read it first
      send_agent_prompt: *general-handoff
    spend_limit: 1
    tools:
      include: [create_agent, send_agent_prompt]
      resources: false
      prompts: false
  private_workshop_status:
    url: http://paseo-private.llm.svc.cluster.local:6767/mcp/agents
    headers:
      Authorization: Bearer $${PASEO_PRIVATE_PASSWORD}
    tools:
      include: [list_profiles, list_workspaces, list_agents, get_agent_status, get_agent_activity]
      resources: false
      prompts: false
  private_workshop:
    url: http://paseo-private.llm.svc.cluster.local:6767/mcp/agents
    headers:
      Authorization: Bearer $${PASEO_PRIVATE_PASSWORD}
    trust: untrusted
    tool_costs:
      create_agent: &private-handoff
        credits: 2
        note: it starts an agent with a shell on private data
      send_agent_prompt: *private-handoff
    spend_limit: 1
    tools:
      include: [create_agent, send_agent_prompt]
      resources: false
      prompts: false
