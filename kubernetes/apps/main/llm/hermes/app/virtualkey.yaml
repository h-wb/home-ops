---
# The model allowlist lives here, not in the pod: trusted models only, all served
# by Mistral's API. `mistral-large-latest` is still Large 3 there (2512), so Large 4
# is named outright.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes-private
spec:
  proxyRef: litellm
  proxyNamespace: llm
  keyAlias: Hermes private
  secretName: litellm-hermes-private
  secretKey: api-key
  models:
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
    - mistral/mistral-large-4
    - mistral/zai-glm-5-3
