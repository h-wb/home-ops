---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The assistant's messaging credentials (Bitwarden `hermes`): the Telegram bot's
# token, the user IDs it answers, and the chat its routines deliver to. A missing
# field fails the template, so the Secret keeps its last values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-messaging
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        TELEGRAM_ALLOWED_USERS: "{{ .TELEGRAM_ALLOWED_USERS }}"
        TELEGRAM_HOME_CHANNEL: "{{ .TELEGRAM_HOME_CHANNEL }}"
  dataFrom:
    - extract:
        key: hermes
---
# The two workshop daemons' passwords (Bitwarden `paseo-general`, `paseo-private`), so
# the assistant can start agents there. Both items use the same field names, hence the
# prefixes; only the two passwords reach the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &workshops hermes-workshops
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *workshops
    template:
      engineVersion: v2
      data:
        PASEO_GENERAL_PASSWORD: "{{ .GENERAL_PASEO_PASSWORD }}"
        PASEO_PRIVATE_PASSWORD: "{{ .PRIVATE_PASEO_PASSWORD }}"
  dataFrom:
    - extract:
        key: paseo-general
      rewrite:
        - regexp:
            source: "(.*)"
            target: "GENERAL_$1"
    - extract:
        key: paseo-private
      rewrite:
        - regexp:
            source: "(.*)"
            target: "PRIVATE_$1"
