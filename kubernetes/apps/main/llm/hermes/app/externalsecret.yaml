---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Messaging is Matrix-only now; the old Telegram ExternalSecret (hermes-messaging)
# is removed, but the Bitwarden fields stay in the `hermes` item, unused.
# The token turns the adapter on, so it is withheld until the sender allowlist is set.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &matrix hermes-matrix
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *matrix
    template:
      engineVersion: v2
      data:
        MATRIX_ACCESS_TOKEN: '{{ if (index . "MATRIX_ALLOWED_USERS" | default "" | trim) }}{{ index . "MATRIX_ACCESS_TOKEN" | default "" | trim }}{{ end }}'
        MATRIX_ALLOWED_USERS: '{{ index . "MATRIX_ALLOWED_USERS" | default "" | trim }}'
        MATRIX_RECOVERY_KEY: '{{ index . "MATRIX_RECOVERY_KEY" | default "" | trim }}'
  dataFrom:
    - extract:
        key: hermes
---
# The dashboard starts only once it has a password (a non-loopback bind refuses to run without one).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &dashboard hermes-dashboard
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *dashboard
    template:
      engineVersion: v2
      data:
        HERMES_DASHBOARD: '{{ if (index . "DASHBOARD_PASSWORD" | default "" | trim) }}true{{ end }}'
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: '{{ index . "DASHBOARD_PASSWORD" | default "" | trim }}'
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: '{{ index . "DASHBOARD_SESSION_SECRET" | default "" | trim }}'
  dataFrom:
    - extract:
        key: hermes
---
# The two workshop daemons' passwords (Bitwarden `paseo-general`, `paseo-private`), so
# the assistant can start agents there. Both items use the same field names, hence the
# prefixes; only the two passwords reach the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &workshops hermes-workshops
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *workshops
    template:
      engineVersion: v2
      data:
        PASEO_GENERAL_PASSWORD: "{{ .GENERAL_PASEO_PASSWORD }}"
        PASEO_PRIVATE_PASSWORD: "{{ .PRIVATE_PASEO_PASSWORD }}"
  dataFrom:
    - extract:
        key: paseo-general
      rewrite:
        - regexp:
            source: "(.*)"
            target: "GENERAL_$1"
    - extract:
        key: paseo-private
      rewrite:
        - regexp:
            source: "(.*)"
            target: "PRIVATE_$1"
