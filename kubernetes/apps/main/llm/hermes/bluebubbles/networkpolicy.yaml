---
# DNS inspection is provided by the Telegram policy in app/.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-private-bluebubbles
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-private
      assistant.scope: private
  egress:
    - toFQDNs:
        - matchName: ${BLUEBUBBLES_HOST:=bluebubbles.invalid}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
