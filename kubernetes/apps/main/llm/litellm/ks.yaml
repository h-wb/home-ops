---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
  namespace: &namespace llm
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/dragonfly
    - ../../../../../components/cnpg/initdb
  dependsOn:
    - name: plugin-barman-cloud
      namespace: database
    - name: litellm-operator
      namespace: llm
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 30m
  path: ./kubernetes/apps/main/llm/litellm/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # LM Studio on the MacBook, over its WireGuard tunnel (static peer address in
      # wg0.home.conf). Every model CR that targets the Mac uses this.
      LMSTUDIO_URL: http://192.168.27.65:1234/v1
      CNPG_REPLICAS: "2"
      CNPG_SIZE: 2Gi
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
