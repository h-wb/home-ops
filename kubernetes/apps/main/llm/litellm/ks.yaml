---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: llm
spec:
  targetNamespace: llm
  commonMetadata:
    labels:
      app.kubernetes.io/name: litellm
  components:
    - ../../../../../components/dragonfly
    - ../../../../../components/cnpg/initdb
    - ../../../../../components/agent-data-policy
  dependsOn:
    - name: plugin-barman-cloud
      namespace: database
    - name: litellm-operator
      namespace: llm
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 30m
  path: ./kubernetes/apps/main/llm/litellm/app
  postBuild:
    substitute:
      APP: litellm
      NAMESPACE: llm
      LMSTUDIO_URL: http://192.168.27.65:1234/v1
      CNPG_REPLICAS: "2"
      CNPG_SIZE: 2Gi
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
