---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: file
  # v1.109.0 adds the ChatGPT/Codex subscription deployments in models/subscriptions.yaml
  # (forwarding a Codex client's own login, chatgpt/codex-* routing). Only rc/dev builds
  # carry that version so far; renovate moves this pin to the stable tag once it ships.
  image: ghcr.io/berriai/litellm-database:v1.109.0-rc.1@sha256:28648c6e6f9fb46da44fa194fc1c8dde96758832f1c6f789c5b8be17016bec40
  replicas: 2
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
      - litellm.${SECRET_DOMAIN}
    parentRefs:
      - name: envoy-internal
        namespace: network
  env:
    - name: TZ
      value: Europe/Paris
    - name: CHATGPT_TOKEN_DIR
      value: /app/chatgpt_tokens
    # Lets the proxy import the callback modules under patches/.
    - name: PYTHONPATH
      value: /app/patches
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: PROXY_BASE_URL
      value: https://litellm.${SECRET_DOMAIN}
    - name: REDIS_HOST
      value: litellm-dragonfly
    - name: REDIS_PORT
      value: "6379"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: postgres-litellm-app
          key: uri
  envFrom:
    - secretRef:
        name: litellm-secret
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 2Gi
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
    - name: cache
      emptyDir: {}
    - name: chatgpt-tokens
      persistentVolumeClaim:
        claimName: litellm-chatgpt
    - name: patches
      configMap:
        name: litellm-patches
  volumeMounts:
    - name: cache
      mountPath: /app/cache
    - name: chatgpt-tokens
      mountPath: /app/chatgpt_tokens
    - name: patches
      mountPath: /app/patches
      readOnly: true
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
  litellmSettings:
    callbacks:
      # Makes chatgpt/* answer non-streaming requests (BerriAI/litellm#37039), which
      # karakeep sends. Remove once the upstream fix ships.
      - homeops_chatgpt_nonstream.patch_instance
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    prometheus_adapter: true
    # /metrics is only reachable in-cluster; requiring a key would just mean
    # handing the ServiceMonitor one.
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
    # OCR of a dense page runs ~7s; a sleeping MacBook should fail rather than hang.
    request_timeout: 300
    num_retries: 2
    retry_after: 5
    drop_params: true
  generalSettings:
    health_check_endpoint: /v1/health
    # Models are declared as LiteLLMModel CRs, so the DB must not be authoritative.
    store_model_in_db: false
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
