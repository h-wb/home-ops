---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm
spec:
  groups:
    - name: litellm.rules
      rules:
        # The only backend is LM Studio on the MacBook, reachable solely while its
        # WireGuard tunnel is up and the machine is awake. This is the alert that
        # actually fires in normal life.
        - alert: LiteLLMDeploymentOutage
          expr: |-
            max by (litellm_model_name) (litellm_deployment_state) >= 2
            and on (litellm_model_name)
            sum by (litellm_model_name) (rate(litellm_deployment_failure_responses_total[15m])) > 0
          for: 10m
          annotations:
            summary: >-
              LiteLLM {{ $labels.litellm_model_name }} is out of rotation and still failing
              (MacBook asleep or WireGuard tunnel down?)
          labels:
            severity: warning
        - alert: LiteLLMHighErrorRate
          expr: |-
            sum by (requested_model) (rate(litellm_proxy_failed_requests_metric_total[10m]))
            /
            clamp_min(sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total[10m])), 0.001)
            > 0.25
          for: 10m
          annotations:
            summary: LiteLLM {{ $labels.requested_model }} failing more than 25% of requests
          labels:
            severity: warning
        # Metered spend only: Claude's figure is an API-price equivalent of the
        # subscription and chatgpt/* carries no price, so Mistral is what is left.
        - alert: LiteLLMMeteredSpendHigh
          expr: |-
            sum by (api_key_alias) (
              increase(litellm_spend_metric_total{model!~"claude-.*"}[24h])
            ) > 10
          for: 15m
          annotations:
            summary: >-
              LiteLLM key {{ $labels.api_key_alias }} spent {{ $value | printf "%.2f" }} USD
              on metered models in 24h
          labels:
            severity: warning
        # Live since the luna-max alias gained a router fallback (litellmproxy.yaml).
        # The labels carry the primary's error, not the fallback's. Look at
        # litellm_deployment_failure_responses_total for why the fallback failed.
        # Failures arrive in bursts with quiet hours between them, so
        # keep_firing_for holds one alert open instead of re-notifying per burst.
        - alert: LiteLLMFallbackChainExhausted
          expr: |-
            sum by (requested_model, exception_status, exception_class) (
              increase(litellm_deployment_failed_fallbacks_total[1h])
            ) > 5
          for: 15m
          keep_firing_for: 3h
          annotations:
            summary: >-
              LiteLLM {{ $labels.requested_model }} fallback chain exhausted
              ({{ $labels.exception_status }} {{ $labels.exception_class }})
          labels:
            severity: warning
