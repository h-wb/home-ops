---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: embed
spec:
  modelName: embed
  proxyRef: litellm
  params:
    # llama.cpp on CPU in-cluster (llm/embed), so embeddings keep working while
    # the MacBook sleeps. Same model and quant LM Studio used to serve here.
    model: openai/nomic-embed-text-v1.5
    apiBase: http://embed.llm.svc.cluster.local:8080/v1
    apiKey: none
  info:
    mode: embedding
    extra:
      # nomic-embed-text-v1.5 returns 768-dimension vectors. Not a typed field on
      # the CR, so it goes through `extra` into litellm's model_info verbatim.
      output_vector_size: 768
