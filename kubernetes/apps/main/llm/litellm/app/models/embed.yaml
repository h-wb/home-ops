---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: embed
spec:
  modelName: embed
  proxyRef: litellm
  params:
    # Same LM Studio instance as `local`; see models/local.yaml for the address.
    # LM Studio keeps an embedding model resident alongside the chat model, so this
    # does not contend for the single chat slot.
    model: openai/text-embedding-nomic-embed-text-v1.5
    apiBase: ${LMSTUDIO_URL}
    apiKey: lm-studio
  info:
    mode: embedding
    extra:
      # nomic-embed-text-v1.5 returns 768-dimension vectors. Not a typed field on
      # the CR, so it goes through `extra` into litellm's model_info verbatim.
      output_vector_size: 768
