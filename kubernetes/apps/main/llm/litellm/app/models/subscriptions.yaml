---
# Claude Code supplies and refreshes its own subscription OAuth token; LiteLLM
# forwards it. No Anthropic API key or subscription credential is on the gateway.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-subscription
spec:
  proxyRef: litellm
  modelName: anthropic/*
  params:
    model: anthropic/*
---
# ChatGPT subscription, Codex side. A Codex client signs in with ChatGPT itself and
# LiteLLM forwards that login for the request (it wins over the shared gateway login
# on the litellm-chatgpt PVC, which serves requests that carry no client login, such
# as OpenCode's). `gpt-*` routes the plain GPT models, `codex-*` Codex's own slugs
# like codex-auto-review. Wildcards instead of per-model entries: the plan decides
# which models answer. These deployments need LiteLLM >= v1.109.0 (proxy PR pinned
# to an rc of it), and a virtual key has to list the pattern; private's never does.
# Same backend as the chatgpt/ aliases in models/chatgpt.yaml, so quota is shared.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chatgpt-subscription
spec:
  proxyRef: litellm
  modelName: gpt-*
  params:
    model: chatgpt/gpt-*
    additional:
      additional_drop_params:
        - temperature
  info:
    mode: responses
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: codex-subscription
spec:
  proxyRef: litellm
  modelName: codex-*
  params:
    model: chatgpt/codex-*
    additional:
      additional_drop_params:
        - temperature
  info:
    mode: responses
