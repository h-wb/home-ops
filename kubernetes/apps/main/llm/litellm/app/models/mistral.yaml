---
# Direct Mistral inference is trusted for personal tools; no restricted fallback.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: mistral-small
spec:
  modelName: mistral/mistral-small-latest
  proxyRef: litellm
  params:
    model: mistral/mistral-small-latest
    apiBase: https://api.mistral.ai/v1
    # From the Secret, not os.environ: LiteLLM kept the env key it resolved at registration,
    # so a rotated key never reached it.
    apiKeyRef:
      name: litellm-secret
      key: MISTRAL_API_KEY
  info:
    mode: chat
    supportsVision: true
    supportsFunctionCalling: true
