---
# ChatGPT Plus through LiteLLM's `chatgpt/` provider: the Codex OAuth login, not the
# metered API, so usage counts against the subscription's rolling + weekly quota.
# Tokens live on the shared `litellm-chatgpt` PVC so both replicas use one login.
#
# Cloud models, deliberately fenced:
# - only under these explicit aliases, never as a rung of a local pool;
# - a virtual key must list them to use them;
# - no tool calling: patches/homeops_cloud_tool_guard.py refuses it, so tool
#   results (health, location, n8n, the cluster) cannot reach them.
#
# Streaming only: non-streaming requests fail upstream ("Unknown items in responses
# API response", BerriAI/litellm#37039). Open WebUI streams; anything else would not
# work until that is fixed.
#
# With an empty token dir the proxy runs a device-code login at startup and the pod
# is not Ready until it completes: `kubectl -n llm logs -f deploy/litellm`, then
# auth.openai.com/codex/device.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chatgpt-gpt-6-astra
spec:
  modelName: chatgpt/gpt-6-astra
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-astra
    additional:
      additional_drop_params:
        - temperature
  info:
    mode: responses
    # The real window is ~1M, but past 272k the whole request is billed at a
    # multiplier against the quota, so declare the cheap ceiling.
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsFunctionCalling: true
    supportsPromptCaching: true
---
# The light tier: it draws far less of the subscription quota per request, so it is
# the one background consumers fall back to.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chatgpt-gpt-6-luna
spec:
  modelName: chatgpt/gpt-6-luna
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-luna
    additional:
      additional_drop_params:
        - temperature
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsFunctionCalling: true
    supportsPromptCaching: true
