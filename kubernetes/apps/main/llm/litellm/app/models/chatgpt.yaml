---
# ChatGPT Plus through LiteLLM's `chatgpt/` provider: the Codex OAuth login, not the
# metered API, so usage counts against the subscription's rolling + weekly quota.
# Tokens live on the shared `litellm-chatgpt` PVC so both replicas use one login.
#
# Cloud models, deliberately fenced:
# - only under these explicit aliases, never as a rung of a local pool;
# - a virtual key must list them to use them;
# - only the mcp-ops tools: patches/homeops_cloud_tool_guard.py refuses the rest,
#   so tool results (health, location, memory) cannot reach them.
#
# Non-streaming requests fail upstream ("Unknown items in responses API response",
# BerriAI/litellm#37039); patches/homeops_chatgpt_nonstream.py works around it for
# karakeep. Open WebUI streams and does not need it.
#
# With an empty token dir the proxy runs a device-code login at startup and the pod
# is not Ready until it completes: `kubectl -n llm logs -f deploy/litellm`, then
# auth.openai.com/codex/device.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chatgpt-gpt-6-astra
spec:
  modelName: chatgpt/gpt-6-astra
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-astra
    additional:
      additional_drop_params:
        - temperature
  info:
    mode: responses
    # The real window is ~1M, but past 272k the whole request is billed at a
    # multiplier against the quota, so declare the cheap ceiling.
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsFunctionCalling: true
    supportsPromptCaching: true
---
# The light tier: it draws far less of the subscription quota per request, so it is
# the one background consumers fall back to.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chatgpt-gpt-6-luna
spec:
  modelName: chatgpt/gpt-6-luna
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-luna
    additional:
      additional_drop_params:
        - temperature
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsFunctionCalling: true
    supportsPromptCaching: true
---
# Luna with reasoning effort pinned to max, for kritika's reviews: the light tier is
# noticeably stronger at max effort than at its default, at the cost of slower answers
# and more output tokens. A separate alias so karakeep's tagging stays on plain Luna.
# `extra_body` is merged onto the request after the provider's parameter filtering,
# which would strip a bare `reasoning_effort`. It is a default: a caller that sends
# its own effort wins.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chatgpt-gpt-6-luna-max
spec:
  modelName: chatgpt/gpt-6-luna-max
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-luna
    additional:
      additional_drop_params:
        - temperature
      extra_body:
        reasoning:
          effort: max
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsFunctionCalling: true
    supportsPromptCaching: true
