---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local
spec:
  modelName: local
  proxyRef: litellm
  params:
    # LM Studio on the MacBook. It sits on a different LAN (192.168.18.0/24) than
    # the cluster and is reachable only while its WireGuard tunnel is up, where it
    # holds this static address — `Address` in wg0.home.conf, pinned to the peer's
    # public key rather than a DHCP lease, so it does not drift.
    model: openai/qwen/qwen3-vl-8b
    apiBase: http://192.168.27.65:1234/v1
    apiKey: lm-studio
    additional:
      # Matches the slot count LM Studio loads the model with. paperless-gpt renders
      # and submits every page of a document concurrently, so a lower cap does not
      # serialise the work — it queues requests until the client gives up and the
      # connection aborts (LM Studio logs `TypeError: terminated` from its fetch).
      #
      # This was 1 because raising it failed back when pages were rasterised at 600
      # DPI (~2.6MB each); 333f23d1d dropped that to 300 DPI, so a page is now
      # 300-600KB and four in flight is comfortable.
      max_parallel_requests: 4
  info:
    mode: chat
    # Must match the context LM Studio loads with (defaultContextLength in
    # ~/.lmstudio/settings.json). At 8k a dense page truncates mid-transcription.
    maxInputTokens: 32768
    maxOutputTokens: 8192
    supportsVision: true
    supportsFunctionCalling: true
