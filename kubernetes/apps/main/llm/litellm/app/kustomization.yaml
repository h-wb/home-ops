---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./litellmproxy.yaml
  - ./models
  - ./pvc.yaml
  - ./virtualkeys
  - ./dashboard
  - ./grafanadashboard.yaml
  - ./prometheusrule.yaml
  - ./servicemonitor.yaml
# Proxy callback modules, mounted as-is; the fixed name keeps the LiteLLMProxy's
# volume reference valid (kustomize does not rewrite names inside a custom resource).
configMapGenerator:
  - name: litellm-patches
    files:
      - ./patches/homeops_cloud_tool_guard.py
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
