---
# kritika's reviews and repository index. Pinned to local-pool (local models only)
# and embed; the value is copied into the Bitwarden
# `kritika` item, since kritika runs in its own namespace.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: kritika
spec:
  proxyRef: litellm
  keyAlias: Kritika
  secretName: litellm-key-kritika
  secretKey: api-key
  models:
    - local-pool
    - embed
