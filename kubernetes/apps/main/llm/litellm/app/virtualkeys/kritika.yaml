---
# kritika's reviews.
# - `chatgpt/gpt-6-luna-max`: the review model (Luna at max reasoning effort), on
#   the Plus subscription. Reviews are
#   tool calls, hence `allow_tool_policy_override`: this is the one key the cloud tool guard
#   lets through (patches/homeops_data_scope_guard.py). The tools kritika's agent
#   runs read the repository under review, not ToolHive. Only public repositories
#   should have the bot-dupont App installed, since everything it reviews goes here.
# - `embed`: the in-cluster embedder for the similar-code index (stays local).
# The value is copied into the Bitwarden `kritika` item, since kritika runs in its
# own namespace.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: kritika
spec:
  proxyRef: litellm
  keyAlias: Kritika
  secretName: litellm-key-kritika
  secretKey: api-key
  metadata:
    allow_tool_policy_override: "true"
  models:
    - chatgpt/gpt-6-luna-max
    - embed
