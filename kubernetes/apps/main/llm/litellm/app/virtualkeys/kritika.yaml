---
# kritika's reviews.
# - `chatgpt/gpt-6-luna-max`: the review model (Luna at max reasoning effort), on
#   the Plus subscription. The tools kritika's agent runs read the repository
#   under review, not ToolHive. Only public repositories
#   should have the bot-dupont App installed, since everything it reviews goes here.
# - `embed`: the in-cluster embedder for the similar-code index (stays local).
# - `mistral/mistral-large-4`: only reached as the router's fallback for luna-max
#   when Luna's quota is out (routerSettings.fallbacks in litellmproxy.yaml);
#   listed so the fallback passes this key's model access check.
# The value is copied into the Bitwarden `kritika` item, since kritika runs in its
# own namespace.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: kritika
spec:
  proxyRef: litellm
  keyAlias: Kritika
  secretName: litellm-key-kritika
  secretKey: api-key
  models:
    - chatgpt/gpt-6-luna-max
    - mistral/mistral-large-4
    - embed
