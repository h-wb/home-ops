---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: paseo-general
spec:
  proxyRef: litellm
  keyAlias: Paseo General
  secretName: litellm-paseo-general
  secretKey: api-key
  # Cloud models are granted to general only; paseo-private stays on local + Mistral.
  models:
    - anthropic/*
    - chatgpt/gpt-6-astra
    - chatgpt/gpt-6-luna
    - qwen3.5-9b
    - qwen3.5-9b-chat
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
    - mistral/mistral-large-latest
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-paseo-general
spec:
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-paseo-general
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm-paseo-general
