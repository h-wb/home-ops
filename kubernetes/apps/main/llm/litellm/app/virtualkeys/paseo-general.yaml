---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: paseo-general
spec:
  proxyRef: litellm
  keyAlias: Paseo General
  # The pods consume this key as the LITELLM_API_KEY field of their paseo
  # credential item (paste the value there once; update it if the key ever
  # rotates, since no PushSecret carries it anymore).
  secretName: litellm-paseo-general
  secretKey: api-key
  # Cloud models are granted to general only; paseo-private stays on local + Mistral.
  # chatgpt/* are the fenced aliases OpenCode and friends call; gpt-*/codex-* are the
  # subscription wildcards for a Codex agent keeping its own sign-in (and its
  # approval-check slugs like codex-auto-review).
  models:
    - anthropic/*
    - chatgpt/gpt-6-astra
    - chatgpt/gpt-6-luna
    - chatgpt/gpt-6.1-sol
    - chatgpt/gpt-6.1-terra
    - gpt-*
    - codex-*
    - qwen3.5-9b
    - qwen3.5-9b-chat
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
    - mistral/mistral-large-latest
