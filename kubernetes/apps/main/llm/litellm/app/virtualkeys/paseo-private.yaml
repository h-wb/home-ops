---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: paseo-private
spec:
  proxyRef: litellm
  keyAlias: Paseo Private
  # The value stays in-cluster: the paseo pods read it from this secret through
  # the Kubernetes SecretStore in agents/paseo/common/llm-secretstore.yaml (the
  # Bitwarden push is gone).
  secretName: litellm-paseo-private
  secretKey: api-key
  models:
    - qwen3.5-9b
    - qwen3.5-9b-chat
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
    - mistral/mistral-large-latest
