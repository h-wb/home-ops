---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: paseo-private
spec:
  proxyRef: litellm
  keyAlias: Paseo Private
  # The pods consume this key as the LITELLM_API_KEY field of their paseo
  # credential item (paste the value there once; update it if the key ever
  # rotates, since no PushSecret carries it anymore).
  secretName: litellm-paseo-private
  secretKey: api-key
  models:
    - qwen3.5-9b
    - qwen3.5-9b-chat
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
    - mistral/mistral-large-latest
