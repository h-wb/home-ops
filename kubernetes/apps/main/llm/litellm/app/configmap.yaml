---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      # LM Studio on the MacBook, reached over WireGuard via the lmstudio Service.
      # max_parallel_requests is 1 because LM Studio serves a single loaded model and
      # concurrent requests thrash it.
      #
      # The model must stay a NON-thinking one: paperless-gpt cannot send
      # reasoning_effort, and with a thinking model ~93% of the output budget goes to
      # reasoning, which exhausts the context and truncates transcriptions.
      - model_name: local
        litellm_params:
          model: openai/qwen/qwen3-vl-8b
          api_base: http://lmstudio.llm.svc.cluster.local:1234/v1
          api_key: lm-studio
          max_parallel_requests: 1
          order: 1
        model_info:
          mode: chat
          supports_vision: true
          max_input_tokens: 32768
          max_output_tokens: 8192

    litellm_settings:
      # Cache across replicas in dragonfly rather than per-pod memory.
      cache: true
      cache_params:
        type: redis
        ttl: 600
      drop_params: true
      # The MacBook sleeps and the tunnel drops; fail fast rather than hanging a
      # caller for minutes. OCR of one page runs ~7s, so 300s is generous.
      request_timeout: 300
      num_retries: 2

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      # Encrypts credentials stored in postgres. Changing it orphans stored keys.
      salt_key: os.environ/LITELLM_SALT_KEY

    router_settings:
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      routing_strategy: simple-shuffle
