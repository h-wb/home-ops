---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# memini-general's credentials, held in the Bitwarden `memini` item like jory's
# memini: one item, human-pasted once (the fields below were seeded from the
# generator-era values, so the workstation plugins, the paseo-general item and
# anything else holding a key keeps working). Rotating a key means updating its
# field — nothing is generated in-cluster anymore.
# - MEMINI_API_KEY: the break-glass admin key; also what the web UI signs in with.
# - workstation / paseo: the named, client-keyed entries api-keys.yaml registers.
# Fields are <SCOPE>_<HOLDER>: one key per holder (what you would revoke if it
# leaked), not per agent; every agent on that holder shares it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-code-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        MEMINI_API_KEY: "{{ .GENERAL_ADMIN }}"
        workstation: "{{ .GENERAL_WORKSTATION }}"
        paseo: "{{ .GENERAL_PASEO }}"
        api-keys.yaml: |
          keys:
            # Every workstation's agents (dotfiles conf.d/ai, Proton Pass memini/general).
            - name: workstation
              secret: "{{ .GENERAL_WORKSTATION }}"
              home: hugo
            # The general Paseo pod (agents/paseo-general).
            - name: paseo
              secret: "{{ .GENERAL_PASEO }}"
              home: hugo
  dataFrom:
    - extract:
        key: memini
