---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# memini-general's credentials, held in the Bitwarden `memini` item like jory's
# memini: one item, human-pasted once (the fields below were seeded from the
# generator-era values, so the workstation plugins, the paseo-general item and
# anything else holding a key keeps working). Rotating a key means updating its
# field — nothing is generated in-cluster anymore.
# - MEMINI_API_KEY: the break-glass admin key; also what the web UI signs in with.
# - claude-code / opencode / hermes: the named, client-keyed entries api-keys.yaml registers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-code-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        MEMINI_API_KEY: "{{ .GENERAL_ADMIN }}"
        claude-code: "{{ .GENERAL_CLAUDE_CODE }}"
        opencode: "{{ .GENERAL_OPENCODE }}"
        hermes: "{{ .GENERAL_HERMES }}"
        api-keys.yaml: |
          keys:
            - name: claude-code
              secret: "{{ .GENERAL_CLAUDE_CODE }}"
              home: hugo
            - name: opencode
              secret: "{{ .GENERAL_OPENCODE }}"
              home: hugo
            # The general Hermes pod (llm/hermes), memories under the same home.
            - name: hermes
              secret: "{{ .GENERAL_HERMES }}"
              home: hugo
  dataFrom:
    - extract:
        key: memini
