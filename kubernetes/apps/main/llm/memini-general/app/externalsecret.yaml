---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Generated once in-cluster. Read a client's key with:
#   kubectl -n llm get secret memini-code-secret -o jsonpath='{.data.claude-code}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-code-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        MEMINI_API_KEY: "{{ .admin }}"
        claude-code: "{{ .claudecode }}"
        codex: "{{ .codex }}"
        hermes: "{{ .hermes }}"
        api-keys.yaml: |
          keys:
            - name: claude-code
              secret: "{{ .claudecode }}"
              home: hugo
            - name: codex
              secret: "{{ .codex }}"
              home: hugo
            # The general Hermes pod (llm/hermes), memories under the same home.
            - name: hermes
              secret: "{{ .hermes }}"
              home: hugo
  dataFrom:
    # Separate generators: adding a key here must never rotate the CreatedOnce
    # client keys above (the workstation plugins hold their values).
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: memini-code-keys
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: memini-general-hermes-key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: memini-general-hermes-key
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - hermes
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: memini-code-keys
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - admin
    - claudecode
    - codex
