---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# memini's credentials, generated once in-cluster (nothing to copy into Bitwarden):
# - MEMINI_API_KEY: the break-glass admin key; also what the web UI signs in with.
#   Read it with:
#   kubectl -n llm get secret memini-secret -o jsonpath='{.data.MEMINI_API_KEY}' | base64 -d
# - api-keys.yaml: the named key the ToolHive gateway uses, bound to one namespace.
# - toolhive-authorization: that same key as the header the gateway's entry sends.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        MEMINI_API_KEY: "{{ .admin }}"
        toolhive-authorization: "Bearer {{ .toolhive }}"
        api-keys.yaml: |
          keys:
            - name: toolhive
              secret: "{{ .toolhive }}"
              default_namespace: hugo
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: memini-keys
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: memini-keys
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  # One independent password per key.
  secretKeys:
    - admin
    - toolhive
