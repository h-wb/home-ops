---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    fullnameOverride: memini
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              TZ: Europe/Paris
              MEMINI_BACKEND: sqlite
              # Callers that send no namespace header land here. The ToolHive key
              # is bound to `hugo` in api-keys.yaml.
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              # Embeddings on the in-cluster model through LiteLLM. Memories are
              # personal data, so nothing here may point at a cloud model: no
              # MEMINI_LLM_* (the optional distill/dedup LLM stays off) and no
              # reranker.
              MEMINI_EMBED_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              MEMINI_EMBED_MODEL: embed
              # nomic-embed-text-v1.5. Must match the model: a wrong value corrupts
              # the store rather than failing, and cannot be changed in place.
              MEMINI_EMBED_DIMS: "768"
              # The model's window is 2048 tokens; keep one text well inside it.
              MEMINI_EMBED_MAX_ITEM_CHARS: "5000"
              # The CPU embedder takes ~12 s for 8 full-size texts.
              MEMINI_EMBED_MAX_BATCH: "8"
              MEMINI_EMBED_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-memini
                    key: api-key
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    persistence:
      data:
        existingClaim: memini
      api-keys:
        enabled: true
        name: memini-secret
    route:
      # The admin UI (it serves /v1 for itself), internal only. Sign in with
      # MEMINI_API_KEY. The API/MCP port gets no route: clients reach it through
      # the ToolHive gateway.
      ui:
        enabled: true
        hostnames:
          - memini.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    serviceMonitor:
      main:
        enabled: true
