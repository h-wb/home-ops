---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: memini
spec:
  groups:
    - name: memini.rules
      rules:
        - alert: MeminiAbsent
          expr: |-
            absent(up{job="memini"} == 1)
          for: 15m
          annotations:
            summary: >-
              Memini is down or not scraped; agents cannot remember or recall
          labels:
            severity: warning
        # The only backend is the in-cluster CPU embedder through LiteLLM.
        - alert: MeminiEmbedErrors
          expr: |-
            sum by (backend) (increase(memini_embed_errors_total[30m])) > 0
          for: 10m
          annotations:
            summary: >-
              Memini embed backend {{ $labels.backend }} returning errors
          labels:
            severity: warning
        # A write that could not be embedded is stored without a vector and
        # retried; a number that never drains means recall is missing memories.
        - alert: MeminiEmbedBackfillStuck
          expr: |-
            min_over_time(memini_embed_backfill_pending[1h]) > 0
          for: 2h
          annotations:
            summary: >-
              Memini has {{ $value | printf "%.0f" }} memories without a vector for over 2h;
              they are stored but vector recall cannot find them
          labels:
            severity: warning
        - alert: MeminiRecallDegraded
          expr: |-
            sum(increase(memini_recall_degraded_total[30m])) > 0
          for: 10m
          annotations:
            summary: >-
              Memini recall degraded: the embedder is unavailable and results fall back
              to keyword order
          labels:
            severity: warning
