/><text x="220" y="218" text-anchor="start" class="d-text d-small">read-only key, lookups only</text><rect x="424" y="204.0" width="200" height="44" rx="5" class="box box-general"/><text x="524.0" y="223" text-anchor="middle" class="d-text d-strong">General memory</text><text x="524.0" y="239" text-anchor="middle" class="d-text d-small d-muted">Memini</text><line x1="208" y1="288" x2="714" y2="288" class="line"/><polygon points="722,288 713,283.5 713,292.5" class="head"/><text x="220" y="280" text-anchor="start" class="d-text d-small">bot token; allow-listed users only</text><rect x="722" y="266.0" width="184" height="44" rx="5" class="box box-you"/><text x="814.0" y="285" text-anchor="middle" class="d-text d-strong">Telegram</text><text x="814.0" y="301" text-anchor="middle" class="d-text d-small d-muted">messaging app</text><line x1="208" y1="350" x2="416" y2="350" class="line"/><polygon points="424,350 415,345.5 415,354.5" class="head"/><text x="220" y="342" text-anchor="start" class="d-text d-small">access token; end-to-end encrypted</text><rect x="424" y="328.0" width="200" height="44" rx="5" class="box box-private"/><text x="524.0" y="347" text-anchor="middle" class="d-text d-strong">Matrix homeserver</text><text x="524.0" y="363" text-anchor="middle" class="d-text d-small d-muted">Continuwuity, federates with Beeper</text><line x1="208" y1="412" x2="416" y2="412" class="line"/><polygon points="424,412 415,407.5 415,416.5" class="head"/><text x="220" y="404" text-anchor="start" class="d-text d-small">daemon password; every start asks</text><rect x="424" y="390.0" width="200" height="44" rx="5" class="box box-general"/><text x="524.0" y="409" text-anchor="middle" class="d-text d-strong">General workshop</text><text x="524.0" y="425" text-anchor="middle" class="d-text d-small d-muted">Paseo</text><line x1="208" y1="474" x2="416" y2="474" class="line"/><polygon points="424,474 415,469.5 415,478.5" class="head"/><text x="220" y="466" text-anchor="start" class="d-text d-small">daemon password; every start asks</text><rect x="424" y="452.0" width="200" height="44" rx="5" class="box box-private"/><text x="524.0" y="471" text-anchor="middle" class="d-text d-strong">Private workshop</text><text x="524.0" y="487" text-anchor="middle" class="d-text d-small d-muted">Paseo</text><rect x="16" y="235.0" width="172" height="44" rx="5" class="box box-private"/><text x="102.0" y="254.0" text-anchor="middle" class="d-text d-strong">Assistant</text><text x="102.0" y="270.0" text-anchor="middle" class="d-text d-small d-muted">Hermes</text></svg>
