ge"/><text x="220" y="321.6" text-anchor="middle" class="badge-t">5</text><rect x="295.0" y="342" width="150" height="44" rx="4" class="note note-private planned"/><text x="376" y="360" text-anchor="middle" class="d-text d-small">the job runs on</text><text x="376" y="375" text-anchor="middle" class="d-text d-small">your real data</text><circle cx="295.0" cy="364.0" r="10" class="badge"/><text x="295.0" y="367.6" text-anchor="middle" class="badge-t">6</text><line x1="360" y1="424" x2="228" y2="424" class="line planned"/><polygon points="220,424 229,419.5 229,428.5" class="head"/><text x="291.0" y="416" text-anchor="middle" class="d-text">result</text><circle cx="370" cy="424" r="10" class="badge"/><text x="370" y="427.6" text-anchor="middle" class="badge-t">7</text><line x1="210" y1="468" x2="78" y2="468" class="line planned"/><polygon points="70,468 79,463.5 79,472.5" class="head"/><text x="141.0" y="460" text-anchor="middle" class="d-text">done, summary</text><circle cx="220" cy="468" r="10" class="badge"/><text x="220" y="471.6" text-anchor="middle" class="badge-t">8</text></svg>
