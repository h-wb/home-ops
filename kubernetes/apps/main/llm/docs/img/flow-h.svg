del family</text><text x="710" y="371" text-anchor="middle" class="d-text d-small">reviews the diff</text><circle cx="629.0" cy="360.0" r="10" class="badge"/><text x="629.0" y="363.6" text-anchor="middle" class="badge-t">5</text><rect x="629.0" y="400" width="150" height="44" rx="4" class="note note-general planned"/><text x="710" y="418" text-anchor="middle" class="d-text d-small">the orchestrator</text><text x="710" y="433" text-anchor="middle" class="d-text d-small">decides</text><circle cx="629.0" cy="422.0" r="10" class="badge"/><text x="629.0" y="425.6" text-anchor="middle" class="badge-t">6</text><line x1="714" y1="482" x2="878" y2="482" class="line planned"/><polygon points="886,482 877,477.5 877,486.5" class="head"/><text x="799.0" y="474" text-anchor="middle" class="d-text">the change, through git</text><circle cx="704" cy="482" r="10" class="badge"/><text x="704" y="485.6" text-anchor="middle" class="badge-t">7</text><line x1="694" y1="526" x2="78" y2="526" class="line planned"/><polygon points="70,526 79,521.5 79,530.5" class="head"/><text x="383.0" y="518" text-anchor="middle" class="d-text">what changed, and the check&#x27;s result</text><circle cx="704" cy="526" r="10" class="badge"/><text x="704" y="529.6" text-anchor="middle" class="badge-t">8</text></svg>
