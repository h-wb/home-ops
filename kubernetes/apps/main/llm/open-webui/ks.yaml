apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
  namespace: llm
spec:
  targetNamespace: llm
  commonMetadata:
    labels:
      app.kubernetes.io/name: open-webui
  components:
    - ../../../../../components/cnpg/restore
    - ../../../../../components/kopiur/backup
    - ../../../../../components/oidc
  dependsOn:
    - name: plugin-barman-cloud
      namespace: database
    - name: litellm
      namespace: llm
    - name: toolhive-config
      namespace: llm
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 30m
  path: ./kubernetes/apps/main/llm/open-webui/app
  postBuild:
    substitute:
      APP: open-webui
      NAMESPACE: llm
      APP_NAMESPACE: llm
      KOPIUR_SCHEDULE: 29 * * * *
      KOPIUR_CAPACITY: 5Gi
      OIDC_DISPLAY_NAME: Open WebUI
      SUBDOMAIN: chat
      OIDC_CALLBACK: /oauth/oidc/callback
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
      OIDC_CLIENT_ID_KEY: OAUTH_CLIENT_ID
      OIDC_CLIENT_SECRET_KEY: OAUTH_CLIENT_SECRET
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
