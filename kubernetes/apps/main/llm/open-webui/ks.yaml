---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app open-webui
  namespace: &namespace llm
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/dragonfly
    - ../../../../../components/cnpg/restore
    - ../../../../../components/kopiur/backup
    - ../../../../../components/oidc
  dependsOn:
    - name: plugin-barman-cloud
      namespace: database
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 30m
  path: ./kubernetes/apps/main/llm/open-webui/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      APP_NAMESPACE: *namespace
      KOPIUR_SCHEDULE: "29 * * * *"
      KOPIUR_CAPACITY: 5Gi
      OIDC_DISPLAY_NAME: Open WebUI
      SUBDOMAIN: chat
      OIDC_CALLBACK: /oauth/oidc/callback
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
      OIDC_CLIENT_ID_KEY: OAUTH_CLIENT_ID
      OIDC_CLIENT_SECRET_KEY: OAUTH_CLIENT_SECRET
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
