---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  interval: 1h
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
            env:
              TZ: Europe/Paris
              # Settings come from here, not the database: the DB was restored from
              # a backup that still points at the old ollama setup, and with
              # persistence on its stored values win over these variables. Admin
              # panel changes therefore do not survive a restart; change them here.
              ENABLE_PERSISTENT_CONFIG: "False"
              # Models: everything through LiteLLM (local, local-pool, embed and the
              # ChatGPT aliases once enabled), on a scoped key from virtualkeys/.
              ENABLE_OLLAMA_API: "False"
              ENABLE_OPENAI_API: "True"
              OPENAI_API_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # RAG / knowledge embeddings on the same in-cluster embed model.
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: embed
              RAG_OPENAI_API_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              RAG_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # Tools: the ToolHive MCP gateway, reached in-cluster (the x-api-key
              # check lives on its Envoy route, not on the service).
              TOOL_SERVER_CONNECTIONS: >-
                [{"type": "mcp", "url": "http://vmcp-mcp-gateway.llm.svc.cluster.local:4483/mcp",
                "auth_type": "none", "config": {"enable": true},
                "info": {"id": "toolhive", "name": "ToolHive", "description": "kubectl, flux, GitHub, n8n and Metabase"}}]
              ENABLE_WEBSOCKET_SUPPORT: "true"
              WEBSOCKET_MANAGER: "redis"
              WEBSOCKET_REDIS_URL: "redis://open-webui-dragonfly.llm.svc.cluster.local:6379"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "postgres-{{ .Release.Name }}-app"
                    key: uri
              # OIDC via Kanidm. OAUTH_CLIENT_ID/SECRET arrive via envFrom kanidm-open-webui-oidc.
              WEBUI_URL: "https://chat.${SECRET_DOMAIN}"
              ENABLE_OAUTH_SIGNUP: "true"
              # Link the kanidm login onto the existing account with the same email
              # instead of erroring "email already registered".
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              OAUTH_PROVIDER_NAME: Kanidm
              OAUTH_SCOPES: "openid email profile"
              OPENID_PROVIDER_URL: "https://idm.${SECRET_DOMAIN}/oauth2/openid/open-webui/.well-known/openid-configuration"
              OPENID_REDIRECT_URI: "https://chat.${SECRET_DOMAIN}/oauth/oidc/callback"
            envFrom:
              - secretRef:
                  name: kanidm-open-webui-oidc
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: open-webui
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/icon: open-webui.png
          gethomepage.dev/description: LLM Chat
        hostnames:
          - "chat.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
