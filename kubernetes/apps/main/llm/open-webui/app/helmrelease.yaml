---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  interval: 1h
  values:
    defaultPodOptions:
      # Same authenticated internal Envoy routes the Paseo clients use. CoreDNS
      # cannot resolve these LAN-only names through its upstream resolver.
      hostAliases:
        - ip: 192.168.1.202
          hostnames:
            - mcp.${SECRET_DOMAIN}
            - mcp-ops.${SECRET_DOMAIN}
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.4@sha256:a5b9e403d19154796850679c8c5d1295301cee954be8b84ddd62af92426558f7
            env:
              TZ: Europe/Paris
              # Settings come from here, not the database: the DB was restored from
              # a backup that still points at the old ollama setup, and with
              # persistence on its stored values win over these variables. Admin
              # panel changes therefore do not survive a restart; change them here.
              ENABLE_PERSISTENT_CONFIG: "False"
              # Two native connections, each with an explicit model-scoped key.
              # Preserve raw model IDs so Workspace presets and existing chats work.
              # The guard remains a backstop for switching private tool history
              # onto a general model; these connections do not isolate chats.
              ENABLE_OLLAMA_API: "False"
              ENABLE_OPENAI_API: "True"
              LITELLM_PRIVATE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              LITELLM_GENERAL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui-general
                    key: api-key
              OPENAI_API_BASE_URLS: "http://litellm.llm.svc.cluster.local:4000/v1;http://litellm.llm.svc.cluster.local:4000/v1"
              OPENAI_API_KEYS: "$(LITELLM_PRIVATE_API_KEY);$(LITELLM_GENERAL_API_KEY)"
              OPENAI_API_CONFIGS: >-
                {"0": {"enable": true, "tags": [{"name": "Private"}]},
                 "1": {"enable": true, "tags": [{"name": "General"}]}}
              # Background tasks (chat titles, tags, search queries) default to the
              # model being chatted with; pin them to the local 9B so a ChatGPT chat
              # does not also send them, and so they work at all (they are
              # non-streaming, which LiteLLM's chatgpt provider cannot do).
              TASK_MODEL: qwen3.5-9b-chat
              TASK_MODEL_EXTERNAL: qwen3.5-9b-chat
              # RAG / knowledge embeddings on the same in-cluster embed model.
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: embed
              RAG_OPENAI_API_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              RAG_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # All clients use the same authenticated ToolHive route policies.
              # Dedicated client keys make each grant independently revocable.
              MCP_PRIVATE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: mcp-gateway-open-webui
                    key: open-webui
              MCP_GENERAL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: mcp-ops-api-keys
                    key: open-webui
              # `path` and `key` are unused for MCP but required by the admin API.
              TOOL_SERVER_CONNECTIONS: >-
                [{"type": "mcp", "url": "https://mcp.${SECRET_DOMAIN}/mcp",
                "path": "", "key": "", "auth_type": "none", "headers": {"x-api-key": "$(MCP_PRIVATE_API_KEY)"},
                "config": {"enable": true},
                "info": {"id": "toolhive", "name": "ToolHive Private", "description": "Everything, personal data included. Local models and Mistral only."}},
                {"type": "mcp", "url": "https://mcp-ops.${SECRET_DOMAIN}/mcp",
                "path": "", "key": "", "auth_type": "none", "headers": {"x-api-key": "$(MCP_GENERAL_API_KEY)"},
                "config": {"enable": true},
                "info": {"id": "toolhive-ops", "name": "ToolHive General", "description": "kubectl, flux, GitHub, n8n and Anki. For all providers."}}]
              ENABLE_WEBSOCKET_SUPPORT: "true"
              WEBSOCKET_MANAGER: "redis"
              WEBSOCKET_REDIS_URL: "redis://open-webui-dragonfly.llm.svc.cluster.local:6379"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "postgres-{{ .Release.Name }}-app"
                    key: uri
              # OIDC via Kanidm. OAUTH_CLIENT_ID/SECRET arrive via envFrom kanidm-open-webui-oidc.
              WEBUI_URL: "https://chat.${SECRET_DOMAIN}"
              ENABLE_OAUTH_SIGNUP: "true"
              # Link the kanidm login onto the existing account with the same email
              # instead of erroring "email already registered".
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              OAUTH_PROVIDER_NAME: Kanidm
              OAUTH_SCOPES: "openid email profile"
              OPENID_PROVIDER_URL: "https://idm.${SECRET_DOMAIN}/oauth2/openid/open-webui/.well-known/openid-configuration"
              OPENID_REDIRECT_URI: "https://chat.${SECRET_DOMAIN}/oauth/oidc/callback"
            envFrom:
              - secretRef:
                  name: kanidm-open-webui-oidc
              - secretRef:
                  name: open-webui-secret
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: open-webui
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/icon: open-webui.png
          gethomepage.dev/description: LLM Chat
        hostnames:
          - "chat.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
