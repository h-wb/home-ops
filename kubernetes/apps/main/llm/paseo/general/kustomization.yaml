apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - networkpolicy.yaml
  - externalsecret.yaml
  - virtualkey.yaml
configMapGenerator:
  - name: ${APP}-config
    files:
      - config/paseo.json
      - config/opencode.json
    options:
      disableNameSuffixHash: true
patches:
  - path: helmrelease.yaml
    target:
      kind: HelmRelease
  # Keep general's home if this Flux Kustomization is removed.
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  # Restore as the uid that took the backup: the mover's own uid would own every
  # file, and mise refuses a home it cannot chmod.
  - target:
      kind: Restore
    patch: |-
      - op: add
        path: /spec/mover
        value:
          inheritSecurityContextFrom:
            snapshot: {}
  # The backups are filed under the namespace the pod first ran in. A restore
  # that finds none must stop, not hand over an empty home.
  - target:
      kind: SnapshotPolicy
    patch: |-
      - op: add
        path: /spec/identity
        value:
          hostname: agents
  - target:
      kind: Restore
    patch: |-
      - op: replace
        path: /spec/policy/onMissingSnapshot
        value: Fail
