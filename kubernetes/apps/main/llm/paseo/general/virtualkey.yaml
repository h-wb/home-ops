---
# The paseo-general LiteLLM virtual key, jory-shape: the CR lives beside the
# pods, and the cluster-scoped litellm-operator (verified ClusterRoleBinding)
# generates the key and writes the litellm-paseo-general Secret into this
# namespace, binding cross-namespace to the proxy in llm. The helmrelease
# references that Secret directly — no ExternalSecret, no Bitwarden copy, and
# a rotated key reaches the pod with the operator's own sync.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: paseo-general
spec:
  proxyRef: litellm
  proxyNamespace: llm
  keyAlias: Paseo General
  secretName: litellm-paseo-general
  secretKey: api-key
  # Cloud models are granted to general only; paseo-private stays on local + Mistral.
  # chatgpt/* are the fenced aliases OpenCode and friends call; gpt-*/codex-* are the
  # subscription wildcards for a Codex agent keeping its own sign-in (and its
  # approval-check slugs like codex-auto-review).
  models:
    - anthropic/*
    - chatgpt/gpt-6-astra
    - chatgpt/gpt-6-luna
    - chatgpt/gpt-6.1-sol
    - chatgpt/gpt-6.1-terra
    - gpt-*
    - codex-*
    - qwen3.5-9b
    - qwen3.5-9b-chat
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
    - mistral/mistral-large-latest
    - mistral/mistral-large-4
    - mistral/zai-glm-5-3
    - mistral/zai-glm-5-3-flash
