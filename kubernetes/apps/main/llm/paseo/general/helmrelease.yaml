apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  values:
    controllers:
      ${APP}:
        labels:
          nfsMount: "true"
        # common's reloader auto would recreate the pod on every token refresh.
        annotations:
          secrets.exclude.reloader.stakater.com/reload: bot-tintin-token
        initContainers:
          tools:
            env:
              ANTHROPIC_BASE_URL: http://litellm.llm.svc.cluster.local:4000
            envFrom:
              - secretRef:
                  name: ${APP}-secret
        containers:
          app:
            env:
              ANTHROPIC_BASE_URL: http://litellm.llm.svc.cluster.local:4000
              # Kubernetes expands $(VAR): the header follows the operator's live key.
              ANTHROPIC_CUSTOM_HEADERS:
                value: "x-litellm-api-key: Bearer $(LITELLM_API_KEY)"
                dependsOn: LITELLM_API_KEY
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: GH_TOKEN
              # dotfiles' gh and git prefer the mounted installation token;
              # GH_TOKEN above stays as the fallback.
              GH_TOKEN_FILE: /var/run/secrets/bot-tintin/token
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: MEMINI_API_KEY
              OPENCODE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paseo-agents
                    key: OPENCODE_API_KEY
            envFrom:
              - secretRef:
                  name: ${APP}-secret
              - secretRef:
                  name: ${APP}-password
    persistence:
      data:
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/shared
        advancedMounts:
          ${APP}:
            app:
              - path: /data
                readOnly: true
      # Mount the directory, never subPath: a subPath mount does not refresh
      # when the Secret changes. optional: the pod starts before the Secret exists.
      bot-tintin-token:
        type: custom
        volumeSpec:
          secret:
            secretName: bot-tintin-token
            optional: true
            defaultMode: 0440
        advancedMounts:
          ${APP}:
            app:
              - path: /var/run/secrets/bot-tintin
                readOnly: true
    route:
      app:
        hostnames:
          - paseo-general.${SECRET_DOMAIN}
          - paseo.${SECRET_DOMAIN}
