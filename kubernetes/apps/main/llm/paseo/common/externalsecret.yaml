---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-password
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-password
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        PASEO_PASSWORD: "{{ .PASEO_PASSWORD }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ${APP}-secret
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GIT_EMAIL: "{{ .GIT_EMAIL }}"
        PROTON_PASS_TOKEN: "{{ .PROTON_PASS_TOKEN }}"
  dataFrom:
    - extract:
        key: ${PASEO_CREDENTIAL_ITEM}
