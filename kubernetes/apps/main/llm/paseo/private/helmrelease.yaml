apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  values:
    controllers:
      ${APP}:
        containers:
          app:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paseo-private-agents
                    key: MEMINI_API_KEY
    # Hermes' exec token (llm/hermes/app/rbac.yaml), app container only.
    persistence:
      kube-api-token:
        type: custom
        volumeSpec:
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        advancedMounts:
          ${APP}:
            app:
              - path: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
