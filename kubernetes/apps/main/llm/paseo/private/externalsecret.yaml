---
# The private pod's memini-private client key (Bitwarden `memini`, PRIVATE_PASEO;
# llm/memini-private registers it as client `paseo`). ToolHive needs none: the
# pod reaches mcp-private in-cluster, admitted by llm/toolhive's NetworkPolicy.
# MEMINI_GENERAL_API_KEY is its read-only key on the general store (GENERAL_PASEO_PRIVATE).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-private-agents
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: paseo-private-agents
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        MEMINI_API_KEY: "{{ .PRIVATE_PASEO }}"
        MEMINI_GENERAL_API_KEY: "{{ .GENERAL_PASEO_PRIVATE }}"
  dataFrom:
    - extract:
        key: memini
