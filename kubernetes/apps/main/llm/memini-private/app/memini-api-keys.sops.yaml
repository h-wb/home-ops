# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-secret.json
# Memini (private) credentials. Literal SOPS values, no generators: the
# ExternalSecret + Password generator setup this replaces re-rolled every key
# on each spec edit (a template change invalidates the target's data-hash,
# forcing a re-sync and fresh passwords) — which happened on 2026/11/08 and
# left the ToolHive gateway and workstation plugins sending 401 keys while the
# server only knew the new ones. With one encrypted source of truth, keys change
# only when this file does.
#
# - MEMINI_API_KEY: break-glass admin key; also the web UI sign-in.
#     kubectl -n llm get secret memini-api-keys -o jsonpath='{.data.MEMINI_API_KEY}' | base64 -d
# - toolhive-authorization: the exact Authorization header the ToolHive gateway
#   sends (its entry mounts this secret); must stay "Bearer " + the toolhive key
#   in api-keys.yaml.
# - hermes: the private Hermes pod's key (llm/hermes), also in api-keys.yaml.
# - api-keys.yaml: mounted through MEMINI_API_KEYS_FILE and read once at boot,
#   so a key edit rolls the pod via the reloader annotation.
#
# Edit via: mise run decrypt <this-file> ... mise run encrypt <this-file>.
apiVersion: v1
kind: Secret
metadata:
  name: memini-api-keys
type: Opaque
data:
