---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# memini-private's credentials, held in the Bitwarden `memini` item like jory's
# memini: one item, human-pasted once (seeded from the generator-era values so
# the ToolHive gateway's entry and the private Hermes pod keep working). Rotate
# by updating its field — nothing is generated in-cluster anymore.
# - MEMINI_API_KEY: the break-glass admin key; also what the web UI signs in with.
# - api-keys.yaml: the named key the ToolHive gateway uses, bound to one namespace.
# - toolhive-authorization: that same key as the header the gateway's entry sends.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        MEMINI_API_KEY: "{{ .PRIVATE_ADMIN }}"
        toolhive-authorization: "Bearer {{ .PRIVATE_TOOLHIVE }}"
        hermes: "{{ .PRIVATE_HERMES }}"
        api-keys.yaml: |
          keys:
            - name: toolhive
              secret: "{{ .PRIVATE_TOOLHIVE }}"
              default_namespace: hugo
            # The private Hermes pod (llm/hermes); personal memories, same home.
            - name: hermes
              secret: "{{ .PRIVATE_HERMES }}"
              default_namespace: hugo
  dataFrom:
    - extract:
        key: memini
