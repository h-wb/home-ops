---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# memini-private's credentials, held in the Bitwarden `memini` item like jory's
# memini: one item, human-pasted once. Rotate by updating its field — nothing is
# generated in-cluster.
# - MEMINI_API_KEY: the break-glass admin key; also what the web UI signs in with.
# - api-keys.yaml: the named client keys (hermes, workstation, paseo), each bound
#   to one namespace. Clients connect directly, never through ToolHive.
# Fields are <SCOPE>_<HOLDER>: one key per holder (what you would revoke if it
# leaked), not per agent; every agent on that holder shares it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        MEMINI_API_KEY: "{{ .PRIVATE_ADMIN }}"
        hermes: "{{ .PRIVATE_HERMES }}"
        workstation: "{{ .PRIVATE_WORKSTATION }}"
        paseo: "{{ .PRIVATE_PASEO }}"
        api-keys.yaml: |
          keys:
            # The private Hermes pod (llm/hermes); personal memories, same home.
            - name: hermes
              secret: "{{ .PRIVATE_HERMES }}"
              default_namespace: hugo
            # Every workstation's private agents (dotfiles conf.d/ai, Proton Pass memini/private).
            - name: workstation
              secret: "{{ .PRIVATE_WORKSTATION }}"
              default_namespace: hugo
            # The private Paseo pod (agents/paseo-private).
            - name: paseo
              secret: "{{ .PRIVATE_PASEO }}"
              default_namespace: hugo
  dataFrom:
    - extract:
        key: memini
