---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lingarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      lingarr:
        labels:
          nfsMount: "true"
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lingarr-translate/lingarr
              tag: 1.3.0@sha256:12473f6f40beac1bb91ffadc7d8c7f1c2a0cd99ba336e4bf2c1dfa617c27a763
            env:
              TZ: Europe/Paris
              ASPNETCORE_URLS: http://+:9876
              # Login is handled by the envoy OIDC policy on the route.
              AUTH_ENABLED: "false"
              DB_CONNECTION: postgresql
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: postgres-lingarr-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: postgres-lingarr-app
                    key: port
              DB_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: postgres-lingarr-app
                    key: dbname
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: postgres-lingarr-app
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-lingarr-app
                    key: password
              # Same instances as Bazarr, and /data is mounted at the same path as
              # theirs, so no path mapping is needed.
              RADARR_URL: http://radarr.downloads.svc.cluster.local
              SONARR_URL: http://sonarr-tv.downloads.svc.cluster.local
              # Subtitles of movies/shows may go to a cloud model (decided 2026-10-06).
              SERVICE_TYPE: localai
              LOCAL_AI_ENDPOINT: http://litellm.llm.svc.cluster.local:4000/v1/chat/completions
              LOCAL_AI_MODEL: chatgpt/gpt-6-luna
              SOURCE_LANGUAGES: '[{"name":"English","code":"en"}]'
              TARGET_LANGUAGES: '[{"name":"French","code":"fr"}]'
            envFrom:
              - secretRef:
                  name: lingarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9876
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 10000
    service:
      app:
        controller: lingarr
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: lingarr
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Lingarr
          gethomepage.dev/icon: lingarr.png
          gethomepage.dev/description: Subtitle Translation
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/config
      data:
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/shared
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
