---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name lingarr-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Scoped LiteLLM key (llm/litellm virtualkeys/lingarr.yaml), copied into
        # the Bitwarden `lingarr` item since the generated secret lives in llm.
        LOCAL_AI_API_KEY: "{{ .LITELLM_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: lingarr
    - extract:
        key: radarr
    - extract:
        key: sonarr
