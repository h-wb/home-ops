---
# One-shot restore: copy the adopted Dragon Quest and Monster series from
# Suwayomi's download sources back into the library root under the exact
# paths Sento has stored. Copies only; sources are kept. Remove this
# directory once verified.
apiVersion: batch/v1
kind: Job
metadata:
  name: sento-restore-adopted
  namespace: downloads
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: docker.io/library/python:3.13-alpine@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca
          command:
            - python3
            - -c
            - |
              import os, re, shutil, sys
              src_root = '/data/Downloads/suwayomi/sources/Madokami (EN)'
              dst_root = '/data/Literature/Manga/Volumes'

              def safe_dst(rel):
                  dst = os.path.join(dst_root, rel)
                  if not os.path.abspath(dst).startswith(dst_root + os.sep):
                      sys.exit(f'FAIL: unsafe destination {dst}')
                  if os.path.lexists(dst):
                      sys.exit(f'FAIL: destination exists {dst}')
                  return dst

              count = 0
              # Monster - Perfect Edition: Perfect Edition volumes keep their
              # names; the two c2c rips become the "Perfect Edition [en]" v01/v02.
              monster_src = os.path.join(src_root, 'Monster - Perfect Edition')
              for name in sorted(os.listdir(monster_src)):
                  s = os.path.join(monster_src, name)
                  if re.fullmatch(r'Monster v\d\d - Perfect Edition(\.cbz| \[VIZ\].*)', name) or 'Perfect Edition' in name:
                      dst = safe_dst(f'Monster - Perfect Edition/{name}')
                  else:
                      m = re.fullmatch(r'Monster (v\d\d) \(2014\).*\.cbz', name)
                      if not m:
                          print(f'skip {name}', flush=True)
                          continue
                      dst = safe_dst(f"Monster - Perfect Edition/Perfect Edition [en]/MONSTER {m.group(1)} [Perfect Edition][en].cbz")
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  shutil.copy2(s, dst)
                  count += 1
                  print(f'copied {name}', flush=True)

              # Dragon Quest: fan translation rips renamed to Sento's stored names.
              dq_src = os.path.join(src_root, 'Dragon Quest')
              for name in sorted(os.listdir(dq_src)):
                  m = re.fullmatch(r'Dragon Quest: The Adventure of Dai (\d+)\.cbz', name)
                  if not m:
                      print(f'skip {name}', flush=True)
                      continue
                  n = m.group(1).zfill(2)
                  dst = safe_dst(f"Dragon Quest/Fan Translation [en]/Dragon Quest The Adventure of Dai v{n} [Fan Translation][en].cbz")
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  shutil.copy2(os.path.join(dq_src, name), dst)
                  count += 1
                  print(f'copied {name} -> v{n}', flush=True)

              print(f'RESTORE COMPLETE: {count} files', flush=True)
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          nfs:
            server: 192.168.1.161
            path: /mnt/tank/shared
