---
# One-shot verification: list the merged library tree from a fresh NFS client.
# Temporary; remove together with the migration kustomization.
apiVersion: batch/v1
kind: Job
metadata:
  name: sento-library-verify
  namespace: downloads
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: docker.io/library/python:3.13-alpine@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca
          command:
            - python3
            - -c
            - |
              import os
              base = '/data/Literature/Manga'
              print('Manga root:', sorted(os.listdir(base)), flush=True)
              for sub in ('Volumes', 'Chapters'):
                  p = f'{base}/{sub}'
                  names = sorted(os.listdir(p))
                  print(f'{sub}: {len(names)} entries', flush=True)
                  for n in names:
                      print('  ', n, flush=True)
              print('Sento exists:', os.path.exists(f'{base}/Sento'), flush=True)
              for probe in ('Volumes/Dragon Quest', 'Volumes/Monster - Perfect Edition',
                            'Volumes/Akira', 'Volumes/Akira [mangabaka-5317]',
                            'Volumes/Dr. STONE [mangabaka-3762]/review'):
                  print(f'probe {probe}:', os.path.exists(f'{base}/{probe}'), flush=True)
              print('VERIFY COMPLETE', flush=True)
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          nfs:
            server: 192.168.1.161
            path: /mnt/tank/shared
