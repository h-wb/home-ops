---
apiVersion: batch/v1
kind: Job
metadata:
  name: sento-release-pull-040
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: tal2s
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/h-wb/sento:0.4.0
          imagePullPolicy: Always
          command: ["/bin/true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: extensions
          image: ghcr.io/h-wb/sento-extensions:0.4.0
          imagePullPolicy: Always
          command: ["/bin/true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
