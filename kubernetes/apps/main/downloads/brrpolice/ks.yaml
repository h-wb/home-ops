---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app brrpolice
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/zeroscaler
    # kopiur/backup component dropped 2026-08-21: its PVC always sets
    # dataSourceRef to a Restore, which is immutable once set and cannot be
    # patched away per-app (components merge one level above where app/
    # patches apply, and ks.yaml-level patches get clobbered by cluster-apps'
    # global default patch). PVC repeatedly corrupted with SQLite disk I/O
    # errors surviving pod/volume restarts, so SnapshotPolicy/SnapshotSchedule
    # are inlined below (still backing up going forward) but the PVC is
    # plain/local, wiped fresh instead of restored - banned-peer state is
    # cheap to rebuild, not worth chasing further.
  path: ./kubernetes/apps/main/downloads/brrpolice/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      KOPIUR_SCHEDULE: "44 * * * *"
      KOPIUR_CAPACITY: 1Gi
