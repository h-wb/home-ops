---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app brrpolice
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/zeroscaler
    - ../../../../../components/kopiur/backup
  # PVC repeatedly corrupted (SQLite disk I/O errors surviving pod/volume
  # restarts) starting 2026-08-20; wiped fresh 2026-08-21 rather than
  # restoring the same corrupted history. dataSourceRef is immutable once
  # set, so this drops it permanently for this app instead of a temporary
  # patch - banned-peer state is cheap to rebuild, not worth chasing further.
  patches:
    - patch: |-
        - op: remove
          path: /spec/dataSourceRef
      target:
        kind: PersistentVolumeClaim
        name: *app
  path: ./kubernetes/apps/main/downloads/brrpolice/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      KOPIUR_SCHEDULE: "44 * * * *"
      KOPIUR_CAPACITY: 1Gi
