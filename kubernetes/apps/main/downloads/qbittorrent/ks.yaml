---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbittorrent
spec:
  targetNamespace: downloads
  components:
    - ../../../../../components/zeroscaler
    - ../../../../../components/kopiur/backup
    - ../../../../../components/oidc/envoy
  path: ./kubernetes/apps/main/downloads/qbittorrent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: downloads
      APP_NAMESPACE: downloads
      # The pod CIDR is in AuthSubnetWhitelist and Envoy is a pod, so the route
      # had no login at all. The arr apps and qui use the Service.
      OIDC_DISPLAY_NAME: qBittorrent
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
      KOPIUR_SCHEDULE: "20 * * * *"
      KOPIUR_CAPACITY: 2Gi
