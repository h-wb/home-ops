---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app musicgrabber
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      musicgrabber:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/g33kphr33k/musicgrabber
              tag: 4.5.4@sha256:ee8b6519e78581269a6688063c76fa5d498727fffe3bf3e44a97ac92695634f1
            env:
              TZ: Europe/Paris
              PUID: "1000"
              PGID: "1000"
              MUSIC_DIR: /music
              DB_PATH: /data/music_grabber.db
              ENABLE_MUSICBRAINZ: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  timeoutSeconds: 5
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                # Spotify's headless-browser fallback (and MP3Phoenix, when
                # enabled) each spin up a real Chromium instance - 2Gi was
                # getting OOM-killed under concurrent watched-playlist syncs.
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        # image entrypoint must start as root to apply PUID/PGID, then drops privileges
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: musicgrabber
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: MusicGrabber
          gethomepage.dev/description: Music acquisition & watched playlists
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: *app
      music:
        enabled: true
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/hwe/Audio/Music
      soulseek-downloads:
        # slskd's completed-downloads folder only - never its shares folder.
        # Read-only: MusicGrabber's "move" mode isn't in use, it only copies.
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/shared/Downloads/soulseek/complete
        globalMounts:
          - path: /downloads
            readOnly: true
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
      tmp:
        type: emptyDir
