---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
# Profiles come from the TRaSH guide by trash_id; custom_formats below only override scores.
# French audio scoring: avoid VFQ, penalise releases without French.
# VFF/VF2 are worth 1 point, below min_upgrade_format_score (2): a tiebreak when picking, never a reason to
# re-grab. C411 adds those tags to its titles, so a real bonus made the same release look like an upgrade.
radarr:
  radarr:
    base_url: http://radarr.downloads.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: 2572ce3ea4eef1c19d59e0e20ed1cea7 # [French MULTi.VO] HD Bluray + WEB
        name: FR-MULTi-VO-HD
        min_upgrade_format_score: 2
    custom_formats:
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
          - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: 0
      - trash_ids:
          - 02e48d30a176c91baf9e15de05e5dc6a # FanSUB
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: -10000
      # nameless releases are the smallest re-encodes: let any named group win, without rejecting them
      - trash_ids:
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: -200
      - trash_ids:
          - 533f782474f0819643c2ec0c1eeeb0ac # Language: Not French
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: -1500
      - trash_ids:
          - 404c08fd0bd67f39b4d8e5709319094e # VFF
          - 29b5f7b1a5f20f64228786c3ab1bdc7d # VF2
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: 1
      - trash_ids:
          - b6ace47331a1d3b77942fc18156f6df6 # VFQ
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: -101
      - trash_ids: # guide default score
          - 4cafa20d5584f6ba1871d1b8941aa3cb # VOF
          - 52772f1cad6b5d26c2551f79bc538a50 # VFI
          - f7caa1942be5cc547c266bd3dbc2cda9 # VOQ
          - 95aa50f71a01c82354a7a2b385f1c4d8 # VQ
          - b3fb499641d7b3c2006be1d9eb014cb3 # VFB
        assign_scores_to:
          - name: FR-MULTi-VO-HD

  radarr-uhd:
    base_url: http://radarr-uhd.downloads.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: 92ead7022d13a7858d54e328e6a2f8f9 # [French MULTi.VO] UHD Bluray + WEB
        name: FR-MULTi-VO-UHD
        min_upgrade_format_score: 2
    custom_formats:
      - trash_ids: # guide default score
          - 923b6abef9b17f937fab56cfcf89e1f1 # DV (w/o HDR fallback)
          - 9c38ebb7384dada637be8899efa68e6f # SDR
        assign_scores_to:
          - name: FR-MULTi-VO-UHD
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
        assign_scores_to:
          - name: FR-MULTi-VO-UHD
            score: 101
      - trash_ids:
          - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - name: FR-MULTi-VO-UHD
            score: 0
      - trash_ids:
          - 02e48d30a176c91baf9e15de05e5dc6a # FanSUB
        assign_scores_to:
          - name: FR-MULTi-VO-UHD
            score: -10000
      - trash_ids:
          - 533f782474f0819643c2ec0c1eeeb0ac # Language: Not French
        assign_scores_to:
          - name: FR-MULTi-VO-UHD
            score: -1500
      - trash_ids:
          - 404c08fd0bd67f39b4d8e5709319094e # VFF
          - 29b5f7b1a5f20f64228786c3ab1bdc7d # VF2
        assign_scores_to:
          - name: FR-MULTi-VO-UHD
            score: 1
      - trash_ids:
          - b6ace47331a1d3b77942fc18156f6df6 # VFQ
        assign_scores_to:
          - name: FR-MULTi-VO-UHD
            score: -101
      - trash_ids: # guide default score
          - 4cafa20d5584f6ba1871d1b8941aa3cb # VOF
          - 52772f1cad6b5d26c2551f79bc538a50 # VFI
          - f7caa1942be5cc547c266bd3dbc2cda9 # VOQ
          - 95aa50f71a01c82354a7a2b385f1c4d8 # VQ
          - b3fb499641d7b3c2006be1d9eb014cb3 # VFB
        assign_scores_to:
          - name: FR-MULTi-VO-UHD

sonarr:
  sonarr:
    base_url: http://sonarr-tv.downloads.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 4c48f506c1116a3a57ae33f12346bd15 # [French MULTi.VO] HD Bluray + WEB (1080p)
        name: FR-MULTi-VO-WEB-1080p
        min_upgrade_format_score: 2
    custom_formats:
      # x265 is only wanted from trusted groups: the hand-made Sonarr format "x265 Trusted Groups"
      # (+1101, not managed here) offsets this for them, leaving a net +101 over x264.
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: -1000
      - trash_ids:
          - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: 0
      - trash_ids:
          - 84f0acbda9c0c9de783894fb66df25aa # FanSUB
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: -10000
      - trash_ids:
          - 322fca6f8f3694acc1401ddb530fd33d # Language: Not French
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: -1500
      - trash_ids:
          - 2c29a39a4fdfd6d258799bc4c09731b9 # VFF
          - 34789ec3caa819f087e23bbf9999daf7 # VF2
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: 1
      - trash_ids:
          - 7a7f4e4f58bd1058440236d033a90b67 # VFQ
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: -101
      - trash_ids: # guide default score
          - 7ae924ee9b2f39df3283c6c0beb8a2aa # VOF
          - b6816a0e1d4b64bf3550ad3b74b009b6 # VFI
          - 802dd70b856c423a9b0cb7f34ac42be1 # VOQ
          - 82085412d9a53ba8d8e46fc624eb701d # VQ
          - 0ce1e39a4676c6692ce47935278dac76 # VFB
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p

  # Anime: original audio with English subs; the guide profile already rejects dubs-only and VOSTFR.
  sonarr-anime:
    base_url: http://sonarr-anm.downloads.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: anime
    quality_profiles:
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        name: Anime-1080p
        # good enough is enough: stop at a WEB release with official subs (Web Tier 04 = 300).
        # Bluray encodes stay allowed but are not chased once a WEB release is in.
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 300
        # guide list minus remux (6.5 GB/episode)
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p, HDTV-1080p]
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p, HDTV-720p]
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: DVD
          - name: SDTV
          - name: Bluray-1080p Remux
            enabled: false
