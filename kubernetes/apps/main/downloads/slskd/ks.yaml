---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app slskd
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/zeroscaler
    - ../../../../../components/kopiur/backup
    - ../../../../../components/oidc/envoy
  path: ./kubernetes/apps/main/downloads/slskd/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      APP_NAMESPACE: *namespace
      # slskd runs with SLSKD_NO_AUTH.
      OIDC_DISPLAY_NAME: slskd
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
      KOPIUR_SCHEDULE: "28 * * * *"
      KOPIUR_CAPACITY: 5Gi
