---
# Garage runs on the NAS (docker/truenas/20-garage, deployed by doco-cd).
# Selector-less Service + EndpointSlice keep garage.storage.svc working for
# in-cluster consumers (kopiur, Prometheus, garage-webui).
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: api
      port: 3903
      targetPort: 3903
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: garage-nas
  labels:
    kubernetes.io/service-name: garage
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
endpoints:
  - addresses:
      - ${NFS_ADDR:=temp}
    conditions:
      ready: true
ports:
  - name: s3
    port: 3900
  - name: api
    port: 3903
---
# The S3 port again, as a LAN LoadBalancer the tailnet can reach: the edge
# site's collector uploads Miroir media to signed links through the edge
# cluster's miroir-relay (kubernetes/apps/edge/network/miroir-relay). Only the
# S3 port, and every request still needs a signature.
apiVersion: v1
kind: Service
metadata:
  name: garage-lb
  annotations:
    lbipam.cilium.io/ips: 192.168.1.208
spec:
  type: LoadBalancer
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: garage-lb-nas
  labels:
    kubernetes.io/service-name: garage-lb
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
endpoints:
  - addresses:
      - ${NFS_ADDR:=temp}
    conditions:
      ready: true
ports:
  - name: s3
    port: 3900
