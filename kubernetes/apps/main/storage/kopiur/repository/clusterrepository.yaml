---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  # Each app's mover Job runs in the app's own namespace and reads the repo
  # secret via envFrom, which is namespace-local - without this, only apps
  # actually living in `storage` could back up. This lets the operator copy
  # kopiur-repository-secret into every consuming namespace automatically.
  credentialProjection:
    allowed: true
  # Deliberately NOT volsync's existing repo path: reusing it forced kopiur's
  # bootstrap to scanCatalog volsync's entire history (~1175 snapshots) on
  # every spec change, fighting volsync's own concurrent hourly jobs for the
  # same NFS directory. We don't need that history - the PVCs already hold
  # current data, kopiur just needs to start backing up from here on. A
  # fresh, empty, kopiur-only repo bootstraps in seconds instead of ~30min.
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          server: ${NFS_ADDR}
          path: /mnt/tank/backup/kopiur
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: storage
      key: KOPIA_PASSWORD
  # The NFS export is owned by UID/GID 1000 (volsync's convention); movers
  # default to 65532 and silently hang against the export instead of failing
  # fast, so every mover this repository spawns (bootstrap included) needs to
  # match.
  moverDefaults:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  # Generous headroom kept as a safety margin; a fresh empty repo shouldn't
  # need anywhere near this, but bumping this after the fact costs a full
  # re-bootstrap, so there's no upside to trimming it back down.
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 3600
