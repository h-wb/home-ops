---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  # Same NFS export volsync's kopia repository already lives on, so the
  # existing repository (and its snapshot history) is reused rather than
  # bootstrapping a second one. `create` is idempotent - connects instead
  # of recreating if the repository already exists.
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          server: ${NFS_ADDR}
          path: /mnt/tank/backup/volsync
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: storage
      key: KOPIA_PASSWORD
  # The NFS export is owned by UID/GID 1000 (volsync's convention); movers
  # default to 65532 and silently hang against the export instead of failing
  # fast, so every mover this repository spawns (bootstrap included) needs to
  # match.
  moverDefaults:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  # This repository already holds months of hourly volsync snapshots across
  # ~40 apps (hundreds of shard dirs), so the bootstrap catalog scan over NFS
  # outruns the 120s default and gets killed by activeDeadlineSeconds before
  # it can finish, forever retrying. Give it real headroom.
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 1800
