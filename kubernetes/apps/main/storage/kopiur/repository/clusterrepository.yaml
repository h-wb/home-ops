---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  # Each app's mover Job runs in the app's own namespace and reads the repo
  # secret via envFrom, which is namespace-local - without this, only apps
  # actually living in `storage` could back up. This lets the operator copy
  # kopiur-repository-secret into every consuming namespace automatically.
  credentialProjection:
    allowed: true
  # S3 (garage, already running in-cluster) instead of NFS: kopia's access
  # pattern (thousands of small objects, heavy metadata operations) is
  # fundamentally slow against ZFS+NFSv4 (xattr/ACL overhead) - a full
  # bootstrap/maintenance cycle against the NFS repo took 20min-4h depending
  # on backlog. S3 skips the POSIX/ACL layer entirely: plain HTTP GET/PUT/LIST.
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: storage
      bucket: kopiur
      endpoint: garage.storage.svc.cluster.local:3900
      region: ca-west-1
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: storage
      key: KOPIA_PASSWORD
  # Without this, movers default to an ephemeral cache - every hourly backup
  # across ~40 apps re-fetches the full kopia metadata/content index from S3
  # cold, extending each mover's runtime (and therefore how long it holds its
  # RWO PVC's RBD mount open) for no reason. A small persistent cache lets
  # each app's mover reuse its own warm index between runs.
  moverDefaults:
    cache:
      mode: Persistent
      capacity: 5Gi
      storageClassName: local-hostpath
  # An absent `create` block means "this repo must already exist" - the
  # enabled:true default only applies once the block itself is present.
  # The kopiur bucket is genuinely empty, so we need it to actually
  # initialize a repo there.
  create:
    enabled: true
