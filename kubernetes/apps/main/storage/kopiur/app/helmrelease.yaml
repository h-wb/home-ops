---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
  values:
    # spec.credentialProjection on the ClusterRepository is not enough on its
    # own - the operator's own RBAC needs this to actually be granted
    # cluster-wide secrets create/patch, or every projection attempt 403s.
    features:
      credentialProjection:
        enabled: true
    # Default reconcileConcurrency (8, per-controller across 8 controllers)
    # let a resumed/backlogged controller fire ~8 concurrent VolumeSnapshot
    # creates + staged-PVC clones + mover Job attaches at once. On a 3-node
    # Ceph cluster that burst repeatedly leaked ceph-csi rbd operation-lock
    # state ("an operation with the given Volume ID ... already exists",
    # rook/rook#7122) and triggered exclusive-lock fencing on unrelated
    # live volumes. Bound to 1 so backups process strictly one at a time,
    # even when catching up a backlog.
    reconcileConcurrency: 1
    maxConcurrentDeleteJobs: 1
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
