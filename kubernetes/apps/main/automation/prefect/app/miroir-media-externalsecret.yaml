---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
# The media bucket key alone, from the Bitwarden item `miroir`. Only Miroir's
# media deployment mounts it (the `env_from` job variable of
# miroir-job-template.yaml), so a sync, import or build Job never holds a key
# to the bucket. The server keeps reading the key from miroir-secret, because it
# signs upload and view links.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name miroir-media
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        MIROIR_MEDIA_ACCESS_KEY_ID: "{{ .MIROIR_MEDIA_ACCESS_KEY_ID }}"
        MIROIR_MEDIA_SECRET_ACCESS_KEY: "{{ .MIROIR_MEDIA_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: miroir
