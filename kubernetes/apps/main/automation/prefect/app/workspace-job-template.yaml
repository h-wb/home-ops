---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Base job template for the workspace Kubernetes work pool (pipelines decision 012).
# The default prefect-kubernetes template extended with: the NFS data export mounted
# at a fixed path (/workspace/data, where the workspace keeps its configuration and
# artifacts, so storage paths recorded by the workspace resolve identically in every
# Job), and the flow-run environment. Warehouse and metadata-DB credentials come
# straight from the CNPG-generated postgres-metabase-app secret via secretKeyRef
# (the workspace composes its metadata URL from WORKSPACE_METADATA__* parts), like
# the other apps on postgres-metabase — nothing duplicated in a secret store. The
# only hand-placed value is the workspace master key in pipelines-secret (owned by
# the `pipelines` ExternalSecret once its Bitwarden item exists). The Kubernetes
# worker keeps valueFrom entries and merges them with per-deployment env. Applied
# by the workspace-worker init container on every start: prefect work-pool create
# ... creates the pool or updates its template.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prefect-workspace-job-template
  labels:
    app.kubernetes.io/name: prefect
data:
  workspace-job-template.json: |
    {
      "job_configuration": {
        "command": "{{ command }}",
        "env": "{{ env }}",
        "labels": "{{ labels }}",
        "name": "{{ name }}",
        "annotations": "{{ annotations }}",
        "namespace": "{{ namespace }}",
        "job_manifest": {
          "apiVersion": "batch/v1",
          "kind": "Job",
          "metadata": {
            "annotations": "{{ annotations }}",
            "generateName": "{{ name }}-",
            "labels": "{{ labels }}",
            "namespace": "{{ namespace }}"
          },
          "spec": {
            "backoffLimit": "{{ backoff_limit }}",
            "template": {
              "spec": {
                "completions": 1,
                "containers": [
                  {
                    "args": "{{ command }}",
                    "env": [
                      {
                        "name": "TZ",
                        "value": "Europe/Paris"
                      },
                      {
                        "name": "RUNTIME__LOG_LEVEL",
                        "value": "INFO"
                      },
                      {
                        "name": "PREFECT_LOGGING_EXTRA_LOGGERS",
                        "value": "dlt"
                      },
                      {
                        "name": "PREFECT_LOGGING_LOG_PRINTS",
                        "value": "true"
                      },
                      {
                        "name": "DESTINATION__POSTGRES__CREDENTIALS__HOST",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "host"
                          }
                        }
                      },
                      {
                        "name": "DESTINATION__POSTGRES__CREDENTIALS__PORT",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "port"
                          }
                        }
                      },
                      {
                        "name": "DESTINATION__POSTGRES__CREDENTIALS__DATABASE",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "dbname"
                          }
                        }
                      },
                      {
                        "name": "DESTINATION__POSTGRES__CREDENTIALS__USERNAME",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "username"
                          }
                        }
                      },
                      {
                        "name": "DESTINATION__POSTGRES__CREDENTIALS__PASSWORD",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "password"
                          }
                        }
                      },
                      {
                        "name": "WORKSPACE_METADATA__HOST",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "host"
                          }
                        }
                      },
                      {
                        "name": "WORKSPACE_METADATA__PORT",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "port"
                          }
                        }
                      },
                      {
                        "name": "WORKSPACE_METADATA__DATABASE",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "dbname"
                          }
                        }
                      },
                      {
                        "name": "WORKSPACE_METADATA__USERNAME",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "username"
                          }
                        }
                      },
                      {
                        "name": "WORKSPACE_METADATA__PASSWORD",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "postgres-metabase-app",
                            "key": "password"
                          }
                        }
                      },
                      {
                        "name": "GITHUB__AUTHOR_EMAILS",
                        "value": "[\"placeholder@example.com\"]"
                      },
                      {
                        "name": "WORKSPACE_SECRET_KEY",
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": "pipelines-secret",
                            "key": "WORKSPACE_SECRET_KEY"
                          }
                        }
                      }
                    ],
                    "image": "{{ image }}",
                    "imagePullPolicy": "{{ image_pull_policy }}",
                    "name": "prefect-job",
                    "resources": {
                      "limits": {
                        "cpu": "{{ cpu_limit }}",
                        "memory": "{{ memory_limit }}"
                      },
                      "requests": {
                        "cpu": "{{ cpu_request }}",
                        "memory": "{{ memory_request }}"
                      }
                    },
                    "volumeMounts": [
                      {
                        "name": "workspace-data",
                        "mountPath": "/workspace/data"
                      }
                    ]
                  }
                ],
                "parallelism": 1,
                "restartPolicy": "Never",
                "serviceAccountName": "{{ service_account_name }}",
                "volumes": [
                  {
                    "name": "workspace-data",
                    "nfs": {
                      "server": "${NFS_ADDR}",
                      "path": "/mnt/tank/hwe/Documents/data"
                    }
                  }
                ]
              }
            },
            "ttlSecondsAfterFinished": "{{ finished_job_ttl }}"
          }
        },
        "cluster_config": "{{ cluster_config }}",
        "job_watch_timeout_seconds": "{{ job_watch_timeout_seconds }}",
        "pod_watch_timeout_seconds": "{{ pod_watch_timeout_seconds }}",
        "stream_output": "{{ stream_output }}"
      },
      "variables": {
        "description": "Default variables for the Kubernetes worker.\n\nThe schema for this class is used to populate the `variables` section of the default\nbase job template.",
        "properties": {
          "name": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "Name given to infrastructure created by a worker.",
            "title": "Name"
          },
          "env": {
            "additionalProperties": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ]
            },
            "description": "Environment variables to set when starting a flow run.",
            "title": "Environment Variables",
            "type": "object"
          },
          "labels": {
            "additionalProperties": {
              "type": "string"
            },
            "description": "Labels applied to infrastructure created by a worker.",
            "title": "Labels",
            "type": "object"
          },
          "command": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "The command to use when starting a flow run. In most cases, this should be left blank and the command will be automatically generated by the worker.",
            "title": "Command"
          },
          "annotations": {
            "additionalProperties": {
              "type": "string"
            },
            "description": "Annotations applied to Kubernetes jobs and pods created by the worker.",
            "title": "Annotations",
            "type": "object"
          },
          "namespace": {
            "default": "default",
            "description": "The Kubernetes namespace to create jobs within.",
            "title": "Namespace",
            "type": "string"
          },
          "image": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "The image reference of a container image to use for created jobs. If not set, the latest Prefect image will be used.",
            "examples": [
              "docker.io/prefecthq/prefect:3-latest"
            ],
            "title": "Image"
          },
          "service_account_name": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "The Kubernetes service account to use for job creation.",
            "title": "Service Account Name"
          },
          "image_pull_policy": {
            "default": "IfNotPresent",
            "description": "The Kubernetes image pull policy to use for job containers.",
            "enum": [
              "IfNotPresent",
              "Always",
              "Never"
            ],
            "title": "Image Pull Policy",
            "type": "string"
          },
          "backoff_limit": {
            "default": 0,
            "description": "The number of times Kubernetes will retry a job after pod eviction. If set to 0, Prefect will reschedule the flow run when the pod is evicted unless PREFECT_FLOW_RUN_EXECUTE_SIGTERM_BEHAVIOR is already set. Otherwise Kubernetes retries the Job and Prefect relinquishes the run.",
            "minimum": 0,
            "title": "Backoff Limit",
            "type": "integer"
          },
          "finished_job_ttl": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "The number of seconds to retain jobs after completion. If set, finished jobs will be cleaned up by Kubernetes after the given delay. If not set, jobs will be retained indefinitely.",
            "title": "Finished Job TTL"
          },
          "job_watch_timeout_seconds": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "Number of seconds to wait for each event emitted by a job before timing out. If not set, the worker will wait for each event indefinitely.",
            "title": "Job Watch Timeout Seconds"
          },
          "pod_watch_timeout_seconds": {
            "default": 60,
            "description": "Number of seconds to watch for pod creation before timing out.",
            "title": "Pod Watch Timeout Seconds",
            "type": "integer"
          },
          "stream_output": {
            "default": true,
            "description": "If set, output will be streamed from the job to local standard output.",
            "title": "Stream Output",
            "type": "boolean"
          },
          "cluster_config": {
            "anyOf": [
              {
                "$ref": "#/definitions/KubernetesClusterConfig"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "The Kubernetes cluster config to use for job creation."
          },
          "cpu_request": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "The CPU resource request for the Kubernetes job container. Uses Kubernetes resource quantity format (e.g. '500m' for half a CPU, '2' for two CPUs). If not provided, no CPU request is configured.",
            "title": "CPU Request"
          },
          "cpu_limit": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "The CPU resource limit for the Kubernetes job container. Uses Kubernetes resource quantity format (e.g. '500m' for half a CPU, '2' for two CPUs). If not provided, no CPU limit is configured.",
            "title": "CPU Limit"
          },
          "memory_request": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "The memory resource request for the Kubernetes job container. Uses Kubernetes resource quantity format (e.g. '128Mi', '1Gi'). If not provided, no memory request is configured.",
            "title": "Memory Request"
          },
          "memory_limit": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "description": "The memory resource limit for the Kubernetes job container. Uses Kubernetes resource quantity format (e.g. '128Mi', '1Gi'). If not provided, no memory limit is configured.",
            "title": "Memory Limit"
          }
        },
        "type": "object",
        "definitions": {
          "KubernetesClusterConfig": {
            "block_schema_references": {},
            "block_type_slug": "kubernetes-cluster-config",
            "description": "Stores configuration for interaction with Kubernetes clusters.\n\nSee `from_file` for creation.",
            "properties": {
              "config": {
                "additionalProperties": true,
                "description": "The entire contents of a kubectl config file.",
                "title": "Config",
                "type": "object"
              },
              "context_name": {
                "description": "The name of the kubectl context to use.",
                "title": "Context Name",
                "type": "string"
              }
            },
            "required": [
              "config",
              "context_name"
            ],
            "secret_fields": [],
            "title": "KubernetesClusterConfig",
            "type": "object"
          }
        }
      }
    }
