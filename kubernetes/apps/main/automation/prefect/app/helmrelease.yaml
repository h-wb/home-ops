---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prefect
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: prefecthq/prefect
              tag: 3.9.0-python3.12@sha256:9f4fb20a431f0aba81bbcede83d5c08648aa769faf0ec47e989e9d370270129e
            command:
              - /bin/sh
              - -c
              # 3.8.7 ships SQLAlchemy 2.1, which breaks the scheduler (PrefectHQ/prefect#23199); drop once fixed
              - pip install -q 'sqlalchemy[asyncio]<2.1' && prefect server start
            env:
              TZ: Europe/Paris
              PREFECT_UI_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              PREFECT_API_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}/api"
              PREFECT_SERVER_API_HOST: 0.0.0.0
              PREFECT_SERVER_API_PORT: &port 4200
              PREFECT_LOGGING_LEVEL: "DEBUG"
            envFrom:
              - secretRef:
                  name: prefect-secret
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
      worker:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: true
        containers:
          app:
            image:
              repository: prefecthq/prefect
              tag: 3.9.0-python3.12@sha256:9f4fb20a431f0aba81bbcede83d5c08648aa769faf0ec47e989e9d370270129e
            command:
              - /bin/sh
              - -c
              - prefect worker start --pool local-pool
            env:
              TZ: Europe/Paris
              PREFECT_API_URL: "http://prefect.automation:4200/api"
            envFrom:
              - secretRef:
                  name: prefect-secret
            resources:
              requests:
                cpu: 200m
                memory: 2Gi
              limits:
                cpu: 2000m
                memory: 6Gi
      # Miroir worker (pipelines decision 012): each miroir flow run is its
      # own Job from the versioned pipelines image. The legacy deployments above
      # stay on local-pool until their connection is cut over.
      # NB: ghcr.io/h-wb/pipelines is built from the pipelines repo's main branch;
      # merge this only after that image exists (Renovate pins the digest).
      miroir-worker:
        annotations:
          reloader.stakater.com/auto: "true"
        # Created in miroir-rbac.yaml together with its Role; `name` (not the
        # chart's identifier mechanism) so the other controllers keep `default`.
        serviceAccount:
          name: prefect-miroir-worker
        pod:
          automountServiceAccountToken: true
        initContainers:
          # Creates the miroir-k8s pool, or updates its base job template —
          # --overwrite makes it idempotent against an existing pool.
          pool:
            image: &miroir-image
              repository: ghcr.io/h-wb/pipelines
              tag: sha-d040ebd0d2f625726228c618b2954b3645dbdded
            command:
              - /app/.venv/bin/python
              - -m
              - prefect
              - work-pool
              - create
              - miroir-k8s
              - --type
              - kubernetes
              - --overwrite
              - --base-job-template
              - /template/miroir-job-template.json
            env:
              TZ: Europe/Paris
              PREFECT_API_URL: "http://prefect.automation:4200/api"
            envFrom:
              - secretRef:
                  name: prefect-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image: *miroir-image
            command:
              - /app/.venv/bin/python
              - -m
              - prefect
              - worker
              - start
              - --pool
              - miroir-k8s
              - --type
              - kubernetes
            env:
              TZ: Europe/Paris
              PREFECT_API_URL: "http://prefect.automation:4200/api"
              # The observer watches Jobs/Pods for prefect.io/flow-run-id labels;
              # scoped here so the namespaced Role below is enough (default is
              # cluster-wide).
              PREFECT_INTEGRATIONS_KUBERNETES_OBSERVER_NAMESPACES: automation
            envFrom:
              - secretRef:
                  name: prefect-secret
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
    # defaultPodOptions:
    #   securityContext:
    #     runAsNonRoot: true
    #     runAsUser: 1000
    #     runAsGroup: 1000
    #     fsGroup: 1000
    #     fsGroupChangePolicy: OnRootMismatch
    service:
      server:
        controller: server
        ports:
          http:
            port: *port
      # worker:
      #   controller: worker

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
      api:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs: [{}]
    persistence:
      data:
        existingClaim: prefect
        advancedMounts:
          server:
            app:
              - path: /root/.prefect
      test:
        type: emptyDir
        advancedMounts:
          worker:
            app:
              - path: /root/.prefect
      nfs:
        enabled: true
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/hwe/Documents/data
        advancedMounts:
          worker:
            app:
              - path: /root/.prefect/data
      # The miroir-k8s pool's base job template (the Jobs themselves mount the
      # NFS export through the template, not through this HelmRelease).
      miroir-job-template:
        type: configMap
        name: prefect-miroir-job-template
        advancedMounts:
          miroir-worker:
            pool:
              - path: /template/miroir-job-template.json
                subPath: miroir-job-template.json
                readOnly: true
