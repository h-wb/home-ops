---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
# Installation secrets for the workspace (pipelines decision 011): the metadata
# database URL (schema workspace_meta in postgres-metabase), the workspace master
# key, and the warehouse/dlt credentials. Referenced by the workspace-k8s pool's
# base job template (workspace-job-template.yaml) so flow-run Jobs get them via
# secretKeyRef and the values never leave the cluster's secret store.
# The Bitwarden item `pipelines` must contain keys with exactly these names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipelines
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: pipelines-secret
  dataFrom:
    - extract:
        key: pipelines
