---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
# Workspace installation secrets (pipelines decision 011) once the Bitwarden item
# `pipelines` exists: WORKSPACE_METADATA_URL (schema workspace_meta in
# postgres-metabase) and WORKSPACE_SECRET_KEY (the workspace master key). The
# warehouse/dlt credentials deliberately do NOT live here — flow-run Jobs read
# them from the CNPG-generated postgres-metabase-app secret (see
# workspace-job-template.yaml), like the other apps on postgres-metabase.
# Until the item is created, pipelines-secret is placed manually; ESO takes
# over (and can rotate the values) as soon as it syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipelines
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: pipelines-secret
  dataFrom:
    - extract:
        key: pipelines
