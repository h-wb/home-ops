---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
# The workspace master key (pipelines decision 011) once the Bitwarden item
# `pipelines` exists — the one installation secret the cluster cannot derive.
# Everything else flow-run Jobs need is injected straight from the CNPG-generated
# postgres-metabase-app secret (see workspace-job-template.yaml); the workspace
# composes its metadata URL from those parts. Until the item is created,
# pipelines-secret is placed by hand; ESO takes over (and can rotate the key)
# as soon as it syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipelines
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: pipelines-secret
  dataFrom:
    - extract:
        key: pipelines
