---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
# The viewer's media key: it can only read the miroir-media bucket (the Garage
# bootstrap task in docker/truenas grants it --read). The Bitwarden item
# `miroir` holds it as MIROIR_VIEW_MEDIA_*; the viewer reads the usual
# MIROIR_MEDIA_* names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name miroir-view-media
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        MIROIR_MEDIA_ACCESS_KEY_ID: "{{ .MIROIR_VIEW_MEDIA_ACCESS_KEY_ID }}"
        MIROIR_MEDIA_SECRET_ACCESS_KEY: "{{ .MIROIR_VIEW_MEDIA_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: miroir
