---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app miroir
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/h-wb/pipelines
              tag: sha-8bb7374e1abc6514117416a59f56027451a59da5
            # Absolute interpreter path: no PATH lookup for the console script
            # (mutable-tag stale caches once made runc miss it on one node).
            command:
              - /app/.venv/bin/python
              - -m
              - src.cli
              - --config
              - /miroir/data/miroir/miroir.json
              - serve
              - --host
              - 0.0.0.0
              - --port
              - "8765"
            env:
              TZ: Europe/Paris
              # Trust the ingress proxy's pod-network headers for HTTPS URLs/cookies.
              FORWARDED_ALLOW_IPS: 10.42.0.0/16
              RUNTIME__DLTHUB_TELEMETRY: "false"
              MIROIR_METADATA__HOST:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: host } }
              MIROIR_METADATA__PORT:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: port } }
              MIROIR_METADATA__DATABASE:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: dbname } }
              MIROIR_METADATA__USERNAME:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: username } }
              MIROIR_METADATA__PASSWORD:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: password } }
              # The timeline's read-only view of the warehouse (postgres-metabase),
              # as the role from timeline-reader.yaml. An older image ignores these.
              MIROIR_TIMELINE_DATABASE__HOST:
                valueFrom: { secretKeyRef: { name: postgres-metabase-app, key: host } }
              MIROIR_TIMELINE_DATABASE__PORT:
                valueFrom: { secretKeyRef: { name: postgres-metabase-app, key: port } }
              MIROIR_TIMELINE_DATABASE__DATABASE:
                valueFrom: { secretKeyRef: { name: postgres-metabase-app, key: dbname } }
              MIROIR_TIMELINE_DATABASE__USERNAME:
                valueFrom: { secretKeyRef: { name: miroir-timeline-reader, key: username } }
              MIROIR_TIMELINE_DATABASE__PASSWORD:
                valueFrom: { secretKeyRef: { name: miroir-timeline-reader, key: password } }
              # Execution settings (pool, flow-run image, namespace) live in
              # miroir.json. Only the worker-visible config path is environmental.
              PREFECT_API_URL: "http://prefect.automation:4200/api"
              MIROIR_PREFECT_CONFIG_PATH: /miroir/data/miroir/miroir.json
              MIROIR_ARTIFACT_DIR: /miroir/data/miroir/artifacts
            # miroir-secret: MIROIR_SECRET_KEY (built-in connection secrets),
            # MIROIR_API_TOKEN (the UI/API bearer) and MIROIR_METRICS_TOKEN
            # (opens /metrics to the scraper only), from Bitwarden via the
            # `miroir` ExternalSecret. prefect-secret: the Prefect API auth
            # string — the server submits flow runs like the worker does.
            envFrom:
              - secretRef:
                  name: prefect-secret
              - secretRef:
                  name: miroir-secret
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      server:
        controller: server
        ports:
          http:
            port: 8765
    # /metrics answers only to MIROIR_METRICS_TOKEN, never to the admin token.
    serviceMonitor:
      server:
        service:
          identifier: server
        endpoints:
          - port: http
            path: /metrics
            interval: 1m
            authorization:
              credentials:
                name: miroir-secret
                key: MIROIR_METRICS_TOKEN
    route:
      app:
        hostnames:
          - "miroir.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        enabled: true
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/hwe/Documents/data
        advancedMounts:
          server:
            app:
              - path: /miroir/data
