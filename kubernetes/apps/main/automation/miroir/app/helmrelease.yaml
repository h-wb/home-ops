---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app miroir
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/h-wb/pipelines
              tag: latest
            command:
              - pipelines-mirroir
              - --config
              - /miroir/data/miroir/miroir.json
              - serve
              - --host
              - 0.0.0.0
              - --port
              - "8765"
            env:
              TZ: Europe/Paris
              RUNTIME__DLTHUB_TELEMETRY: "false"
              # The metadata store: schema miroir_meta in postgres-miroir
              # (the Cluster from the cnpg/initdb component on this app).
              MIROIR_METADATA__HOST:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: host } }
              MIROIR_METADATA__PORT:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: port } }
              MIROIR_METADATA__DATABASE:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: dbname } }
              MIROIR_METADATA__USERNAME:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: username } }
              MIROIR_METADATA__PASSWORD:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: password } }
              # Serves the web UI/API; with the pool set, requested syncs are
              # submitted as Prefect flow runs (miroir-k8s) instead of local
              # subprocesses. Must mirror the repo's mise mirroir:deploy
              # environment, or plan/apply would fight over drift.
              PREFECT_API_URL: "http://prefect.automation:4200/api"
              MIROIR_PREFECT_POOL: miroir-k8s
              MIROIR_PREFECT_CONFIG_PATH: /miroir/data/miroir/miroir.json
              MIROIR_IMAGE: "ghcr.io/h-wb/pipelines:latest"
              MIROIR_PREFECT_JOB_VARIABLES: '{"namespace":"automation"}'
              MIROIR_ARTIFACT_DIR: /miroir/data/miroir/artifacts
            # MIROIR_SECRET_KEY (built-in connection secrets) and
            # MIROIR_API_TOKEN (the UI/API bearer) — placed by hand in
            # miroir-secret until the Bitwarden `miroir` item exists
            # (ExternalSecret in the prefect app owns it then).
            envFrom:
              - secretRef:
                  name: miroir-secret
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      server:
        controller: server
        ports:
          http:
            port: 8765
    route:
      app:
        hostnames:
          - "miroir.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        enabled: true
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/hwe/Documents/data
        advancedMounts:
          server:
            app:
              - path: /miroir/data
