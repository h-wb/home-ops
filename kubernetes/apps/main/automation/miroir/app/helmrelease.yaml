---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app miroir
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/h-wb/pipelines
              tag: sha-78138ad82abf7a64ae2718e58de21f9c6c016e99
            # Absolute interpreter path: no PATH lookup for the console script
            # (mutable-tag stale caches once made runc miss it on one node).
            command:
              - /app/.venv/bin/python
              - -m
              - src.cli
              - --config
              - /miroir/data/miroir/miroir.json
              - serve
              - --host
              - 0.0.0.0
              - --port
              - "8765"
            env:
              TZ: Europe/Paris
              RUNTIME__DLTHUB_TELEMETRY: "false"
              # The metadata store: schema miroir_meta in postgres-miroir
              # (the Cluster from the cnpg/initdb component on this app).
              MIROIR_METADATA__HOST:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: host } }
              MIROIR_METADATA__PORT:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: port } }
              MIROIR_METADATA__DATABASE:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: dbname } }
              MIROIR_METADATA__USERNAME:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: username } }
              MIROIR_METADATA__PASSWORD:
                valueFrom: { secretKeyRef: { name: postgres-miroir-app, key: password } }
              # Execution settings (pool, flow-run image, namespace) live in
              # miroir.json. Only the worker-visible config path is environmental.
              PREFECT_API_URL: "http://prefect.automation:4200/api"
              MIROIR_PREFECT_CONFIG_PATH: /miroir/data/miroir/miroir.json
              MIROIR_ARTIFACT_DIR: /miroir/data/miroir/artifacts
            # miroir-secret: MIROIR_SECRET_KEY (built-in connection secrets)
            # and MIROIR_API_TOKEN (the UI/API bearer), from Bitwarden via the
            # `miroir` ExternalSecret. prefect-secret: the Prefect API auth
            # string — the server submits flow runs like the worker does.
            envFrom:
              - secretRef:
                  name: prefect-secret
              - secretRef:
                  name: miroir-secret
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      server:
        controller: server
        ports:
          http:
            port: 8765
    route:
      app:
        hostnames:
          - "miroir.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        enabled: true
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/hwe/Documents/data
        advancedMounts:
          server:
            app:
              - path: /miroir/data
