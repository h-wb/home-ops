---
# LAN LoadBalancer for the Miroir server: the edge site's collector delivers
# here through the edge cluster's miroir-relay (kubernetes/apps/edge/network/
# miroir-relay), over the tailnet. The relay's routes pass only the device
# endpoints; this address itself is tailnet only (networkpolicy.yaml denies
# the LAN) and never exposed through envoy or Cloudflare.
apiVersion: v1
kind: Service
metadata:
  name: miroir-lb
  annotations:
    lbipam.cilium.io/ips: 192.168.1.207
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/controller: server
    app.kubernetes.io/instance: miroir
    app.kubernetes.io/name: miroir
  ports:
    - name: http
      port: 8765
      targetPort: 8765
