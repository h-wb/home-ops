---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# miroir-lb exists for the edge site, which arrives through the network/tailscale
# pod (userspace mode re-dials from the pod). Cilium runs DSR, so a LAN client
# keeps its address and is `world`: it must use the gateway, with TLS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miroir-deny-lan
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: server
      app.kubernetes.io/instance: miroir
      app.kubernetes.io/name: miroir
  enableDefaultDeny:
    ingress: false
  ingressDeny:
    - fromEntities:
        - world
