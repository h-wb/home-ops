---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app miroir
  namespace: &namespace automation
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # Miroir's own metadata database (schema miroir_meta): operations, attempts,
    # the artifact registry, and encrypted connection secrets — decoupled from
    # postgres-metabase, where the warehouse data and dashboards stay
    # (pipelines decision 015). Net-new cluster, Barman backups via the plugin.
    - ../../../../../components/cnpg/initdb
  dependsOn:
    - name: plugin-barman-cloud
      namespace: database
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  path: ./kubernetes/apps/main/automation/miroir/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      APP_NAMESPACE: *namespace
      # A small control-plane database. Two instances: the base component's
      # synchronous-replication block is rejected with one, and two give data
      # durability plus zero-downtime updates (Barman covers recovery).
      CNPG_REPLICAS: "2"
      CNPG_SIZE: 2Gi
