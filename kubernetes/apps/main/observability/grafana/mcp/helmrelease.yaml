---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Grafana's MCP server (dashboards, Prometheus/Loki queries, alerts), registered in
# ToolHive as llm/toolhive/mcp-servers/grafana. Viewer role: read-only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mcp-grafana
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      mcp-grafana:
        annotations:
          secret.reloader.stakater.com/reload: mcp-grafana-token
        containers:
          app:
            image:
              repository: docker.io/grafana/mcp-grafana
              tag: 2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
            args:
              - -t
              - sse
              - --address
              - 0.0.0.0:8000
              # Host-header allowlist: ToolHive connects with the Service DNS name.
              - --allowed-hosts
              - mcp-grafana.observability:8000,mcp-grafana.observability.svc.cluster.local:8000
              # Separate listener without Host checks, so kubelet probes pass.
              - --healthz-address
              - :8080
            env:
              GRAFANA_URL: http://grafana-service.observability.svc.cluster.local:3000
              GRAFANA_SERVICE_ACCOUNT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: mcp-grafana-token
                    key: token
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 8000
