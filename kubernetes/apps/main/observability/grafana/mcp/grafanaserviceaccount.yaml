---
# Viewer service account for mcp-grafana; the operator creates the token Secret.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: mcp-grafana
spec:
  instanceName: grafana
  name: mcp-grafana
  role: Viewer
  tokens:
    - name: mcp-grafana
      secretName: mcp-grafana-token
