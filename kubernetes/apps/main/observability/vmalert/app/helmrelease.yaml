---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vmalert
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.49.0
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-alert
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmalert
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: vmalert
  values:
    server:
      fullnameOverride: vmalert
      # VictoriaLogs is the datasource here (not Prometheus/VictoriaMetrics) -
      # this vmalert instance exists specifically to alert on log CONTENT
      # (chronic per-pod storage errors) that no metric captures, since the
      # apps affected by RBD fencing this week (kanidm, gatus, prometheus,
      # musicgrabber, brrpolice...) mostly stay "Running" and never crash-loop,
      # so KubePodCrashLooping never catches them - only their logs show it.
      datasource:
        url: http://victoria-logs-server.observability.svc.cluster.local:9428
      notifier:
        url: http://alertmanager-operated.observability.svc.cluster.local:9093
      extraArgs:
        rule.defaultRuleType: vlogs
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 128Mi
      config:
        alerts:
          groups:
            - name: chronic-storage-errors
              type: vlogs
              interval: 2m
              rules:
                - alert: ChronicStorageIOErrors
                  # Matches the exact error signatures seen across every RBD-fencing
                  # incident this week (2026-08-20/21): ext4 defensively going
                  # read-only, SQLite reporting disk I/O errors / locking-protocol
                  # violations against a fenced watch, or a wedged connection pool
                  # that never recovers on its own. `for: 3m` requires this to be
                  # sustained across ~2 evaluation cycles, not a one-off blip.
                  expr: |-
                    ("disk I/O error" OR "read-only file system" OR "readonly database" OR EROFS OR "unable to retrieve connection from pool" OR "locking protocol" OR "unable to open database file") | stats by (kubernetes.pod_namespace, kubernetes.pod_name) count() as errs | filter errs:>=5
                  for: 3m
                  labels:
                    severity: warning
                  annotations:
                    summary: >-
                      {{ index .Labels "kubernetes.pod_namespace" }}/{{ index .Labels "kubernetes.pod_name" }}
                      has logged {{ $value }} storage I/O errors in the last 2m.
                      Every occurrence of this pattern this week has needed a
                      manual pod/statefulset restart to clear - it does not
                      self-heal.

            - name: storage-substrate
              type: vlogs
              interval: 2m
              rules:
                - alert: Ext4VolumeWentReadOnly
                  expr: |-
                    facility:kern ("Aborting journal" OR "EXT4-fs error" OR "Remounting filesystem read-only") | stats by (host) count() as hits | filter hits:>0
                  keep_firing_for: 30m
                  labels:
                    severity: critical
                  annotations:
                    summary: >-
                      {{ index .Labels "host" }} put ext4 into emergency read-only
                      ({{ $value }} kernel errors). Affected PVCs will NOT self-heal
                      and most pods stay Running without crash-looping.
                    description: >-
                      Find them with: talosctl -n {{ index .Labels "host" }} read /proc/mounts
                      | grep emergency_ro | grep -oE 'pvc-[0-9a-f-]{36}' | sort -u
                      (do NOT filter on globalmount - that silently drops volumes).
                      Check `ceph osd blocklist ls` and remove any node entry, then
                      restart the consuming pods in small batches to remount.

                - alert: NodeLinkDegraded
                  expr: |-
                    facility:kern "NIC Link is Up" ("100 Mbps" OR "10 Mbps") | stats by (host) count() as hits | filter hits:>0
                  keep_firing_for: 1h
                  labels:
                    severity: critical
                  annotations:
                    summary: >-
                      {{ index .Labels "host" }} renegotiated its NIC down to 100Mb
                      or less - Ceph and etcd will starve and RBD volumes will go
                      read-only within hours.
                    description: >-
                      Confirm with: talosctl -n {{ index .Labels "host" }} get links
                      <iface> -o yaml | grep speedMbit. A reboot (--mode=powercycle)
                      re-latches the full speed but only buys ~a day; the durable fix
                      is replacing the cable or moving switch port. Do NOT force
                      speed 1000 - 100BASE-TX uses 2 pairs where 1000/2500 need 4,
                      so forcing it on a damaged cable drops the link entirely.
    serviceMonitor:
      enabled: true
