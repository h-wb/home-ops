---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    configMaps:
      config:
        data:
          vector.yaml: |
            data_dir: /vector-data-dir
            api:
              enabled: false
            sources:
              talos:
                type: socket
                mode: tcp
                address: 0.0.0.0:6050
                framing:
                  method: newline_delimited
                decoding:
                  codec: json
            sinks:
              victorialogs:
                type: http
                inputs:
                  - talos
                uri: http://victoria-logs-server.observability.svc.cluster.local:9428/insert/jsonline?_msg_field=msg&_time_field=talos-time&_stream_fields=talos-service,host
                encoding:
                  codec: json
                framing:
                  method: newline_delimited
                compression: gzip
    controllers:
      vector:
        containers:
          app:
            image:
              repository: docker.io/timberio/vector
              tag: 0.58.0-alpine
            args:
              - --config
              - /etc/vector/vector.yaml
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      config:
        type: configMap
        identifier: config
        advancedMounts:
          vector:
            app:
              - path: /etc/vector/vector.yaml
                subPath: vector.yaml
    service:
      app:
        type: LoadBalancer
        ports:
          talos-log:
            port: 6050
            protocol: TCP
