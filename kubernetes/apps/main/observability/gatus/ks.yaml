---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gatus
  namespace: &namespace observability
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # Tailscale client sidecar: the edge group probes edge VIPs (HA, mosquitto)
    # directly, over the edge cluster's network/tailscale subnet router.
    - ../../../../../components/tailscale/client
  path: ./kubernetes/apps/main/observability/gatus/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # For the tailscale component's TS_HOSTNAME.
      CLUSTER: ${CLUSTER}
      GATUS_SUBDOMAIN: status
