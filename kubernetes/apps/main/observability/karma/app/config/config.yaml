---
alertmanager:
  interval: 60s
  servers:
    - name: main
      uri: http://alertmanager-operated.observability.svc.cluster.local:9093
      timeout: 10s
      healthcheck:
        visible: false
        filters:
          alertmanager:
            - alertname=Watchdog
            - prometheus=observability/kube-prometheus-stack
    # Read-only view over the tailnet (this pod's tailscale sidecar accepts the
    # edge subnet route); soft dependency — edge pages from its own Alertmanager
    # regardless, this only loses the view while the link is down.
    - name: edge
      uri: http://192.168.18.79:9093
      timeout: 10s
      healthcheck:
        visible: false
        filters:
          alertmanager:
            - alertname=Watchdog
history:
  rewrite:
    # Alert source links use the public hostname. Query the in-cluster API
    # directly for history, avoiding public DNS and the OIDC login flow.
    - source: "https?://prometheus[.]${SECRET_DOMAIN}"
      uri: http://prometheus-operated.observability.svc.cluster.local:9090
filters:
  default:
    - "@state!=suppressed"
