---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app karma
  namespace: &namespace observability
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/oidc/envoy
    # Tailscale client sidecar: reaches the edge cluster's Alertmanager LB
    # (192.168.18.79, exposed by the edge kube-prometheus-stack service.yaml).
    - ../../../../../components/tailscale/client
  path: ./kubernetes/apps/main/observability/karma/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # For the tailscale component's TS_HOSTNAME.
      CLUSTER: ${CLUSTER}
      APP_NAMESPACE: *namespace
      OIDC_DISPLAY_NAME: Karma
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
