---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kube-prometheus-stack
  namespace: &namespace observability
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/main/observability/kube-prometheus-stack/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: prometheus
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-oidc-prometheus
  namespace: observability
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: prometheus
  components:
    - ../../../../../components/oidc/envoy
  # Needs the chart's HTTPRoute (kube-prometheus-stack-prometheus) to exist first.
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
  path: ./kubernetes/apps/main/observability/kube-prometheus-stack/oidc-prometheus
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: prometheus
      APP_NAMESPACE: observability
      OIDC_TARGET: kube-prometheus-stack-prometheus
      OIDC_DISPLAY_NAME: Prometheus
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-oidc-alertmanager
  namespace: observability
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: alertmanager
  components:
    - ../../../../../components/oidc/envoy
  # Needs the chart's HTTPRoute (kube-prometheus-stack-alertmanager) to exist first.
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
  path: ./kubernetes/apps/main/observability/kube-prometheus-stack/oidc-alertmanager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: alertmanager
      APP_NAMESPACE: observability
      OIDC_TARGET: kube-prometheus-stack-alertmanager
      OIDC_DISPLAY_NAME: Alertmanager
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
      OIDC_IMAGE_NAME: prometheus
