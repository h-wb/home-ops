---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
spec:
  components:
    - ../../../../../components/oidc/envoy
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/main/observability/victoria-logs/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
  postBuild:
    substitute:
      APP: victoria-logs
      APP_NAMESPACE: observability
      OIDC_TARGET: victoria-logs-server
      OIDC_DISPLAY_NAME: VictoriaLogs
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
      OIDC_IMAGE_NAME: victoriametrics
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs-collector
spec:
  dependsOn:
    - name: victoria-logs
  interval: 1h
  path: ./kubernetes/apps/main/observability/victoria-logs/collector
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
