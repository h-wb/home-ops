---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Preauth key for the `tailscale` Bitwarden item (TS_AUTHKEY), shared with the
# edge cluster's subnet router and every client sidecar.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: tailscale-secret
  dataFrom:
    - extract:
        key: tailscale
