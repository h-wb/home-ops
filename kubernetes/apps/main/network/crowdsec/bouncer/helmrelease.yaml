---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: crowdsec-bouncer
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.8.4
  url: oci://ghcr.io/kdwils/charts/envoy-proxy-bouncer
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-bouncer
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec-bouncer
  interval: 1h
  values:
    fullnameOverride: *app
    grafana:
      dashboard:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    config:
      trustedProxies:
        - 10.42.0.0/16
      bouncer:
        lapiURL: http://crowdsec-service:8080
        metrics: true
        apiKeySecretRef:
          name: crowdsec-secret
          key: BOUNCER_KEY_ENVOY
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
