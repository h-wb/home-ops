---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name crowdsec-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        BOUNCER_KEY_ENVOY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: crowdsec-bouncer-key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: crowdsec-bouncer-key
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name crowdsec-console
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      data:
        ENROLL_KEY: "{{ .CROWDSEC_ENROLL_KEY }}"
  dataFrom:
    - extract:
        key: crowdsec
