---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: crowdsec
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.24.3
  url: oci://ghcr.io/crowdsecurity/helm-charts/crowdsec
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  interval: 1h
  install:
    disableSchemaValidation: true
  upgrade:
    disableSchemaValidation: true
  values:
    container_runtime: containerd
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
    config:
      simulation.yaml: |
        simulation: true
    lapi:
      envFrom:
        - secretRef:
            name: crowdsec-secret
      podAnnotations:
        secret.reloader.stakater.com/reload: crowdsec-secret,crowdsec-console
      env:
        - name: USE_WAL
          value: "true"
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-console
              key: ENROLL_KEY
              optional: true
        - name: ENROLL_INSTANCE_NAME
          value: home-ops-main
      persistentVolume:
        data:
          storageClassName: ceph-block
        config:
          storageClassName: ceph-block
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy-external
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy crowdsecurity/http-cve
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
