---
# The vMCP cannot authenticate its JWKS fetch (ToolHive drops the token path from its config)
# and Talos refuses anonymous JWKS reads, so this mirror re-serves the cluster's public signing
# keys in-namespace. Every ServiceAccount may read them (system:service-account-issuer-discovery).
# Whoever controls this pod can mint tier identities: only the vMCP may reach it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jwks-mirror
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwks-mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jwks-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jwks-mirror
    spec:
      serviceAccountName: jwks-mirror
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fetch
          image: docker.io/alpine/k8s:1.37.1
          command:
            - /bin/sh
            - -c
            - |
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              mkdir -p /www/openid/v1
              while true; do
                if curl -fsS --cacert "$sa/ca.crt" -H "Authorization: Bearer $(cat "$sa/token")" \
                    -o /www/openid/v1/jwks.tmp https://kubernetes.default.svc/openid/v1/jwks; then
                  mv /www/openid/v1/jwks.tmp /www/openid/v1/jwks
                fi
                sleep 300
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: www
              mountPath: /www
        - name: serve
          image: mirror.gcr.io/library/busybox:1.38
          command:
            - httpd
            - -f
            - -p
            - "8080"
            - -h
            - /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /openid/v1/jwks
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext: *securityContext
          volumeMounts:
            - name: www
              mountPath: /www
              readOnly: true
      volumes:
        - name: www
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jwks-mirror
spec:
  selector:
    app.kubernetes.io/name: jwks-mirror
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jwks-mirror
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jwks-mirror
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: proto-mcp
      ports:
        - port: 8080
          protocol: TCP
