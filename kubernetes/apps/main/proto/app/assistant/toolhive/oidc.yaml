---
# Tier identity = the Hermes pod's ServiceAccount token (projected, audience proto-mcp). The
# cluster issuer is the API VIP, not kubernetes.default.svc, so it is pinned along with the JWKS.
# The vMCP drops any JWKS token setting from its config and Talos refuses anonymous JWKS reads,
# so the keys come from the in-namespace mirror (jwks-mirror.yaml), over plain HTTP.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: proto-serviceaccounts
spec:
  type: inline
  inline:
    issuer: https://192.168.1.253:6443
    jwksUrl: http://jwks-mirror.proto.svc.cluster.local:8080/openid/v1/jwks
    jwksAllowPrivateIP: true
    insecureAllowHTTP: true
