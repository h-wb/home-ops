---
# Tier identity = the Hermes pod's ServiceAccount token (projected, audience proto-mcp). The
# cluster issuer is the API VIP, not kubernetes.default.svc, so it is pinned along with the JWKS.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: proto-serviceaccounts
spec:
  type: kubernetesServiceAccount
  kubernetesServiceAccount:
    issuer: https://192.168.1.253:6443
    jwksUrl: https://kubernetes.default.svc/openid/v1/jwks
    useClusterAuth: true
