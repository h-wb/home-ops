---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# The Obsidian vault for the private tier: the Belphemur headless-sync image keeps
# a pull-only copy in sync, and two Seekstone instances (each installing itself
# from the pinned lockfiles in tools/seekstone) serve it through ToolHive:
# read-only, and inbox-write.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # app-template OCIRepository, the way the other namespace trees get it via
  # components/common; proto builds its own namespace, so take the repos only.
  - ../../../../../../components/common/repos
  - ./pvc.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./seekstone.yaml
configMapGenerator:
  # Referenced by literal name inside the MCPServer CRs (kustomize cannot rewrite
  # references in arbitrary CRs), so the hash suffix stays off.
  - name: seekstone-src
    options:
      disableNameSuffixHash: true
    files:
      - package.json=./tools/seekstone/package.json
      - package-lock.json=./tools/seekstone/package-lock.json
