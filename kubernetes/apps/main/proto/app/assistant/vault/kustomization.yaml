---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# The Obsidian vault for the private tier: Obsidian Headless keeps a pull-only copy, and two
# Seekstone instances serve it through ToolHive (read-only, and inbox-write).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./tools
  - ./pvc.yaml
  - ./externalsecret.yaml
  - ./deployment.yaml
  - ./networkpolicy.yaml
  - ./seekstone.yaml
configMapGenerator:
  - name: obsidian-vault-scripts
    files:
      - ./sync.sh
      - ./syncprobe
