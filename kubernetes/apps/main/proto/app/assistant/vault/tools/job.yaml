---
# Reruns when the lockfiles or install.sh change (hashed ConfigMap name, Flux force).
apiVersion: batch/v1
kind: Job
metadata:
  name: obsidian-tools
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: install
          image: docker.io/library/node:26-bookworm-slim@sha256:add5c17c14752c54d2f3d519ec46a3815684d41c33f198bcb09fb998f7dcbf68
          command:
            - /bin/sh
            - /src/install.sh
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: tools
              mountPath: /tools
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: src
          configMap:
            name: obsidian-tools
        - name: tools
          persistentVolumeClaim:
            claimName: obsidian-tools
        - name: tmp
          emptyDir: {}
