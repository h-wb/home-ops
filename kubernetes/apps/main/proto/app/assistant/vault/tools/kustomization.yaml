---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./job.yaml
configMapGenerator:
  - name: obsidian-tools
    files:
      - ./install.sh
      - ob-package.json=./ob/package.json
      - ob-package-lock.json=./ob/package-lock.json
      - seekstone-package.json=./seekstone/package.json
      - seekstone-package-lock.json=./seekstone/package-lock.json
