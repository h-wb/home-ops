---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-vault
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: obsidian-vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obsidian-vault
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: docker.io/library/node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
          command:
            - /bin/sh
            - /scripts/sync.sh
          env:
            - name: HOME
              value: /data/state
            - name: XDG_CONFIG_HOME
              value: /data/state
            - name: OBSIDIAN_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: obsidian-headless
                  key: OBSIDIAN_AUTH_TOKEN
                  optional: true
            - name: OBSIDIAN_VAULT
              valueFrom:
                secretKeyRef:
                  name: obsidian-headless
                  key: OBSIDIAN_VAULT
                  optional: true
            - name: OBSIDIAN_VAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obsidian-headless
                  key: OBSIDIAN_VAULT_PASSWORD
                  optional: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - /scripts/syncprobe
                - "900"
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data/vault
              subPath: vault
            - name: data
              mountPath: /data/state
              subPath: state
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: obsidian-vault
        - name: tools
          persistentVolumeClaim:
            claimName: obsidian-tools
            readOnly: true
        - name: scripts
          configMap:
            name: obsidian-vault-scripts
        - name: tmp
          emptyDir: {}
