---
# Synthetic-data Memini for the general scope. Capture is off server-side and locked (MEMINI_CLIENT_DEFAULTS);
# the Hermes plugin's patched fallback also disables it when the handshake fails.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-proto-general-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        MEMINI_API_KEY: "{{ .admin }}"
        hermes: "{{ .hermes }}"
        api-keys.yaml: |
          keys:
            - name: hermes-general
              secret: "{{ .hermes }}"
              home: proto-general
              default_namespace: proto-general
              settings:
                capture: false
                capture_turns: false
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: memini-proto-general-keys
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: memini-proto-general-keys
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - admin
    - hermes
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini-proto-general
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 1h
  values:
    fullnameOverride: memini-proto-general
    controllers:
      main:
        containers:
          main:
            env:
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: proto-general
              MEMINI_UI_ADDR: ""
              MEMINI_UI_ENABLED: "false"
              MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-proto-general-secret
                    key: MEMINI_API_KEY
              MEMINI_CLIENT_DEFAULTS: '{"capture":false,"capture_turns":false}'
              MEMINI_EMBED_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              MEMINI_EMBED_MODEL: embed
              MEMINI_EMBED_DIMS: "768"
              MEMINI_EMBED_MAX_ITEM_CHARS: "5000"
              MEMINI_EMBED_MAX_BATCH: "8"
              MEMINI_EMBED_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-proto-memini
                    key: api-key
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      data:
        size: 1Gi
      api-keys:
        enabled: true
        name: memini-proto-general-secret
