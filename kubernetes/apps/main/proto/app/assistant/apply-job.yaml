---
# Applies openshell/ and hermes/ to the gateway (apply.sh). Flux recreates it when the generated
# ConfigMap name (content hash) or the pins below change; it has no Kubernetes API access.
apiVersion: batch/v1
kind: Job
metadata:
  name: openshell-apply
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch
          image: docker.io/alpine/k8s:1.37.1
          env:
            - name: OPENSHELL_VERSION
              value: 0.1.7
            - name: OPENSHELL_SHA256
              value: 5c1adfcae797eac9b2e8b9280c66c1f75e4e84d9e31ce6938c5b994314ef6098
          command:
            - /bin/sh
            - -ec
            - |
              curl -fsSLo /tmp/openshell.tgz "https://github.com/NVIDIA/OpenShell/releases/download/v$${OPENSHELL_VERSION}/openshell-x86_64-unknown-linux-musl.tar.gz"
              echo "$${OPENSHELL_SHA256}  /tmp/openshell.tgz" | sha256sum -c -
              tar -xzf /tmp/openshell.tgz -C /opt/bin openshell
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bin
              mountPath: /opt/bin
            - name: tmp
              mountPath: /tmp
      containers:
        - name: apply
          image: docker.io/alpine/k8s:1.37.1
          command:
            - /bin/sh
            - /config/apply.sh
          env:
            - name: HOME
              value: /home/apply
            - name: PATH
              value: /opt/bin:/usr/local/bin:/usr/bin:/bin
            - name: HERMES_IMAGE
              value: docker.io/nousresearch/hermes-agent:v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
            # eleboucher/memini-hermes "sync memini Hermes plugin v0.7.39"; the mirror is untagged.
            - name: MEMINI_PLUGIN_REF
              value: f81b1167713ab15028fd8e09eb832e2970b1b8fb
            - name: MEMINI_PLUGIN_SHA256
              value: a33ab53c4bdb54a3d62fcbf647b8909bd315865c361a1a188c31d4694cb65ee3
            - name: MEMINI_PLUGIN_YAML_SHA256
              value: 9df16985cbe9179fa03d0354d7f66de82c3a709b865dc6fa07a62564422a5f76
            # After the capture fallback patch; passes check_selective_memory.py.
            - name: MEMINI_PLUGIN_PATCHED_SHA256
              value: 64a206d5c5cc5c0d9a51e2db63a0122479851ed5a5facab57b680d868d7aa8e4
            - name: LITELLM_GENERAL_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-proto-hermes-general
                  key: api-key
            - name: LITELLM_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-proto-hermes-private
                  key: api-key
            - name: MEMINI_GENERAL_KEY
              valueFrom:
                secretKeyRef:
                  name: memini-proto-general-secret
                  key: hermes
            - name: MEMINI_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: memini-proto-private-secret
                  key: hermes
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext: *securityContext
          volumeMounts:
            - name: bin
              mountPath: /opt/bin
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: hermes-config
              mountPath: /hermes-config
            - name: client-tls
              mountPath: /etc/openshell-client-tls
              readOnly: true
            - name: home
              mountPath: /home/apply
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bin
          emptyDir: {}
        - name: home
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: openshell-apply
        - name: hermes-config
          persistentVolumeClaim:
            claimName: hermes-config
        - name: client-tls
          secret:
            secretName: openshell-client-tls
            defaultMode: 0440
