# The general scope's prototype Memini. A separate profile per scope, so a sandbox can only be
# granted the Memini endpoint of the provider it is attached to.
id: proto-memini-general
display_name: Memini general (proto)
description: Prototype Memini for the general scope
category: knowledge
credentials:
  - name: api_key
    description: Memini key for hermes-general
    env_vars: [MEMINI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: memini-proto-general.proto.svc.cluster.local
    port: 8080
    # API paths only: keeps the key off the service's admin endpoints.
    path: /v1/**
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/opt/hermes/tools/python-3.14.9+20261021-linux-x64/bin/python3.14]
