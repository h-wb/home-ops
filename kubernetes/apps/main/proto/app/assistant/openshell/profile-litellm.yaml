# LiteLLM for the prototype sandboxes. Each scope's provider instance holds that scope's virtual key;
# LiteLLM's key allowlist decides the models. Only Hermes's Python may send it, and only here.
# The interpreter path is tied to the pinned Hermes image.
id: proto-litellm
display_name: LiteLLM (proto)
description: In-cluster LiteLLM proxy, scoped virtual key
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: LiteLLM virtual key for one scope
    env_vars: [LITELLM_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: litellm.llm.svc.cluster.local
    port: 4000
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/opt/hermes/tools/python-3.14.9+20261021-linux-x64/bin/python3.14]
