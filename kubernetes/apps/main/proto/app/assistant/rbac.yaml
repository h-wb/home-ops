---
# The general Paseo ACP bridge: `kubectl exec -i hermes-general-0 -- hermes acp`. Exec only, into
# the general Hermes only: private Hermes reads the real vault, and its answers must never reach
# a general (Claude) session. Whoever execs here can read the general tier's keys.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paseo-hermes-general-exec
rules:
  - apiGroups:
      - ""
    resources:
      - pods/exec
    resourceNames:
      - hermes-general-0
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paseo-hermes-general-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paseo-hermes-general-exec
subjects:
  - kind: ServiceAccount
    name: paseo
    namespace: agents
