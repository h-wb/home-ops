---
# The general Hermes may reach DNS, LiteLLM (its key picks the models), the general Memini and the general ToolHive VMCP; nothing
# else, and nothing may connect to it (Paseo uses the API server's exec, not the pod network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
      assistant.scope: general
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini-proto-general
      ports:
        - port: 8080
          protocol: TCP
    - to:
        # The general VMCP only: private-tier servers live behind vmcp-mcp-gateway,
        # and this policy is what stops the general pod from reaching them.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: mcp-ops
      ports:
        - port: 4483
          protocol: TCP
---
# Only the general Hermes may reach the general Memini.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memini
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: memini-proto-general
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes
              assistant.scope: general
      ports:
        - port: 8080
          protocol: TCP
