---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# The general tier: the base plus its keys, managed config and network boundary.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -general
labels:
  - pairs:
      assistant.scope: general
    includeTemplates: true
resources:
  - ../base
  - ./networkpolicy.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - ./config.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: hermes
      spec:
        selector:
          matchLabels:
            assistant.scope: general
        template:
          spec:
            containers:
              - name: hermes
                env:
                  - name: LITELLM_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-proto-hermes-general
                        key: api-key
                  - name: MEMINI_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: memini-proto-general-secret
                        key: hermes
                  - name: MEMINI_BASE_URL
                    value: http://memini-proto-general.proto.svc.cluster.local:8080
                  - name: MEMINI_NAMESPACE
                    value: proto-general
