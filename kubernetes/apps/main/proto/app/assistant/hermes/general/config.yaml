# General tier: any model (Claude included once it has a LiteLLM route); Mistral for now.
# Mounted read-only at /etc/hermes (Hermes managed scope), so it wins over anything the agent
# writes to $HERMES_HOME. The doubled dollar is Flux's escape; Hermes expands the reference from
# the pod env (the tier's LiteLLM virtual key).
model:
  default: mistral/mistral-small-latest
  provider: litellm
providers:
  litellm:
    base_url: http://litellm.llm.svc.cluster.local:4000/v1
    api_key: $${LITELLM_API_KEY}
auxiliary:
  compression:
    provider: litellm
    model: mistral/mistral-small-latest
  session_search:
    provider: litellm
    model: mistral/mistral-small-latest
  approval:
    provider: litellm
    model: mistral/mistral-small-latest
memory:
  provider: memini
  memory_enabled: false
  user_profile_enabled: false
approvals:
  mode: manual
security:
  redact_secrets: true
agent:
  disabled_toolsets:
    - cronjob # routines come from versioned definitions, not the agent
    - catalog
    - connections
    - kanban
mcp_servers:
  # The general VMCP (llm/toolhive/config), reached in-cluster: the same endpoint the
  # general Paseo tier takes through Envoy. This pod's egress (networkpolicy.yaml)
  # pins it to mcp-ops, whose tool list is what this tier may call, not this file.
  tools:
    url: http://vmcp-mcp-ops.llm.svc.cluster.local:4483/mcp
