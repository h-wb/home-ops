---
# The private Hermes may reach DNS, LiteLLM (its key picks the models) and the private Memini; nothing
# else, and nothing may connect to it (Paseo uses the API server's exec, not the pod network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
      assistant.scope: private
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: memini-proto-private
      ports:
        - port: 8080
          protocol: TCP
---
# Only the private Hermes may reach the private Memini.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memini
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: memini-proto-private
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes
              assistant.scope: private
      ports:
        - port: 8080
          protocol: TCP
