---
# One Hermes daemon per tier (overlays ../general, ../private). The pod is disposable compute:
# its only credentials are the tier's LiteLLM key and Memini key, its egress is the tier's
# NetworkPolicy, and everything it must not change is read-only (root filesystem, /etc/hermes
# managed config, the Memini plugin). Paseo talks to it with `kubectl exec ... hermes acp`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
spec:
  replicas: 1
  serviceName: hermes
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The pause container becomes PID 1 and reaps Hermes's exited children (no s6 init).
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Hermes refuses ACP sessions unless HERMES_HOME belongs to its user, and kubelet would
        # create the plugin mount's parents as root; make them as the Hermes user first.
        - name: home
          image: mirror.gcr.io/library/busybox:1.38
          command:
            - mkdir
            - -p
            - /data/hermes/plugins/memini
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent:v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
          # The image's s6 init needs root; the gateway itself does not. The tier's
          # ToolHive endpoint is anonymous in-cluster (llm VMCP), so the pod needs no
          # ServiceAccount token or other MCP credential: egress policy and the
          # gateway's tool lists decide what it can reach and call.
          command:
            - /bin/sh
            - -c
            - exec /opt/hermes/bin/hermes gateway run
          env:
            - name: HERMES_HOME
              value: /data/hermes
            - name: HOME
              value: /data/hermes
            - name: TZ
              value: Europe/Paris
            # Fail fast: the NetworkPolicy silently drops internet traffic, so Hermes's update
            # and model-catalog checks each waited out a TCP timeout (about 20 s per new
            # session). A closed local port refuses at once; in-cluster names bypass it.
            - name: HTTPS_PROXY
              value: http://127.0.0.1:9
            - name: HTTP_PROXY
              value: http://127.0.0.1:9
            - name: https_proxy
              value: http://127.0.0.1:9
            - name: http_proxy
              value: http://127.0.0.1:9
            - name: NO_PROXY
              value: .svc.cluster.local,.svc,localhost,127.0.0.1
            - name: no_proxy
              value: .svc.cluster.local,.svc,localhost,127.0.0.1
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1536Mi
          securityContext: *securityContext
          volumeMounts:
            - name: data
              mountPath: /data
            # Hermes managed scope: wins over anything the agent writes to its config.yaml.
            - name: config
              mountPath: /etc/hermes
              readOnly: true
            # Memini is not a bundled provider, so it must sit under HERMES_HOME; mounted
            # read-only, so the agent can neither edit nor replace it.
            - name: plugins
              mountPath: /data/hermes/plugins/memini
              subPath: memini
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # Paseo's entry point: `python /opt/hermes-acp/shim.py` (maps Paseo's cwd).
            - name: acp-shim
              mountPath: /opt/hermes-acp
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hermes-config
        - name: plugins
          persistentVolumeClaim:
            claimName: hermes-plugins
            readOnly: true
        - name: tmp
          emptyDir: {}
        - name: acp-shim
          configMap:
            name: hermes-acp-shim
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-block
        resources:
          requests:
            storage: 2Gi
