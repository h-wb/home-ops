---
# One key per scope; the model allowlist lives here, not in the sandboxes.
# General runs Mistral only until step 3 (general Hermes on the subscription plugin).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: proto-hermes-general
spec:
  proxyRef: litellm
  proxyNamespace: llm
  keyAlias: Proto Hermes general
  secretName: litellm-proto-hermes-general
  secretKey: api-key
  models:
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: proto-hermes-private
spec:
  proxyRef: litellm
  proxyNamespace: llm
  keyAlias: Proto Hermes private
  secretName: litellm-proto-hermes-private
  secretKey: api-key
  models:
    - mistral/mistral-small-latest
    - mistral/mistral-medium-latest
    - mistral/mistral-large-latest
---
# Embeddings for both prototype Memini instances.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: proto-memini
spec:
  proxyRef: litellm
  proxyNamespace: llm
  keyAlias: Proto Memini
  secretName: litellm-proto-memini
  secretKey: api-key
  models:
    - embed
