---
# OpenShell CLI with the chart-generated mTLS client bundle mounted, so operators drive the
# gateway with `kubectl exec` without copying key material out of the cluster.
# StatefulSet for the stable pod name the exec Role is scoped to.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openshell-cli
spec:
  replicas: 1
  serviceName: openshell-cli
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell-cli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell-cli
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch
          image: docker.io/alpine/k8s:1.37.1
          env:
            - name: OPENSHELL_VERSION
              value: 0.1.7
            # Release asset digest of openshell-x86_64-unknown-linux-musl.tar.gz.
            - name: OPENSHELL_SHA256
              value: 5c1adfcae797eac9b2e8b9280c66c1f75e4e84d9e31ce6938c5b994314ef6098
          command:
            - /bin/sh
            - -ec
            - |
              curl -fsSLo /tmp/openshell.tgz "https://github.com/NVIDIA/OpenShell/releases/download/v${OPENSHELL_VERSION}/openshell-x86_64-unknown-linux-musl.tar.gz"
              echo "${OPENSHELL_SHA256}  /tmp/openshell.tgz" | sha256sum -c -
              tar -xzf /tmp/openshell.tgz -C /opt/bin openshell
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bin
              mountPath: /opt/bin
            - name: tmp
              mountPath: /tmp
      containers:
        - name: cli
          image: docker.io/alpine/k8s:1.37.1
          command:
            - /bin/sh
            - -c
            - exec sleep infinity
          env:
            - name: HOME
              value: /home/cli
            - name: PATH
              value: /opt/bin:/usr/local/bin:/usr/bin:/bin
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext: *securityContext
          volumeMounts:
            - name: bin
              mountPath: /opt/bin
              readOnly: true
            - name: home
              mountPath: /home/cli
            # Where the CLI looks for the bundle of a gateway registered as `proto`.
            - name: client-tls
              mountPath: /home/cli/.config/openshell/gateways/proto/mtls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bin
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: client-tls
          secret:
            secretName: openshell-client-tls
            defaultMode: 0400
