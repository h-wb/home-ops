---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openshell
spec:
  chartRef:
    kind: OCIRepository
    name: openshell
  interval: 1h
  values:
    # The chart's API-discovery check fails offline renders (flate pre-push); the Sandbox CRD
    # ships in this same Flux Kustomization, which applies CRDs before the HelmRelease.
    agentSandbox:
      preflight:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    server:
      # Anonymous telemetry from the gateway and every supervisor; off for the prototype.
      telemetryEnabled: false
      # Sandboxes are created in the release namespace (proto).
      drivers:
        kubernetes:
          # Lets a sandbox template pin its pod to a node (node_selector) for the preflight.
          allowDriverConfig: true
    gatewayConfig:
      openshell.drivers.kubernetes:
        # Templates may set the scope label that the prototype's network policies select on.
        allowed_pod_labels:
          - assistant.scope
