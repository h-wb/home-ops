---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# OpenShell's Kubernetes driver needs the SIG Agent Sandbox controller; its chart does not install it.
# Core release only: OpenShell keeps templates in its gateway, so the extension CRDs are unused.
# Hardening patch from jfroy/flatops, so the controller meets the restricted Pod Security Standard.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # renovate: datasource=github-releases depName=kubernetes-sigs/agent-sandbox
  - https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v1.0.9/sandbox.yaml
patches:
  - target:
      group: apps
      kind: Deployment
      name: agent-sandbox-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-sandbox-controller
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              fsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: agent-sandbox-controller
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: tmp
                emptyDir:
                  medium: Memory
                  sizeLimit: 64Mi
