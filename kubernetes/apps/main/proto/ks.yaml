---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Lives in flux-system rather than proto so pruning can delete the proto namespace itself.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proto
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: proto
  interval: 30m
  path: ./kubernetes/apps/main/proto/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: false
