---
# Yields a Secret of the same name holding a talosconfig, so jobs can run
# `talosctl image pull`. The namespace is allow-listed in the Talos machine
# config (kubernetesTalosAPIAccess).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: home-ops-runner
spec:
  roles:
    - os:admin
