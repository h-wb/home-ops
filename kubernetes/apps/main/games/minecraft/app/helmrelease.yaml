---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: minecraft
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.2.0
  url: oci://ghcr.io/itzg/minecraft-server-charts/minecraft
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: minecraft
  dependsOn: []
  values:
    fullnameOverride: *app
    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.10.0@sha256:5a2ab74ae179c11e2dbbce67f307cdcf2c1257b3abb0f654d3a310b3d8ea57da
    resources:
      requests:
        cpu: 200m
        memory: 3Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    livenessProbe:
      initialDelaySeconds: 30
    readinessProbe:
      initialDelaySeconds: 30
    startupProbe:
      enabled: true
    extraEnv:
      TZ: Europe/Paris
    persistence:
      dataDir:
        enabled: true
        existingClaim: *app
    serviceAnnotations:
      mc-router.itzg.me/externalServerName: mc.${SECRET_DOMAIN}
    minecraftServer:
      autopauseTimeoutEst: 600
      autopauseTimeoutInit: 300
      difficulty: normal
      enableAutopause: true
      enableWhitelist: true
      eula: true
      forceGamemode: true
      maxBuildHeight: 320
      maxTickTime: -1
      maxWorldSize: 29999984
      memory: 3G
      mode: survival
      motd: "Chocoboco - Minecraft Server"
      ops: "Sahru"
      overrideIcon: true
      serverName: Chocoboco
      skipSudo: true
      spawnProtection: 0
      spigetResources:
        - 36618
      type: PAPER
      version: "26.2"
      viewDistance: 12
      whitelist: "Sahru"
      modrinth:
        projects:
          # - Cz6msz34 # AxGraves
          # - pZ2wrerK # Emotecraft
          # - fALzjamp # Chunky
          # - OhduvhIc # Veinminer
          # - J6U9o3JG # HuskHomes
          # - z4mHgUYG # InteractionVisualizer
          # - MwLGimob # TabListPing
          # - IahtO7tM # Clumps
          # - iOwOrlzi # xpDisplay
          - swbUV1cr # BlueMap
          # - Zjb20YAx # Xaero Map Spigot
        # Specifies whether to download Modrinth dependencies. The allowed values are: none, required, optional
        downloadDependencies: required
        # The version type is used to determine the newest version to use from each project. The allowed values are: release, beta, alpha
        allowedVersionType: release
      rcon:
        enabled: true
      serviceType: ClusterIP
      extraPorts:
        - name: map
          containerPort: 8100
          protocol: TCP
          service:
            enabled: true
            embedded: false
            type: ClusterIP
            port: 8100
  valuesFrom:
    - kind: Secret
      name: minecraft-secret
      valuesKey: RCON_PASSWORD
      targetPath: minecraftServer.rcon.password
