---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smart-life-webapp
spec:
  interval: 1h
  # The build initContainer clones+builds the SPA from scratch on every pod
  # start; on slower edge hardware this alone can take ~6m, well past
  # helm-controller's 5m default install/upgrade timeout.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      smart-life-webapp:
        replicas: ${REPLICAS:=1}
        strategy: RollingUpdate
        initContainers:
          # No upstream image or Dockerfile exists for this project, so we build the
          # static SPA from a pinned commit on every pod start and hand the output to
          # the static-web-server container below over a shared emptyDir.
          build:
            image:
              repository: docker.io/library/node
              tag: 24-alpine
            env:
              HOME: /tmp
            # Pinned commit (not a $VAR, since Flux postBuild.substitute rewrites
            # any ${...} pattern in this manifest via envsubst).
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /tmp/src
                wget -qO /tmp/src.tar.gz "https://github.com/qoomon/smart-life-webapp/archive/28676c8bb68309918a1a4c38a947024a944f2115.tar.gz"
                tar -xzf /tmp/src.tar.gz -C /tmp/src --strip-components=1
                cd /tmp/src
                sed -i 's#"publicPath": "/smart-life-webapp/"#"publicPath": "/"#' package.json
                npm ci --no-audit --no-fund
                npm run build
                cp -r dist/. /public/
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
        containers:
          app:
            image:
              repository: docker.io/joseluisq/static-web-server
              tag: 2-alpine
            env:
              SERVER_ROOT: /public
              SERVER_PORT: &port 8080
              SERVER_HEALTH: "true"
              SERVER_FALLBACK_PAGE: /public/index.html
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Smart Life
          gethomepage.dev/icon: mdi-home-automation
          gethomepage.dev/description: Control Smart Life / Tuya devices
        hostnames:
          - "${SUBDOMAIN}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      web:
        type: emptyDir
        globalMounts:
          - path: /public
