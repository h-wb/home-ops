---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: nextcloud
spec:
  interval: 30m
  timeout: 60s
  url: oci://ghcr.io/nextcloud/helm/nextcloud
  ref:
    tag: 9.2.6
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name nextcloud
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: nextcloud
  dependsOn: []
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    global:
      image:
        registry: mirror.gcr.io
    image:
      flavor: fpm-alpine
    nextcloud:
      host: nextcloud.${SECRET_DOMAIN}
      existingSecret:
        enabled: true
        secretName: nextcloud-secret
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
      datadir: /var/www/html/data
      mail:
        enabled: false
      configs:
        local.config.php: |-
          <?php
          $CONFIG = array (
            'dbhost' => 'postgres-nextcloud-rw.default.svc:5432',
            'dbpassword' => getenv('POSTGRES_PASSWORD'),
            'trusted_proxies' =>
            array (
              0 => '127.0.0.1',
              1 => '10.42.0.0/16',
              2 => '10.43.0.0/16',
            ),
            'trusted_domains' =>
            array (
              0 => 'nextcloud',
              1 => 'nextcloud.${SECRET_DOMAIN}',
            ),
            'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
            'overwrite.cli.url' => 'https://nextcloud.${SECRET_DOMAIN}',
            'overwriteprotocol' => 'https',
            'default_phone_region' => 'FR',
            'maintenance_window_start' => 20,
            'check_data_directory_permissions' => false,
            'skeletondirectory' => '',
          );
      extraVolumes:
        - name: nfs-tank
          nfs:
            server: ${NFS_ADDR}
            path: /mnt/tank/hwe
      extraVolumeMounts:
        - name: nfs-tank
          mountPath: /mnt/tank/hwe
      extraEnv:
        - name: REDIS_HOST
          value: nextcloud-dragonfly.default.svc.cluster.local
        - name: REDIS_HOST_PORT
          value: "6379"
      # Stock image ships pm.max_children: 5, which saturates from baseline
      # sync/heartbeat traffic alone - each public-share download also holds
      # a worker for its entire transfer (no X-Accel-Redirect offload to
      # nginx), so a handful of concurrent downloads exhausts the pool
      # entirely, including the worker nginx needs to answer its own
      # status.php health check - causing nginx to fail probes and get
      # killed/restarted by kubelet under load.
      phpConfigs:
        zzz-pool.conf: |
          [www]
          pm = dynamic
          pm.max_children = 30
          pm.start_servers = 6
          pm.min_spare_servers = 3
          pm.max_spare_servers = 12
          pm.max_requests = 500
      # www-data (fpm-alpine's image uid) - existing data is already
      # group-writable by gid 82, so this doesn't need a recursive chown.
      securityContext:
        runAsUser: 82
        runAsGroup: 82
        runAsNonRoot: true
      podSecurityContext:
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
    nginx:
      enabled: true
      image:
        repository: mirror.gcr.io/library/nginx
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 128Mi
      config:
        headers:
          Strict-Transport-Security: "max-age=15552000; includeSubDomains; preload;"
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: postgres-nextcloud-rw.default.svc:5432
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: postgres-nextcloud-app
        usernameKey: username
        passwordKey: password
    cronjob:
      enabled: true
      # Real CronJob instead of a crond sidecar riding along in the main
      # pod for the pod's whole life - crond needs root, `php cron.php`
      # doesn't, so this also drops to non-root.
      type: cronjob
      cronjob:
        securityContext:
          runAsUser: 82
          runAsGroup: 82
          runAsNonRoot: true
        # config PVC is RWO - the cron pod must land on the same node as
        # the main deployment pod to mount it.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - nextcloud
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - app
                topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
    startupProbe:
      enabled: true
    # Sized for pm.max_children: 30 above (~100-150Mi RSS/worker under load).
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        memory: 3Gi
    persistence:
      enabled: true
      existingClaim: *name
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data
        accessMode: ReadWriteMany
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: *name
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud
              spec:
                template:
                  spec:
                    hostUsers: false
