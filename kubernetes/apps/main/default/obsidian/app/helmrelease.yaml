---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app obsidian
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        # Electron's own sandbox needs syscalls the default profile blocks;
        # linuxserver's docs call for this on their Electron-based images.
        seccompProfile:
          type: Unconfined
    controllers:
      obsidian:
        replicas: 1
        # A desktop holds unsaved state; never run two against one RWO volume.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/obsidian
              tag: 1.13.7
            env:
              TZ: Europe/Paris
              # Same uid/gid the other apps use on the hwe share, so the vault
              # is writable over NFS. s6 drops to this after its root init.
              PUID: "1000"
              PGID: "1000"
              TITLE: Obsidian
              # No CUSTOM_USER/PASSWORD: authentication is delegated to the
              # kanidm SecurityPolicy on the HTTPRoute (components/oidc/envoy).
              # The GUI has passwordless sudo, so this must never be exposed
              # without that policy in front of it.
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: obsidian
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Obsidian
          gethomepage.dev/icon: obsidian.png
          gethomepage.dev/description: Remote Obsidian
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # Obsidian's own config, plugins and Sync login state. The vault itself
      # is on NFS below, so this stays small.
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      vault:
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/hwe
        globalMounts:
          - path: /vault
            subPath: Documents/Vault
      # The Selkies stream and Chromium both want real shared memory; the 64Mi
      # default /dev/shm shows up as crashes and blank frames.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
