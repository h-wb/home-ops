---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dawarich
spec:
  releaseName: dawarich
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      dawarich:
        containers:
          app: &dawarich
            image:
              repository: mirror.gcr.io/freikin/dawarich
              tag: 1.14.2@sha256:5de477cfc6f8d9d19d7660c262acb196ea8a15cebbcbb7db173e04a2860f3bb5
            env:
              TIME_ZONE: "Europe/Paris"
              PHOTON_API_HOST: photon.default.svc.cluster.local:2322
              PHOTON_API_USE_HTTPS: false
              SELF_HOSTED: "true"
              STORE_GEODATA: "true"
              DISTANCE_UNIT: km
              APPLICATION_HOSTS: "dawarich.${SECRET_DOMAIN}"
              REDIS_URL: redis://dawarich-dragonfly.default.svc.cluster.local:6379
              RAILS_ENV: production
              DATABASE_NAME: *app
              DATABASE_PORT: 5432
              DATABASE_HOST: postgres-dawarich-rw.default.svc
              DATABASE_USERNAME: *app
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-dawarich-app
                    key: password
            envFrom:
              - secretRef:
                  name: dawarich-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 3000
              readiness: *probe
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "4Gi"
                cpu: "3000m"
            command:
              - "web-entrypoint.sh"
            args:
              - "bin/rails"
              - "server"
              - "-p"
              - "3000"
              - "-b"
              - "0.0.0.0"
          sidekiq:
            <<: *dawarich
            command:
              - "sidekiq-entrypoint.sh"
            args:
              - "sidekiq"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            securityContext: *securityContext
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "6Gi"
                cpu: "3000m"
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Dawarich
          gethomepage.dev/icon: google-maps.png
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: dawarich
        globalMounts:
          - path: /var/app/public
            subPath: public
          - path: /var/app/storage
            subPath: storage
      watched:
        type: emptyDir
        globalMounts:
          - path: /var/app/tmp/imports/watched
      shared-backups:
        # Same NFS share the prefect worker mounts at /root/.prefect/data
        # (kubernetes/apps/main/automation/prefect/app/helmrelease.yaml),
        # just this one subdirectory — lets a Prefect flow trigger a full
        # account export (via rails-runner exec) and then read the result
        # straight off this mount, no file transfer needed. Deliberately
        # NOT the same PVC as `data` above: that one is Ceph RBD
        # (ReadWriteOnce, single-mounter), so it can't be shared
        # cross-namespace the way NFS can.
        enabled: true
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/hwe/Documents/data/dawarich/backups
        globalMounts:
          - path: /var/app/tmp/shared-backups
