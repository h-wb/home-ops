---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich-ops
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: dawarich-ops-secret
    template:
      engineVersion: v2
      data:
        DAWARICH_API_KEY: "{{ .DAWARICH_API_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dawarich-regression-git
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        username: git
        password: "{{ .REGRESSION_REPO_TOKEN }}"
  dataFrom:
    - extract:
        key: dawarich
