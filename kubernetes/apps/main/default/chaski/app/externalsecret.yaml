---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name chaski
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: chaski-secret
    template:
      engineVersion: v2
      data:
        # Reuses the same Pushover application already used for Alertmanager
        # (kube-prometheus-stack/app/externalsecret.yaml) rather than
        # requiring separate per-app Pushover application tokens. Split this
        # out later if you want *arr notifications on their own Pushover app.
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
  dataFrom:
    - extract:
        key: pushover
