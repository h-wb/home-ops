---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-gpt
spec:
  interval: 1h
  dependsOn: []
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      paperless-gpt:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/icereed/paperless-gpt
              tag: v0.27.0@sha256:855d9df5bacb2bed60bd520f1ffe0d118695aef9f77d37466ae85823001f547d
            env:
              TZ: Europe/Paris
              PUID: "1000"
              PGID: "1000"
              PAPERLESS_BASE_URL: http://paperless.default.svc.cluster.local:8000
              # LLM Configuration
              LLM_LANGUAGE: English
              LLM_PROVIDER: openai
              OPENAI_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              LLM_MODEL: local
              OCR_PROVIDER: llm
              VISION_LLM_PROVIDER: openai
              VISION_LLM_MODEL: local
              # Document Processing Settings
              # Metadata suggestions are paperless-ngx's own AI now; paperless-gpt is
              # kept solely for LLM OCR, which paperless only supports via Azure AI.
              AUTO_GENERATE_TITLE: false
              AUTO_GENERATE_TAGS: false
              AUTO_GENERATE_CORRESPONDANTS: false
              AUTO_GENERATE_DOCUMENT_TYPE: false
              AUTO_GENERATE_CREATED_DATE: false
              # Tagging Settings
              AUTO_TAG: _paperless-gpt_auto_
              AUTO_OCR_TAG: _paperless-gpt_ocr-auto_
              MANUAL_TAG: _paperless-gpt_manual_
              # OCR Settings
              OCR_LIMIT_PAGES: 50
              OCR_PROCESS_MODE: image
              # Pages are rasterised concurrently, so peak memory is a whole batch of
              # them at once. At the 600 DPI default a Letter page is 5100x6600 (~134MB
              # of RGBA) and a six-page document peaked at 1149Mi, over the old limit.
              # 300 DPI quarters that to 271Mi measured, and costs nothing: qwen3-vl
              # downsamples to ~1M pixels, so 33.7Mpx was 33x more than it can read.
              IMAGE_MAX_RENDER_DPI: 300
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 10m
              limits:
                # Headroom for a long document: rasterisation runs one page per core,
                # so the ceiling is GOMAXPROCS (16 on tal1s) x ~34MB at 300 DPI, not
                # OCR_LIMIT_PAGES.
                memory: 1536Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          paperless-gpt:
            app:
              - path: /app/db
                subPath: db
              - path: /app/prompts
                subPath: prompts
      tmpfs:
        type: emptyDir
        advancedMounts:
          paperless-gpt:
            app:
              - path: /app/config
                subPath: config
              - path: /tmp
                subPath: tmp
