---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.1.3
            env:
              # Application
              #PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              PAPERLESS_PORT: "8000"
              PAPERLESS_TIME_ZONE: Europe/Paris
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              # Folder Importer
              CONSUMER_POLLING_INTERVAL: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Database
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME: "{{ .Release.Name }}"
              PAPERLESS_DBHOST: "postgres-{{ .Release.Name }}-rw.default.svc"
              PAPERLESS_DBUSER: "{{ .Release.Name }}"
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: "postgres-{{ .Release.Name }}-app"
                    key: password
              # Remote User Auth
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "false"
              # Folders
              PAPERLESS_CONSUMPTION_DIR: /data/paperless/consume
              PAPERLESS_DATA_DIR: /data/paperless/data
              PAPERLESS_EXPORT_DIR: /data/paperless/export
              PAPERLESS_MEDIA_ROOT: /data/paperless/media
              # OCR
              PAPERLESS_OCR_LANGUAGES: fra eng
              PAPERLESS_OCR_LANGUAGE: fra
              # Tesseract is not invoked at all: it was producing near-empty text on
              # these scans (3 characters on a handwritten page), and the local vision
              # model does the job properly. PDFs that already carry a text layer are
              # still read with pdftotext, so only image-based documents are affected —
              # those land with empty content, which trips the "OCR rescue" workflow
              # and hands them to paperless-gpt.
              PAPERLESS_OCR_MODE: "off"
              # AI (paperless-ngx 3.x native): suggestions + RAG document chat, served
              # by litellm which fronts LM Studio on the MacBook. Remote OCR is not
              # configured here because paperless only supports Azure AI for that;
              # LLM OCR against the local model stays with paperless-gpt.
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_BACKEND: openai-like
              PAPERLESS_AI_LLM_ENDPOINT: http://litellm.llm.svc.cluster.local:4000/v1
              PAPERLESS_AI_LLM_MODEL: local
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: openai-like
              PAPERLESS_AI_LLM_EMBEDDING_MODEL: embed
              # Matches the context LM Studio loads the model with.
              PAPERLESS_AI_LLM_CONTEXT_SIZE: "32768"
              # A page through a local vision model takes tens of seconds; the 
              # default timeout is tuned for hosted APIs.
              PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "300"
              # Redis
              PAPERLESS_REDIS: "redis://paperless-dragonfly.default.svc.cluster.local:6379"
              # User Permissions
              USERMAP_GID: "65542"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 15m
              limits:
                memory: 4096Mi
    service:
      app:
        ports:
          http:
            port: &port 8000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Paperless
          gethomepage.dev/icon: paperless.png
          gethomepage.dev/description: Document OCR Software
          gethomepage.dev/widget.type: paperlessngx
          gethomepage.dev/widget.url: http://paperless.default:8000
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}` }}"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data/local
      media:
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/hwe
        globalMounts:
          - path: /data/paperless/media
            subPath: Documents/Paperless/media
