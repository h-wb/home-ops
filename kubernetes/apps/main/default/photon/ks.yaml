---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app photon
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No kopiur backup: photon's PVC is a rebuildable search index (downloaded
  # from the upstream planet dataset, not user data). A kopiur snapshot of
  # this 260Gi/58GB+ volume was also actively harmful during the index
  # download - snapshotting mid-download produced a broken clone that hung
  # the mover job for 1h+ during the 2026-08-20/21 kopiur-controller
  # incident. Worst case on data loss is re-downloading, which is
  # preferable to carrying that risk for data with no backup value.
  interval: 30m
  path: ./kubernetes/apps/main/default/photon/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false # no flux ks dependents

