---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app photon
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/kopiur/backup
  # TODO(2026-08-20): kopiur backups for photon are suspended LIVE (out-of-band,
  # not tracked here) while it re-downloads its ~58GB planet index after the
  # kopiur-controller incident (see project memory: kopiur-controller was
  # scaled to 0 with no Git record, backlog burst on resume fenced several
  # apps' RBD volumes, including photon's). Taking a snapshot mid-download was
  # producing a broken clone that hung the mover job for 1h+.
  # Resume once the download completes:
  #   kubectl -n default patch snapshotschedule.kopiur.home-operations.com photon \
  #     --type merge -p '{"spec":{"schedule":{"suspend":false}}}'
  interval: 30m
  path: ./kubernetes/apps/main/default/photon/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      KOPIUR_SCHEDULE: "12 * * * *"
      KOPIUR_CAPACITY: 260Gi
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false # no flux ks dependents

