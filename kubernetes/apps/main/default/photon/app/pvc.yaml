---
# yaml-language-server: $schema=https://json.schemastore.org/persistentvolumeclaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 300Gi # old index + download + extracted new index peak ~245G during PARALLEL update
  storageClassName: ceph-block
