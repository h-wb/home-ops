---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: code-server
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: code-server-secret
    template:
      engineVersion: v2
      data:
        # The owner's Proton Pass token for this pod (never the Paseo pods'):
        # the dotfiles' default session reads PASS_CLI_PAT, repos' `pass:login`
        # PROTON_PASS_TOKEN. Optional: without it the pod provisions without
        # secrets and picks them up on the restart Reloader does once it exists.
        PASS_CLI_PAT: '{{ index . "PROTON_PASS_TOKEN" | default "" | trim }}'
        PROTON_PASS_TOKEN: '{{ index . "PROTON_PASS_TOKEN" | default "" | trim }}'
  dataFrom:
    - extract:
        key: code-server
