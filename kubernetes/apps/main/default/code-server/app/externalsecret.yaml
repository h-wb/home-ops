---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: code-server
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: code-server-secret
    template:
      engineVersion: v2
      data:
        # The owner's Proton Pass token for this pod (never the Paseo pods'),
        # for the dotfiles' bootstrap and repos' `pass:login`. Optional: without
        # it the pod provisions without secrets and picks them up on the
        # restart Reloader does once it exists.
        PROTON_PASS_TOKEN: '{{ index . "PROTON_PASS_TOKEN" | default "" | trim }}'
  dataFrom:
    - extract:
        key: code-server
