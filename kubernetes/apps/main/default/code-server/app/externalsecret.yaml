---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: code-server
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: code-server-secret
    template:
      engineVersion: v2
      data:
        # Stored base64-encoded in Bitwarden so the multi-line kubeconfig
        # survives the JSON round-trip the BWS provider does on `extract`.
        config: "{{ .KUBECONFIG | b64dec }}"
  dataFrom:
    - extract:
        key: code-server
