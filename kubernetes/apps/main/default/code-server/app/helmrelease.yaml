---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app code-server
spec:
  interval: 1h
  # Above the init container's own limit: a first bootstrap installs every
  # tool, and a shorter wait would roll the upgrade back mid-install.
  timeout: 65m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      code-server:
        # One pod on the home volume: two bootstraps must never run at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # At every start, before the editor: components/dotfiles does the rest.
          bootstrap:
            image: &image
              repository: ghcr.io/coder/code-server
              tag: 4.146.0
            command: ["/bin/sh", "/opt/dotfiles/dotfiles-bootstrap"]
            env: &env
              HOME: /home/coder
              TZ: Europe/Paris
              # The image's mise first: the shims point at it.
              PATH: /opt/mise/usr/local/bin:/home/coder/.local/share/mise/shims:/home/coder/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            envFrom: &envFrom # Optional, like the token in it: the pod starts without it.
              - secretRef:
                  name: code-server-secret
                  optional: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        containers:
          app:
            image: *image
            args:
              # No password: authentication is delegated to the kanidm
              # SecurityPolicy on the HTTPRoute (components/oidc/envoy).
              - --auth
              - none
              - --bind-addr
              - 0.0.0.0:8080
              - --disable-telemetry
              - --disable-update-check
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: code-server
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Code Server
          gethomepage.dev/icon: code-server.png
          gethomepage.dev/description: VS Code
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: /home/coder
      # At or above the dotfiles' min_version.
      mise:
        type: image
        image:
          repository: ghcr.io/jdx/mise
          tag: 2026.11.14-debian
        globalMounts:
          - path: /opt/mise
            readOnly: true
      dotfiles:
        type: configMap
        name: code-server-dotfiles
        advancedMounts:
          code-server:
            bootstrap:
              - path: /opt/dotfiles
                readOnly: true
