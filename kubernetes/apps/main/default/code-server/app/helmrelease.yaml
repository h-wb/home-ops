---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app code-server
spec:
  interval: 1h
  # Above the init container's own limit: a first bootstrap installs every
  # tool, and a shorter wait would roll the upgrade back mid-install.
  timeout: 65m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      code-server:
        # One pod on the home volume: two bootstraps must never run at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # The dotfiles provision this pod as class `code-server` at every
          # start. pod-bootstrap is called by path in the checkout, never
          # through a link the bootstrap manages, and the editor starts even
          # when it fails (dotfiles doctor `code-server-bootstrap` says why).
          bootstrap:
            image: &image
              repository: ghcr.io/coder/code-server
              tag: 4.145.2
            command:
              - /bin/sh
              - -c
              - |
                [ -d /home/coder/.dotfiles/.git ] || timeout 300 git clone --quiet https://github.com/h-wb/dotfiles.git /home/coder/.dotfiles
                timeout 3300 sh /home/coder/.dotfiles/scripts/pod-bootstrap || echo "pod-bootstrap failed; starting the editor anyway"
            env: &env
              HOME: /home/coder
              TZ: Europe/Paris
            envFrom: &envFrom
              - secretRef:
                  name: code-server-secret
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        containers:
          app:
            image: *image
            args:
              # No password: authentication is delegated to the kanidm
              # SecurityPolicy on the HTTPRoute (components/oidc/envoy).
              - --auth
              - none
              - --bind-addr
              - 0.0.0.0:8080
              - --disable-telemetry
              - --disable-update-check
              - --disable-workspace-trust
              - /home/coder/Repositories/home-ops
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: code-server
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Code Server
          gethomepage.dev/icon: code-server.png
          gethomepage.dev/description: VS Code
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: /home/coder
