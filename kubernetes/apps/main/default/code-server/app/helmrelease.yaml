---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app code-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      code-server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Seed the workspace on first boot only; afterwards the clone lives
          # on the PVC and is managed from inside the editor like any checkout.
          clone:
            image: &image
              repository: ghcr.io/coder/code-server
              tag: 4.134.0
            command:
              - /bin/sh
              - -c
              - test -d /home/coder/home-ops/.git || git clone https://github.com/h-wb/home-ops.git /home/coder/home-ops
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image: *image
            args:
              # No password: authentication is delegated to the kanidm
              # SecurityPolicy on the HTTPRoute (components/oidc/envoy).
              - --auth
              - none
              - --bind-addr
              - 0.0.0.0:8080
              - --disable-telemetry
              - --disable-update-check
              - --disable-workspace-trust
              - /home/coder/home-ops
            env:
              TZ: Europe/Paris
              # Kept off ~/.kube so kubectl still has a writable dir there for
              # its discovery cache (the secret mount is read-only).
              KUBECONFIG: /var/run/secrets/kubeconfig/config
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Code Server
          gethomepage.dev/icon: code-server.png
          gethomepage.dev/description: VS Code
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      home:
        existingClaim: *app
        advancedMounts:
          code-server:
            clone:
              - path: /home/coder
            app:
              - path: /home/coder
      kubeconfig:
        type: secret
        name: code-server-secret
        # root:1000 — group-readable so uid 1000 can read it, nothing wider.
        defaultMode: 0440
        advancedMounts:
          code-server:
            app:
              - path: /var/run/secrets/kubeconfig
                readOnly: true
