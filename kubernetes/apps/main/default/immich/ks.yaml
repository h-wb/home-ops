---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/dragonfly
    - ../../../../../components/dragonfly/lua-undeclared-keys
    - ../../../../../components/cnpg/restore
    - ../../../../../components/cnpg/extensions/vchord
    - ../../../../../components/gpu
    - ../../../../../components/oidc
  dependsOn:
    - name: plugin-barman-cloud
      namespace: database
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 30m
  path: ./kubernetes/apps/main/default/immich/app
  postBuild:
    substitute:
      APP: *app
      APP_NAMESPACE: default
      OIDC_DISPLAY_NAME: Immich
      OIDC_CALLBACK: /auth/login
      OIDC_EXTRA_CALLBACKS: ', "https://immich.${SECRET_DOMAIN}/user-settings", "https://immich.${SECRET_DOMAIN}/api/oauth/mobile-redirect"'
      OIDC_SHORT_USERNAME: "true"
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
