---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: v1
kind: ConfigMap
metadata:
  name: neko-desktop-provision
  annotations:
    # This ConfigMap is a shell script, and ks.yaml runs Flux post-build
    # substitution over everything it renders — in strict mode, so every
    # ${HOME}/${PATH} in here is read as an unset Flux variable and the whole
    # Kustomization fails to apply. Nothing in this file needs substituting.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  # First boot only: clones ~/.dotfiles onto a fresh PVC and hands over. Once
  # applied, the dotfiles' own autostart entry (same filename, so it overrides
  # this one) runs neko-bootstrap directly. Keep this file dumb.
  neko-provision: |
    #!/bin/sh
    set -u
    LOG="${HOME}/.local/state/neko-provision.log"
    mkdir -p "$(dirname "$LOG")"
    exec >>"$LOG" 2>&1
    echo "=== $(date -Is) provision start ==="

    export PATH="${HOME}/.local/bin:${PATH}"
    REPO_URL="${REPO_URL:-https://github.com/h-wb/dotfiles.git}"

    if [ ! -d "${HOME}/.dotfiles/.git" ]; then
      # git is not in the image.
      if ! command -v git >/dev/null 2>&1; then
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends git
      fi
      echo "[info] cloning ${REPO_URL}"
      git clone "$REPO_URL" "${HOME}/.dotfiles" || exit 1
    fi

    exec "${HOME}/.dotfiles/conf.d/neko/bin/neko-bootstrap"

  # Runs neko-provision through sh, so the ConfigMap's mount mode does not have
  # to carry an executable bit.
  mise-bootstrap.desktop: |
    [Desktop Entry]
    Type=Application
    Name=mise bootstrap
    Comment=Clone/refresh ~/.dotfiles and provision this container at session start
    Exec=/bin/sh /usr/local/bin/neko-provision
    Icon=preferences-system
    Terminal=false
    StartupNotify=false
    X-XFCE-Autostart-Override=true

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: v1
kind: ConfigMap
metadata:
  name: neko-desktop-dns
data:
  # Per-domain DNS routing for this pod, which is what /etc/resolver/<domain>
  # gives a Mac. Kubernetes has no per-domain equivalent: dnsConfig is an ordered
  # list of nameservers and resolution stops at the first that answers, and
  # cluster CoreDNS *does* answer for the domain — with the public Cloudflare
  # record — so simply listing k8s-gateway second would never be consulted.
  #
  # Hence a resolver in the pod that can route per zone.
  Corefile: |
    ${SECRET_DOMAIN}:53 {
        errors
        cache 30
        forward . ${SVC_K8S_GATEWAY}
    }
    .:53 {
        errors
        cache 30
        # The cluster DNS address explicitly, NOT /etc/resolv.conf: this pod's
        # resolv.conf points at 127.0.0.1, i.e. back at this server, which would
        # be an immediate loop.
        forward . ${SVC_CLUSTER_DNS}
    }
