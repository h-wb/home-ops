---
# AnkiConnect, from the Anki that runs in the desktop (dotfiles: conf.d/neko).
#
# A plain Service rather than a second one in the HelmRelease: app-template
# suffixes Service names once there are two, which would rename the existing
# LoadBalancer. ClusterIP on purpose, so the port never reaches the LAN.
#
# Every request needs the add-on's apiKey, which the dotfiles bootstrap sets
# from Proton Pass; without it the add-on stays on 127.0.0.1 and nothing
# answers here.
apiVersion: v1
kind: Service
metadata:
  name: neko-desktop-ankiconnect
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/controller: neko-desktop
    app.kubernetes.io/instance: neko-desktop
    app.kubernetes.io/name: neko-desktop
  ports:
    - name: http
      port: 8765
      targetPort: 8765
