---
# AnkiConnect, from the Anki the dotfiles run in the desktop (conf.d/anki).
# Not in the HelmRelease: a second app-template Service would rename the
# LoadBalancer. ClusterIP so it never reaches the LAN; requests need the apiKey.
apiVersion: v1
kind: Service
metadata:
  name: neko-desktop-ankiconnect
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/controller: neko-desktop
    app.kubernetes.io/instance: neko-desktop
    app.kubernetes.io/name: neko-desktop
  ports:
    - name: http
      port: 8765
      targetPort: 8765
