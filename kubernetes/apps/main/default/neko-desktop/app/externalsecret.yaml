---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name neko-desktop
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: neko-desktop-secret
    template:
      data:
        NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "{{ .NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD }}"
        NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "{{ .NEKO_MEMBER_MULTIUSER_USER_PASSWORD }}"
        # Proton Pass Personal Access Token, so the desktop can log in without a
        # TTY at session start (scripts/pass-preflight uses it). Create one on a
        # machine that already has a session:
        #   pass-cli personal-access-token create
        # and store it in the `neko` BWS secret as PASS_CLI_PAT. Optional: with
        # it absent the desktop still provisions, just without Proton Pass
        # secrets, so `default ""` keeps a missing field from breaking this sync.
        PASS_CLI_PAT: "{{ .PASS_CLI_PAT | default \"\" }}"
  dataFrom:
    - extract:
        key: neko
