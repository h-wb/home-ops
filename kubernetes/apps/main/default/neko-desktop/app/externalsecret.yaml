---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name neko-desktop
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: neko-desktop-secret
    template:
      data:
        NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "{{ .NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD }}"
        NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "{{ .NEKO_MEMBER_MULTIUSER_USER_PASSWORD }}"
        # Unlocks the desktop's gnome-keyring at session start. Proton Pass
        # stores its local key in the Secret Service, and without a keyring
        # unlocked non-interactively, pass-cli fails with
        # NoStorageAccess(PermissionDenied) and gnome-keyring puts a password
        # dialog on the desktop. Add a KEYRING_PASSWORD field to the `neko`
        # BWS secret; any value works, it only protects the keyring at rest on
        # the PVC.
        KEYRING_PASSWORD: "{{ .KEYRING_PASSWORD | default \"\" }}"
  dataFrom:
    # Shares the neko entry rather than adding a second BWS secret: both
    # instances sit behind the same kanidm SecurityPolicy, so these passwords
    # gate the room, not the perimeter.
    - extract:
        key: neko
