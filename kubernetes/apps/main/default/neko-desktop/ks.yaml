---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app neko-desktop
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/gpu
    - ../../../../../components/kopiur/backup
    - ../../../../../components/oidc/envoy
  dependsOn: []
  interval: 30m
  path: ./kubernetes/apps/main/default/neko-desktop/app
  postBuild:
    substitute:
      APP: *app
      APP_NAMESPACE: *namespace
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_SCHEDULE: "45 4 * * *"
      # k8s-gateway serves the internal records for ${SECRET_DOMAIN}; the DNS
      # sidecar forwards that zone to it and everything else to cluster DNS.
      SVC_K8S_GATEWAY: "192.168.1.200"
      SVC_CLUSTER_DNS: "10.43.0.10"
      OIDC_DISPLAY_NAME: Neko Desktop
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
      OIDC_IMAGE_NAME: xfce
      OIDC_EXTRA_CALLBACKS: '["https://nkd.${SECRET_DOMAIN}/oauth2/callback"]'
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
