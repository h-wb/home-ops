---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name karakeep
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: karakeep-secret
    template:
      engineVersion: v2
      data:
        # App
        NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
        MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"
        # Scoped LiteLLM key (llm/litellm virtualkeys/karakeep.yaml), copied into
        # the Bitwarden `karakeep` item since the generated secret lives in llm.
        OPENAI_API_KEY: "{{ .LITELLM_API_KEY }}"
  dataFrom:
    - extract:
        key: karakeep
