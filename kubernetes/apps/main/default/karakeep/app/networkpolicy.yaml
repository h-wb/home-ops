---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Beyond the internet (policy.home.arpa/egress): its search index, its browser
# and LiteLLM for tagging. The browser and the index carry the label too.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: karakeep
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: karakeep
      app.kubernetes.io/controller: karakeep
      policy.home.arpa/egress: internet
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: karakeep
            app.kubernetes.io/controller: meilisearch
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: karakeep
            app.kubernetes.io/controller: chrome
      toPorts:
        - ports:
            - port: "9222"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
            k8s:io.kubernetes.pod.namespace: llm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
