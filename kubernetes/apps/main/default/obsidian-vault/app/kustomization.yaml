---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./seekstone.yaml
  # TEMPORARY (2026-11), see the file.
  - ./seekstone-review.yaml
configMapGenerator:
  # Referenced by literal name inside the MCPServers: no hash suffix.
  - name: seekstone-src
    options:
      disableNameSuffixHash: true
    files:
      - package.json=./seekstone/package.json
      - package-lock.json=./seekstone/package-lock.json
