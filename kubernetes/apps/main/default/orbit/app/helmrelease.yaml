---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orbit
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      orbit:
        # SQLite holds an exclusive lock; never start a second instance on upgrades.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/coollabsio/orbit
              tag: 0.4.1@sha256:5193908ece7f08ea08e40a0c04a81a323dcd5d382b819459c43840bf7ab58dff
            env:
              ORBIT_PUBLIC_ORIGIN: https://orbit.${SECRET_DOMAIN}
              # Envoy uses pod IPs; only it can reach the backend (ingress.home.arpa label).
              # Loopback is for the Orbit healthcheck.
              ORBIT_TRUSTED_PROXIES: 127.0.0.1/32,10.42.0.0/16
              ORBIT_OPEN_REGISTRATION: "false"
              ORBIT_BACKUPS_PATH: /var/lib/orbit/backups
            envFrom:
              - secretRef:
                  name: orbit-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec: &healthcheck
                    command: ["/orbit", "healthcheck"]
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *healthcheck
                  timeoutSeconds: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      labels:
        ingress.home.arpa/envoy-internal: allow
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: orbit
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - orbit.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: orbit
        globalMounts:
          - path: /var/lib/orbit
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
