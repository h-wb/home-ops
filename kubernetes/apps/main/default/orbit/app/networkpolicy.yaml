---
# Restrict the backend to the trusted reverse proxy so other pods cannot send forwarding headers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orbit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: orbit
      app.kubernetes.io/controller: orbit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - port: 8080
          protocol: TCP
