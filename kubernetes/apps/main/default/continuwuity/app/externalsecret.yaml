---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
# Registration is open only while the token field exists; clear it once the accounts are made.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: continuwuity
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: continuwuity-secret
    template:
      engineVersion: v2
      data:
        CONTINUWUITY_ALLOW_REGISTRATION: '{{ if (index . "REGISTRATION_TOKEN" | default "" | trim) }}true{{ else }}false{{ end }}'
        CONTINUWUITY_REGISTRATION_TOKEN: '{{ index . "REGISTRATION_TOKEN" | default "" | trim }}'
  dataFrom:
    - extract:
        key: continuwuity
