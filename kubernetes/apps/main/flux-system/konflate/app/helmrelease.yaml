---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  chartRef:
    kind: OCIRepository
    name: ${APP}
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      repo: github://h-wb/home-ops
      clusterPath: ./kubernetes/clusters/${KONFLATE_CLUSTER}
      kubeVersion: "{{ .Capabilities.KubeVersion.Version }}"
      statusChecks: true
      # Also keeps each instance's PR comment separate (it doubles as the comment tag).
      statusCheckName: "Konflate (${KONFLATE_CLUSTER})"
      prComments: true
      # No publicUrl: it would put the domain in every (public) PR comment.
      verifyImages: true
      extraEnv:
        - name: KONFLATE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: ${APP}-webhook-secret
              key: KONFLATE_WEBHOOK_SECRET
    secret:
      existingSecret: ${APP}-secret
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
        gethomepage.dev/enabled: "true"
        gethomepage.dev/app: ${APP}
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/name: Konflate (${KONFLATE_CLUSTER})
        gethomepage.dev/icon: flux-cd.png
        gethomepage.dev/description: Rendered Flux PR diffs
      parentRefs:
        # External so GitHub can deliver webhooks to /hooks; the UI is read-only.
        - name: envoy-external
          namespace: network
      hostnames:
        - "${APP}.${SECRET_DOMAIN}"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
