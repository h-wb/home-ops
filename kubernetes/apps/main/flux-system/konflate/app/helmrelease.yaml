---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      repo: github://h-wb/home-ops
      # One instance renders one cluster; edge PRs are covered by the CI diff.
      clusterPath: ./kubernetes/clusters/main
      kubeVersion: "{{ .Capabilities.KubeVersion.Version }}"
      statusChecks: true
      prComments: true
      # No publicUrl: it would put the domain in every (public) PR comment.
      verifyImages: true
      extraEnv:
        - name: KONFLATE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: konflate-webhook-secret
              key: KONFLATE_WEBHOOK_SECRET
    secret:
      existingSecret: konflate-secret
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
        gethomepage.dev/enabled: "true"
        gethomepage.dev/app: konflate
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/name: Konflate
        gethomepage.dev/icon: flux-cd.png
        gethomepage.dev/description: Rendered Flux PR diffs
      parentRefs:
        # External so GitHub can deliver webhooks to /hooks; the UI is read-only.
        - name: envoy-external
          namespace: network
      hostnames:
        - "konflate.${SECRET_DOMAIN}"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
