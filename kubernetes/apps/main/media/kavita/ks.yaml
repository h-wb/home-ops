---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kavita
spec:
  targetNamespace: media
  components:
    - ../../../../../components/zeroscaler
    - ../../../../../components/kopiur/backup
    - ../../../../../components/oidc
  path: ./kubernetes/apps/main/media/kavita/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: media
      APP_NAMESPACE: media
      OIDC_DISPLAY_NAME: Kavita
      OIDC_CALLBACK: /signin-oidc
      OIDC_SHORT_USERNAME: "true"
      OIDC_SCOPES: '["openid", "profile", "email", "offline_access", "roles"]'
      KOPIUR_SCHEDULE: "33 * * * *"
      KOPIUR_CAPACITY: 2Gi
