---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app romm
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/dragonfly
    - ../../../../../components/zeroscaler
    - ../../../../../components/kopiur/backup
    - ../../../../../components/cnpg/restore
    - ../../../../../components/oidc
  dependsOn:
    - name: plugin-barman-cloud
      namespace: database
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  path: ./kubernetes/apps/main/media/romm/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      APP_NAMESPACE: *namespace
      KOPIUR_SCHEDULE: "39 * * * *"
      KOPIUR_CAPACITY: 5Gi
      OIDC_DISPLAY_NAME: RomM
      OIDC_CALLBACK: /api/oauth/openid
      OIDC_SHORT_USERNAME: "true"
      OIDC_DISABLE_PKCE: "true"
      OIDC_CLIENT_ID_KEY: OIDC_CLIENT_ID
      OIDC_CLIENT_SECRET_KEY: OIDC_CLIENT_SECRET
