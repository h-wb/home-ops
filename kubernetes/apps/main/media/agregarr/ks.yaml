---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agregarr
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/zeroscaler
  # kopiur backup dropped temporarily: agregarr's PVC filesystem was corrupted
  # (persistent EROFS - confirmed via `rbd status` showing zero watchers, so
  # not an active lock, and reproducing even on a genuinely fresh pod/mount -
  # ext4-level corruption, not a transient Ceph fencing blip) from the
  # 2026-08-20/21 kopiur-controller incident. Its own hourly snapshots
  # dutifully backed up the corrupted state, so restoring from the latest one
  # would just recreate the same broken filesystem - hence the plain PVC
  # below instead of the usual Restore-sourced one. Re-enabling backups needs
  # more than just re-adding components/kopiur/backup: that would try to
  # (re-)apply a PVC with a dataSourceRef against a live object that no
  # longer has one, which is an illegal immutable-field change.
  path: ./kubernetes/apps/main/media/agregarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
