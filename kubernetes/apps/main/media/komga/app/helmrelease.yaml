---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app komga
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      komga:
        labels:
          nfsMount: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          check-library-access:
            image:
              repository: docker.io/library/busybox
              tag: 1.37.0
            command:
              - sh
              - -ec
              - test -r /data && test -x /data && find /data -maxdepth 2 -type d -exec test -r '{}' \; -print | head -5
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
          migrate-ownership:
            image:
              repository: docker.io/library/busybox
              tag: 1.37.0
            command:
              - sh
              - -ec
              - chown -Rh 1000:1000 /migration && stat -c '%u:%g %a %n' /migration
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
                add: [CHOWN, DAC_READ_SEARCH]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: gotson/komga
              tag: "1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212"
            env:
              TZ: Europe/Paris
              SERVER_PORT: &port 8080
              KOMGA_CORS_ALLOWED_ORIGINS: https://komf.${SECRET_DOMAIN}
              # OIDC via Kanidm. Client id/secret arrive via envFrom kanidm-komga-oidc
              # (keys are the two SPRING_..._CLIENT_ID/_SECRET names). Spring is a
              # confidential client and doesn't send PKCE → kanidm client disables it.
              SERVER_FORWARD_HEADERS_STRATEGY: framework
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KANIDM_CLIENT_NAME: Kanidm
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KANIDM_SCOPE: openid,email,profile
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KANIDM_CLIENT_AUTHENTICATION_METHOD: client_secret_basic
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KANIDM_REDIRECT_URI: "{baseUrl}/login/oauth2/code/kanidm"
              SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KANIDM_ISSUER_URI: https://idm.${SECRET_DOMAIN}/oauth2/openid/komga
              SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KANIDM_USER_NAME_ATTRIBUTE: email
            envFrom:
              - secretRef:
                  name: kanidm-komga-oidc
            resources:
              requests:
                cpu: 15m
                memory: 1Gi
              limits:
                memory: 4Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: komga
          gethomepage.dev/group: Library
          gethomepage.dev/name: Komga
          gethomepage.dev/icon: komga.png
          gethomepage.dev/description: Comic/Ebook Web Reader
          gethomepage.dev/widget.type: komga
          gethomepage.dev/widget.url: http://komga.media:8080
          gethomepage.dev/widget.username: "{{ `{{HOMEPAGE_VAR_KOMGA_USERNAME}}` }}"
          gethomepage.dev/widget.password: "{{ `{{HOMEPAGE_VAR_KOMGA_PASSWORD}}` }}"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          komga:
            app:
              - path: /config
            migrate-ownership:
              - path: /migration
      media:
        type: nfs
        server: ${NFS_ADDR:=temp}
        path: /mnt/tank/shared
        advancedMounts:
          komga:
            app:
              - path: /data
                subPath: Literature
            check-library-access:
              - path: /data
                subPath: Literature
                readOnly: true
