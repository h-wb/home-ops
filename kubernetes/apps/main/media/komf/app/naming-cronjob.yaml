---
# Komf enriches metadata; this applies the display rules it cannot express.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: komga-titles
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: titles
              image: docker.io/library/python:3.13-alpine@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca
              command:
                - python3
                - -B
                - /scripts/komga_titles.py
                - --apply
              env:
                - name: KOMGA_BASE_URI
                  value: http://komga.media.svc.cluster.local:8080
                - name: KOMGA_API_KEY_FILE
                  value: /etc/komga-titles/api-key
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: api-key
                  mountPath: /etc/komga-titles
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: komga-titles
            - name: api-key
              secret:
                secretName: komf-secret
                items:
                  - key: KOMGA_API_KEY
                    path: api-key
