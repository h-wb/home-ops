---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app codex
spec:
  targetNamespace: media
  components:
    - ../../../../../components/zeroscaler
    - ../../../../../components/kopiur/backup
  path: ./kubernetes/apps/main/media/codex/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: media
      KOPIUR_SCHEDULE: "32 * * * *"
      KOPIUR_CAPACITY: 2Gi
