---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kritika
  namespace: &namespace kritika
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/cnpg/initdb
    - ../../../../../components/cnpg/extensions/vchord
    - ../../../../../components/oidc
  dependsOn:
    - name: plugin-barman-cloud
      namespace: database
    - name: litellm
      namespace: llm
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 30m
  path: ./kubernetes/apps/main/kritika/kritika/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      APP_NAMESPACE: *namespace
      CNPG_REPLICAS: "2"
      CNPG_SIZE: 5Gi
      OIDC_DISPLAY_NAME: Kritika
      OIDC_CALLBACK: /auth/callback/oidc
      OIDC_SHORT_USERNAME: "true"
      # Same pattern as grafana: kanidm group membership becomes a role claim
      # that kritika's roleMappingExpr reads.
      OIDC_CLAIM_MAPS: '{"kritika_role":{"joinType":"array","valuesByGroup":{"admins":["admin"],"users":["member"]}}}'
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
