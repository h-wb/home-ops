---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kritika-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The GitHub App kritika reviews through (Developer settings → GitHub Apps).
        GITHUB_APP_PRIVATE_KEY: "{{ .GITHUB_APP_PRIVATE_KEY }}"
        GITHUB_APP_WEBHOOK_SECRET: "{{ .GITHUB_APP_WEBHOOK_SECRET }}"
        # Local admin: the way into a fresh instance and break-glass when kanidm is down.
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        # Scoped LiteLLM key (llm/litellm virtualkeys/kritika.yaml), copied here
        # because the generated secret lives in llm.
        LITELLM_API_KEY: "{{ .LITELLM_API_KEY }}"
  dataFrom:
    - extract:
        key: kritika
---
# Letters and digits only, so the password needs no escaping inside a URI.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kritika-db-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Generated once and never rotated (CreatedOnce); the DatabaseRole sets the role's
# password from this Secret, so regenerating it after a loss heals on its own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kritika-db-app
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: kritika_app
        password: "{{ .password }}"
        uri: "postgres://kritika_app:{{ .password }}@postgres-kritika-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kritika-db-password
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Generated once and never rotated (CreatedOnce); the DatabaseRole sets the role's
# password from this Secret, so regenerating it after a loss heals on its own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kritika-db-runner
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: kritika_runner
        password: "{{ .password }}"
        uri: "postgres://kritika_runner:{{ .password }}@postgres-kritika-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kritika-db-password
