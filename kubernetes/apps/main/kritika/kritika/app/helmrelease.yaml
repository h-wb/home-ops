---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    database:
      owner:
        # CNPG's generated initdb owner secret.
        existingSecret: postgres-kritika-app
      app:
        existingSecret: kritika-db-app
      runner:
        existingSecret: kritika-db-runner
    config:
      webUrl: https://kritika.${SECRET_DOMAIN}
      authAdminPassword:
        valueFrom:
          secretKeyRef: { name: kritika-secret, key: ADMIN_PASSWORD }
      authOidcName: Kanidm
      authOidcIssuer: https://idm.${SECRET_DOMAIN}/oauth2/openid/kritika
      # kanidm's client id is the client name.
      authOidcClientId: kritika
      authOidcClientSecret:
        valueFrom:
          secretKeyRef: { name: kanidm-kritika-oidc, key: client-secret }
      authOidcRolesClaim: kritika_role
      authOidcRoleMappingExpr: '"admin" in roles ? "admin" : ("member" in roles ? "member" : "")'
    envFrom:
      - secretRef:
          name: kritika-secret
    configFile:
      apps:
        github:
          accounts: [h-wb]
          # The bot-dupont GitHub App (the reviewer; bot-dupond is the Renovate/konflate
          # one). An identifier, not a secret.
          clientId: Iv23liZw13NGq9jhSodg
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      # Everything goes through LiteLLM (no pay-per-token key). Two models:
      # - the default is local, so a repository is never sent to a cloud model
      #   just because the App got installed on it;
      # - h-wb/home-ops, which is public, is reviewed by ChatGPT (see repositories).
      providers:
        litellm:
          type: openai
          baseUrl: http://litellm.llm.svc.cluster.local:4000/v1
          apiKey: { env: LITELLM_API_KEY }
          retries: 2
      embedding:
        model: litellm/embed
        # nomic-embed-text-v1.5: 768 dimensions and a 2048-token window, so cap
        # each chunk well under it (code runs ~3 characters a token).
        dims: 768
        maxItemChars: 5000
        # A small general-purpose embedder scores most chunks of a repo of
        # similar files above the 0.5 default.
        similarFloor: 0.7
      defaults:
        models:
          review: litellm/qwen3.5-9b-chat
        feedback: standard
        # Renovate pushes in bursts (rebases); review the last head once.
        settle: 60s
        # Big generated diffs aren't worth the context; `@<bot> review` still forces one.
        maxChangedLines: 2000
        agent:
          commands: [gh, curl, fd, jq, rg, yq]
        limits:
          # Every ChatGPT call costs subscription quota (karakeep shares it), and a
          # rebase storm should not drain a week of it.
          reviewsPerDay: 40
          concurrency: 2
      repositories:
        # Public repository: reviewed by ChatGPT on the Plus subscription. This
        # replaces the Claude Code "Renovate PR Review" workflow as the approval
        # the main-require-review ruleset needs: a review with nothing blocking or
        # important approves the pull request, a later one that finds something
        # withdraws it. The review rules live in the repository (.kritika.yaml).
        # No fallback model on purpose: if ChatGPT is out of quota the pull request
        # waits, rather than being approved by the small local model.
        h-wb/home-ops:
          models:
            review: litellm/chatgpt/gpt-6-luna
          approve: true
      egress:
        # Where the agent's curl/gh may go for release notes, changelogs and charts.
        # github.com and api.github.com are allowed by the app itself.
        allowHosts:
          - "*.githubusercontent.com"
          - "*.github.io"
          - artifacthub.io
          - ghcr.io
          - hub.docker.com
          - quay.io
    runner:
      resources:
        requests: { cpu: 10m, memory: 128Mi }
        limits: { memory: 1Gi }
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    networkPolicy:
      enabled: true
      type: cilium
      # 443 for GitHub and kanidm, 4000 for LiteLLM in-cluster.
      egressPorts: [443, 4000]
    monitoring:
      serviceMonitor:
        enabled: true
    httpRoute:
      enabled: true
      hostnames:
        - kritika.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-external
          namespace: network
