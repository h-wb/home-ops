---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Its own namespace on purpose: kritika's Role can create, patch and delete every
# Secret in the namespace it runs in, and its runner Jobs process untrusted PR
# content. Kept apart from llm so it cannot rewrite LiteLLM's or ToolHive's secrets.
namespace: kritika
components:
  - ../../../components/common
resources:
  - ./kritika/ks.yaml
