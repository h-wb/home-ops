# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
# How kritika (the self-hosted PR reviewer, kubernetes/apps/main/kritika) reviews this
# repository. Read from each pull request's merge base, so a pull request cannot weaken
# its own review, and a branch older than this file is reviewed without it.
# The model and whether a clean review approves are set by the admin config
# (kritika's HelmRelease), not here.
rules:
  # Renovate's pull requests are the ones that auto-merge on an approval, so the
  # review has to say what the upgrade breaks, not just read the diff.
  - id: renovate-upgrade
    file: .kritika/renovate.md
    when: [{ expr: pr.headRef.startsWith("renovate/") }]
# kritika stopped loading agent files on its own in 0.0.61.
context:
  - path: AGENTS.md
    description: Repository layout, GitOps conventions and known pitfalls
# Beside the runner image's curl, find, gh, grep and jq.
tools:
  # renovate: datasource=github-releases depName=sharkdp/fd
  aqua:sharkdp/fd: v10.5.0
  # renovate: datasource=github-releases depName=BurntSushi/ripgrep
  aqua:BurntSushi/ripgrep: 15.2.0
  # renovate: datasource=github-releases depName=mikefarah/yq
  aqua:mikefarah/yq: v4.54.1
